services:
  pyroscope:
    image: grafana/pyroscope
    command: ["-self-profiling.disable-push=true"]
    ports:
      - 4040:4040
  tempo:
    image: grafana/tempo
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./scripts/provisioning/tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
    ports:
      - 3200:3200
  alloy:
    image: grafana/alloy
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./scripts/provisioning/alloy/config.alloy:/etc/alloy/config.alloy:ro
    ports:
      - 4317:4317
      - 4318:4318
      - 12345:12345
    depends_on:
      - tempo
  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_PLUGINS_PREINSTALL_SYNC=grafana-pyroscope-app
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./scripts/provisioning:/etc/grafana/provisioning
    ports:
      - 3000:3000
    depends_on:
      - tempo
      - pyroscope

volumes:
  tempo-data:
