[target.wasm32-unknown-unknown]
runner = "wasm-server-runner"
rustflags = ["--cfg", "web_sys_unstable_apis"]

# Leave headroom for the desktop: a negative value means "logical cores minus
# N" (cargo has no percentage form). 20 cores - 4 = 16 = the 80% the justfile
# computes exactly via CARGO_BUILD_JOBS, which overrides this when set.
[build]
jobs = -4
