[target.wasm32-unknown-unknown]
runner = "wasm-server-runner"
rustflags = ["--cfg", "web_sys_unstable_apis"]

# Leave headroom for the desktop: a negative value means "logical cores minus
# N" (cargo has no percentage form). 20 cores - 4 = 16 = the 80% the justfile
# computes exactly via CARGO_BUILD_JOBS, which overrides this when set.
[build]
jobs = -4

# Region edge in chunks, read at BUILD time by `game::REGION_CHUNKS`
# (crates/game/src/protocol.rs; legal values there). It lives here so raw
# `cargo`, rust-analyzer and `just` all compile with the SAME value — cargo
# fingerprints the variable, and "unset" vs "32" would rebuild `game` and
# everything downstream each time you alternated. A value already in the
# environment wins, which is how `just region_chunks=64 …` overrides it.
[env]
VOXEL_REGION_CHUNKS = "32"
VOXEL_CELL_CHUNKS = "0"
# Spawn island diameter in 64 m cells (`worldgen::islands::SPAWN_ISLAND_CELLS`,
# 0 = its default); `just island=64 …`.
VOXEL_ISLAND_CELLS = "0"
