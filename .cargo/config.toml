[target.wasm32-unknown-unknown]
runner = "wasm-server-runner"
rustflags = ["--cfg", "web_sys_unstable_apis"]

# Leave headroom for the desktop: a negative value means "logical cores minus
# N" (cargo has no percentage form). 20 cores - 4 = 16 = the 80% the justfile
# computes exactly via CARGO_BUILD_JOBS, which overrides this when set.
[build]
jobs = -4

# Nightly-only (rust-toolchain.toml pins a dated nightly): keep crate metadata
# only in the .rmeta, not duplicated into every .rlib (`-Zembed-metadata=no`;
# ~10-30% of a target dir). Nightly cargo already defaults to it — pinned here
# so a toolchain bump that changes the default doesn't silently grow target/.
[unstable]
embed-metadata = false
# Per-package `rustflags` in Cargo.toml profiles (the client's `-Clto=off`).
profile-rustflags = true
# Resolve dependency features for the WHOLE workspace whatever `-p` selects.
# Without it `cargo build -p client` (smoke, test-one, …) and a root
# `cargo build --bin client` / `--workspace` enabled different features on 26
# shared deps (tokio, rapier3d, typenum, hashbrown, …), so each selection built
# its own copy of rapier → game → worldgen → client and of the Slint stack →
# slint-ui, and every .slint edit paid the slint-ui compile once per copy.
feature-unification = true

[resolver]
feature-unification = "workspace"

# Region edge in BLOCKS, read at BUILD time by `game::REGION_BLOCKS`
# (crates/game/src/protocol.rs; legal values there). It lives here so raw
# `cargo`, rust-analyzer and `just` all compile with the SAME value — cargo
# fingerprints the variable, and "unset" vs "32" would rebuild `game` and
# everything downstream each time you alternated. A value already in the
# environment wins, which is how `just region_blocks=128 …` overrides it.
# (The old VOXEL_REGION_CHUNKS / VOXEL_CELL_CHUNKS and the removed cell mode's
# VOXEL_CELL_BLOCKS fail the build on purpose.)
[env]
VOXEL_REGION_BLOCKS = "64"
# Spawn island diameter in 64 m cells (`worldgen::islands::SPAWN_ISLAND_CELLS`,
# 0 = its default); `just island=64 …`.
VOXEL_ISLAND_CELLS = "0"
