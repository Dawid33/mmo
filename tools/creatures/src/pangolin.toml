# DF PANGOLIN (creature_tropical_new): 5 kg, scaled anteater-like mammal.
# Attack scratch (the template's `attack` lunge); bite optional, not made.
# A small pointed head, arched scaly back (a raised scale cube over the body),
# a long thick scaled tail; overlapping-scale rows are darker bands on top.
name = "pangolin"
template = "quadruped"
status = "draft"

[proportions]
body = [5, 4, 8]
leg = [2, 2]
leg_ends = 0
head = [3, 3, 3]
head_up = -1
tail = [3, 10]
tail_raise = -12
walk = { cycle = 0.7, swing = 26, bob = 0.15 }
run = { cycle = 0.42, swing = 40, bob = 0.4, pitch = 4 }
idle = { length = 4.5, look = 16, breath = 0.1, wag = 5 }
attack = { length = 0.5, lunge = 2 }
eat = { length = 1.6, reach = 35, forward = 1.5 }

# Head pivot: the neck joint; the head cube spans y -3..0, z -2..1 around it.
[[cubes]]
name = "snout"
bone = "head"
part = "snout"
from = [-1, -3, -5]
to = [1, -1.5, -2]

# Body pivot: its centre (top at y 2). The arched scale shell.
[[cubes]]
name = "shell"
bone = "body"
part = "scales"
from = [-3, 0, -3.5]
to = [3, 3.5, 4.5]

[palette]
fur = "#9a7a52"
fur_down = "#c4ab8a"
legs = "#7a5e40"
head = "#a8896a"
snout = "#c4ab8a"
scales = "#8a6a44"
scales_up = "#9a7a50"
tail = "#8a6a44"
tail_down = "#c4ab8a"
row = "#5e4628"
eye = "#0c0a08"
nose = "#3a2c22"

# Scale rows across the shell top (6 wide × 8 long, row 0 at the front) and sides.
[[decals]]
cube = "shell"
face = "up"
x = 0
y = 1
w = 6
colour = "row"

