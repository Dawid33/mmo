# DF HELMET_SNAKE (underground): 50 kg, "its head is covered in armor so that it
# resembles the head of a dragon". Serpent; about 3 m here, pale grey scales (DF
# colour 7:0:1, white) under a dark bony helm: a plate over the crown, a nose
# plate and two horns sweeping back. Attack: bite. LARGE_PREDATOR: alert, roar.
name = "helmet snake"
template = "serpent"
status = "draft"
extras = ["alert", "roar"]

decals = [
  { cube = "seg0", face = "up", x = 2, y = 0, w = 2, h = 7, colour = "ridge" },
  { cube = "seg1", face = "up", x = 2, y = 0, w = 2, h = 7, colour = "ridge" },
  { cube = "seg2", face = "up", x = 2, y = 0, w = 1, h = 7, colour = "ridge" },
  { cube = "seg3", face = "up", x = 1, y = 0, w = 2, h = 7, colour = "ridge" },
  { cube = "seg4", face = "up", x = 1, y = 0, w = 1, h = 7, colour = "ridge" },
  { cube = "head", face = "west", x = 1, y = 0, w = 2, h = 1, colour = "eye" },
  { cube = "head", face = "east", x = 4, y = 0, w = 2, h = 1, colour = "eye" },
  { cube = "snout", face = "west", x = 0, y = 2, w = 3, h = 1, colour = "mouth" },
  { cube = "snout", face = "east", x = 0, y = 2, w = 3, h = 1, colour = "mouth" },
  { cube = "head", face = "west", x = 0, y = 3, w = 7, h = 1, colour = "mouth" },
  { cube = "head", face = "east", x = 0, y = 3, w = 7, h = 1, colour = "mouth" },
]

[proportions]
segments = 6
seg = [6, 4.5, 7]
taper = 0.4
head = [6, 4, 7]
walk = { cycle = 2.0, amp = 18 }
run = { cycle = 1.0, amp = 24 }

# Head pivot: the neck, mid-height of seg0 (y = 2.25); the head is y -2.25..1.75,
# z -7..0 from it.
[[cubes]]
name = "snout"
bone = "head"
part = "head"
from = [-2, -2.25, -9.5]
to = [2, 0.75, -7]

[[cubes]]
name = "helm"
bone = "head"
part = "helm"
from = [-3.5, 1.75, -6.5]
to = [3.5, 2.75, 0.5]

[[cubes]]
name = "nose_plate"
bone = "head"
part = "helm"
from = [-2.5, 0.75, -9.5]
to = [2.5, 1.75, -6]

[[cubes]]
name = "horn_l"
bone = "head"
part = "horn"
from = [-3.5, 2, -1]
to = [-2, 3.5, 4]
mirror = true

[palette]
body = "#c9c7bd"
body_up = "#d6d4ca"
body_down = "#eceae0"
head = "#bdbbb0"
ridge = "#a19e92"
helm = "#4d4a45"
helm_up = "#5c5952"
horn = "#3a3733"
eye = "#e0b53a"
mouth = "#2a2522"
