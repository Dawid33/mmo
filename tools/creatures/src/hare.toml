# DF HARE (creature_temperate): 3.5 kg, wild long-eared hopper.
# Attacks bite (the template's `attack`) and scratch (optional, not made).
# Tall black-tipped ears; a fast bounding run (high bob, deep pitch).
name = "hare"
template = "quadruped"
status = "draft"

[proportions]
body = [4, 4, 8]
leg = [2, 3]
leg_ends = 0
head = [3, 4, 3]
head_up = 2
tail = [2, 2]
tail_raise = 30
walk = { cycle = 0.45, swing = 30, bob = 0.3 }
run = { cycle = 0.3, swing = 55, bob = 1.4, pitch = 10 }
idle = { length = 3.5, look = 25, breath = 0.12, wag = 4 }
attack = { length = 0.45, lunge = 2 }
eat = { length = 1.2, reach = 45, forward = 1.5 }

# Head pivot: the neck joint; the head cube spans y -1..3, z -2..1 around it.
[[cubes]]
name = "snout"
bone = "head"
part = "snout"
from = [-1, -1, -3]
to = [1, 0.5, -2]

[[cubes]]
name = "ear_l"
bone = "head"
part = "ears"
mirror = true
from = [-1.5, 3, 0]
to = [-0.5, 8, 1]

[palette]
fur = "#9b7b55"
fur_up = "#8e704c"
fur_down = "#e2d3bb"
legs = "#a3835c"
head = "#9b7b55"
snout = "#c9b394"
ears = "#a3835c"
tail = "#f2ede4"
tail_up = "#3a2e24"
eye = "#1a120c"
tip = "#1e1814"

[[decals]]
cube = "head"
face = "north"
x = 0
y = 1
colour = "eye"

[[decals]]
cube = "head"
face = "north"
x = 2
y = 1
colour = "eye"

[[decals]]
cube = "ear_l"
face = "north"
x = 0
y = 0
colour = "tip"

[[decals]]
cube = "ear_r"
face = "north"
x = 0
y = 0
colour = "tip"

[[decals]]
cube = "ear_l"
face = "up"
x = 0
y = 0
colour = "tip"

[[decals]]
cube = "ear_r"
face = "up"
x = 0
y = 0
colour = "tip"
