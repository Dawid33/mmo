# DF FISH_TUNA_BLUEFIN (wild, large ocean): 600 kg, a deep torpedo-shaped fast
# swimmer. Crescent (lunate) tail as a bar plus two swept-back tips, keels on the
# tail stalk, a second dorsal and yellow finlets (decals) toward the tail.
# Attacks bite (the template's `attack`) and slap (optional, not made).
name = "bluefin tuna"
template = "fish"
status = "draft"

[proportions]
body = [10, 12, 22]
head = [8, 10, 7]
tail = [3, 4, 5]
fin = [1, 12, 1.5]
pectoral = [4, 5]
dorsal = [1, 3, 6]
swim = { cycle = 0.9, amp = 12 }

# Body pivot: its centre; the body spans y -6..6, z -11..11.
[[cubes]]
name = "dorsal_2"
bone = "body"
part = "fins"
from = [-0.5, 6, 5]
to = [0.5, 9, 8]

# Tail pivot: the body's back at mid-height; the stalk spans y -2..2, z 0..5.
[[cubes]]
name = "keel_l"
bone = "tail"
part = "fins"
from = [-2, -0.5, 1]
to = [2, 0.5, 4]

# Tail fin pivot: the stalk's end; the bar spans y -6..6, z 0..1.5.
[[cubes]]
name = "tip_up"
bone = "tail_fin"
part = "fins"
from = [-0.5, 3, 1.5]
to = [0.5, 6, 4.5]

[[cubes]]
name = "tip_down"
bone = "tail_fin"
part = "fins"
from = [-0.5, -6, 1.5]
to = [0.5, -3, 4.5]

[palette]
body = "#2d4f86"
body_up = "#1d2f5a"
body_down = "#d4d8de"
head = "#2d4f86"
head_up = "#1d2f5a"
head_down = "#d4d8de"
fins = "#24304d"
finlet = "#e2c23a"
stripe = "#8fb0cf"
eye = "#101014"
eye_ring = "#b9c2cf"

