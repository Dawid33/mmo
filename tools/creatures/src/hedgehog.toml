# DF HEDGEHOG (vermin, creature_small_mammal_new): 0.8 kg, a small round spiny
# insect-eater. It has a giant, so the full quadruped rig at small size: a round
# body under a big brown spine coat (a cube over the back, pale-tipped speckles as
# decals), a pale pointed face with a dark nose, small ears, stubby legs, no
# visible tail. Attack bite (the template's `attack`). Rolling into a ball is not
# modelled.
name = "hedgehog"
template = "quadruped"
status = "draft"

decals = [
  { cube = "head", face = "west", x = 0, y = 0, colour = "eye" },
  { cube = "head", face = "east", x = 1, y = 0, colour = "eye" },
  { cube = "snout", face = "north", x = 0, y = 0, colour = "nose" },
  { cube = "spines", face = "up", x = 0, y = 1, colour = "tip" },
  { cube = "spines", face = "up", x = 2, y = 0, colour = "tip" },
  { cube = "spines", face = "up", x = 4, y = 1, colour = "tip" },
  { cube = "spines", face = "up", x = 1, y = 3, colour = "tip" },
  { cube = "spines", face = "up", x = 3, y = 2, colour = "tip" },
  { cube = "spines", face = "up", x = 0, y = 4, colour = "tip" },
  { cube = "spines", face = "up", x = 3, y = 4, colour = "tip" },
  { cube = "spines", face = "west", x = 1, y = 0, colour = "tip" },
  { cube = "spines", face = "west", x = 3, y = 1, colour = "tip" },
  { cube = "spines", face = "east", x = 1, y = 1, colour = "tip" },
  { cube = "spines", face = "east", x = 3, y = 0, colour = "tip" },
]

[proportions]
body = [4, 3, 5]
leg = [1, 1]
leg_ends = 0.5
head = [2, 2, 2]
head_up = 0
head_overlap = 0
tail = [1, 0]
tail_raise = 0
walk = { cycle = 0.32, swing = 28, bob = 0.1 }
run = { cycle = 0.22, swing = 40, bob = 0.25, pitch = 3 }
idle = { length = 3.5, look = 25, breath = 0.08, wag = 0 }
attack = { length = 0.35, lunge = 0.8 }
eat = { length = 1.2, reach = 30, forward = 0.5 }

# Head pivot: the neck joint; the head cube spans y -1..1, z -2..0 around it.
[[cubes]]
name = "snout"
bone = "head"
part = "head"
from = [-0.5, -1, -3]
to = [0.5, 0, -2]

[[cubes]]
name = "ear_l"
bone = "head"
part = "ears"
mirror = true
from = [-1, 1, -0.5]
to = [-0.5, 1.5, 0]

# The spine coat over the back (body pivot: its centre; the body spans
# y -1.5..1.5, z -2.5..2.5).
[[cubes]]
name = "spines"
bone = "body"
part = "spines"
from = [-2.5, -0.5, -2.5]
to = [2.5, 2, 3]

[palette]
fur = "#c8b494"
legs = "#8a7660"
head = "#d4c2a2"
ears = "#a89276"
tail = "#c8b494"
spines = "#6a5242"
spines_up = "#5e4838"
tip = "#e6dcc8"
eye = "#0c0a08"
nose = "#1c1612"
