# DF BLENDEC_FOUL (fantastic, evil): 60 kg, "a man-shaped creature with the legs of
# a goat and the empty-eyed skull of a goat". Biped like the satyr, 30 units: ashen
# grey skin, shaggy dark goat legs on black hooves, a bone-white goat skull for a
# head (long muzzle, black empty sockets) with swept-back horns, a short tail.
# LARGE_PREDATOR: alert + roar. Attacks punch (the template's `attack`); kick, gore,
# scratch, bite optional (not made). Worker set from the biped (they can learn).
name = "foul blendec"
template = "biped"
status = "draft"
extras = ["alert", "roar"]

[proportions]
leg = [4, 12]
foot = 2
body = [10, 10, 6]
arm = [3, 12]
head = [6, 7, 6]
walk = { cycle = 0.9, swing = 28 }

# Head pivot: the neck; the skull spans y 0..7, z -3..3.
[[cubes]]
name = "muzzle"
bone = "head"
part = "head"
from = [-2, 0, -7]
to = [2, 3.5, -3]

[[cubes]]
name = "horn_l"
bone = "head"
part = "horn"
mirror = true
from = [-3, 6, -1]
to = [-1.5, 9, 1]

[[cubes]]
name = "horn_back_l"
bone = "head"
part = "horn"
mirror = true
from = [-3.5, 8, 1]
to = [-2, 9.5, 5]

# Leg pivots: the hips; shaggy thighs.
[[cubes]]
name = "thigh_l"
bone = "leg_l"
part = "fur"
mirror = true
from = [-2.5, -6, -2.5]
to = [2.5, 0, 2.5]

[[cubes]]
name = "tail"
bone = "torso"
part = "fur"
from = [-1, -1, 3]
to = [1, 2, 5]

[palette]
head = "#e6e0cc"
head_up = "#f0ead8"
hands = "#6e6a66"
torso = "#76726c"
torso_up = "#827e78"
arms = "#76726c"
legs = "#3e3228"
feet = "#141010"
fur = "#3a2e24"
horn = "#4a4038"
socket = "#0a0808"
nostril = "#2a2420"

# The skull's front face is 6×7 (row 0 at the top): empty sockets.
[[decals]]
cube = "head"
face = "north"
x = 0
y = 1
w = 2
h = 2
colour = "socket"

[[decals]]
cube = "head"
face = "north"
x = 4
y = 1
w = 2
h = 2
colour = "socket"

[[decals]]
cube = "muzzle"
face = "north"
x = 1
y = 0
colour = "nostril"

[[decals]]
cube = "muzzle"
face = "north"
x = 2
y = 0
colour = "nostril"
