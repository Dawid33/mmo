# DF BIRD_PENGUIN_LITTLE (wild, shorelines): 1.5 kg, "a small flightless bird, blue
# in color". Bird template, flier = false, the body stood upright: 10 units tall,
# slate-blue back and head, white front, a dark bill. Not AMPHIBIOUS in the raws,
# but a penguin swims: swim + swim_idle. LAYS_EGGS but wild: no brood. Attack bite
# (the template's peck).
name = "little penguin"
template = "bird"
status = "draft"
extras = ["swim", "swim_idle"]

[proportions]
body = [4, 7, 4]
leg = [1, 1]
foot = [2, 1, 2]
head = [3, 3, 3]
neck = 0
head_back = 2.5
beak = [1, 1, 1.5]
tail = [0, 0, 0]
wing = [1, 1]
flier = false
walk = { cycle = 0.4, swing = 22, bob = 0.2, nod = 0.3 }
run = { cycle = 0.26, swing = 34, lean = 8 }

# Body pivot: its centre. Flippers hang down the sides (static cubes: the bird
# template's wings fold along the back, so they are kept as stubs); the short tail
# sits at the bottom of the back.
[[cubes]]
name = "flipper_l"
bone = "body"
part = "wings"
mirror = true
from = [-2.5, -2.5, -1]
to = [-2, 2.5, 0.5]

[[cubes]]
name = "tail_stub"
bone = "body"
part = "wings"
from = [-1, -3.5, 2]
to = [1, -3, 3]

# A side-to-side waddle on the walk (keys at 0, half and full cycle).
[clips.walk]
merge = true
keys = [
  { bone = "body", channel = "rotation", time = 0, value = [0, 0, 7] },
  { bone = "body", channel = "rotation", time = 0.2, value = [0, 0, -7] },
  { bone = "body", channel = "rotation", time = 0.4, value = [0, 0, 7] },
]

[palette]
body = "#4a6a8e"
body_north = "#f2f2ee"
body_down = "#e6e6e2"
head = "#4a6a8e"
wings = "#42607e"
tail = "#42607e"
legs = "#e8c8c0"
beak = "#2a2a2e"
eye = "#e8e0d0"
pupil = "#141414"

[[decals]]
cube = "head"
face = "west"
x = 1
y = 1
colour = "pupil"

[[decals]]
cube = "head"
face = "east"
x = 1
y = 1
colour = "pupil"
