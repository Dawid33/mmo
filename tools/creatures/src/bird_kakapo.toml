# DF BIRD_KAKAPO (wild): 3 kg, the kakapo: a heavy, flightless nocturnal parrot, moss
# green above, yellow-green below, an owl-like pale facial disc, ivory bill. Not a
# FLIER (flier = false). Attack: bite (the template's peck).
name = "kakapo"
template = "bird"
status = "draft"

[proportions]
body = [6, 6, 8]
leg = [1, 2]
foot = [3, 1, 2]
head = [4, 4, 3]
neck = 1
head_back = 2
beak = [2, 2, 1]
tail = [4, 1, 3]
tail_raise = 10
wing = [6, 4]
flier = false
walk = { cycle = 0.75, swing = 24, bob = 0.3 }
run = { cycle = 0.45, swing = 36 }

[palette]
