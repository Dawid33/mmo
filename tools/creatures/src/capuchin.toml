# DF CAPUCHIN (wild, tropical forests): 3.5 kg, a tiny diurnal tree monkey.
# Quadruped template with a long tail: dark brown body and limbs, a cream face,
# throat and shoulders under a black cap. Attacks bite (the template's
# `attack`) and scratch (optional, not made). CURIOUSBEAST_ITEM / _EATER:
# pick_up + carry.
name = "capuchin"
template = "quadruped"
status = "draft"
extras = ["pick_up", "carry"]

[proportions]
body = [3, 3, 7]
leg = [1, 4]
head = [3, 3, 3]
head_up = 2
tail = [1, 9]
tail_raise = 30
walk = { cycle = 0.5, swing = 32, bob = 0.2 }
run = { cycle = 0.3, swing = 50, bob = 0.5, pitch = 7 }
idle = { length = 3.5, look = 30, breath = 0.1, wag = 10 }
attack = { length = 0.45, lunge = 1.5 }
eat = { length = 1.3, reach = 40, forward = 1 }

# Head pivot: the neck joint; the head cube spans y 0..3, z -2..1 around it.
[[cubes]]
name = "muzzle"
bone = "head"
part = "face"
from = [-1, 0, -2.5]
to = [1, 1, -2]

[[cubes]]
name = "cap"
bone = "head"
part = "cap"
from = [-1.5, 3, -2]
to = [1.5, 3.5, 1]

# Body pivot: its centre; the cream shoulders wrap the front of the body.
[[cubes]]
name = "shoulders"
bone = "body"
part = "cream"
from = [-1.5, -1.5, -3.5]
to = [1.5, 1.5, -2]

[palette]
fur = "#4a3424"
fur_down = "#5a4230"
legs = "#2e2018"
head = "#e0caa0"
head_up = "#2a1e16"
tail = "#3a2a1e"
face = "#e8c8a8"
cap = "#2a1e16"
cream = "#e0caa0"
cream_down = "#d0b890"
eye = "#1e1410"
nose = "#7a5040"

# The head's front face is 3×3 (row 0 at the top).
[[decals]]
cube = "head"
face = "north"
x = 0
y = 1
colour = "eye"

[[decals]]
cube = "head"
face = "north"
x = 2
y = 1
colour = "eye"

[[decals]]
cube = "muzzle"
face = "north"
x = 0
y = 0
w = 2
colour = "nose"
