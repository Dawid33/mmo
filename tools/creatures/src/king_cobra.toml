# DF KING_COBRA (wild): 6 kg, venomous, "the warning of its hood". Serpent; about
# 2.5 m here, olive-brown with pale chevron crossbands. The hood is two flaps
# (hood_l/hood_r bones on seg0) folded down along the neck at rest; the idle
# rears the front of the body upright and spreads them. Attack: bite.
name = "king cobra"
template = "serpent"
status = "draft"

decals = [
  { cube = "seg1", face = "up", x = 0, y = 1, w = 4, h = 1, colour = "band" },
  { cube = "seg1", face = "up", x = 1, y = 2, w = 2, h = 1, colour = "band" },
  { cube = "seg2", face = "up", x = 0, y = 1, w = 3, h = 1, colour = "band" },
  { cube = "seg2", face = "up", x = 1, y = 2, w = 1, h = 1, colour = "band" },
  { cube = "seg3", face = "up", x = 0, y = 1, w = 3, h = 1, colour = "band" },
  { cube = "seg3", face = "up", x = 1, y = 2, w = 1, h = 1, colour = "band" },
  { cube = "seg4", face = "up", x = 0, y = 1, w = 2, h = 1, colour = "band" },
  { cube = "seg1", face = "west", x = 0, y = 0, w = 1, h = 3, colour = "band" },
  { cube = "seg1", face = "east", x = 5, y = 0, w = 1, h = 3, colour = "band" },
  { cube = "seg2", face = "west", x = 0, y = 0, w = 1, h = 3, colour = "band" },
  { cube = "seg2", face = "east", x = 5, y = 0, w = 1, h = 3, colour = "band" },
  { cube = "seg3", face = "west", x = 0, y = 0, w = 1, h = 2, colour = "band" },
  { cube = "seg3", face = "east", x = 5, y = 0, w = 1, h = 2, colour = "band" },
  # The pale throat that shows under the raised hood.
  { cube = "seg0", face = "north", x = 1, y = 0, w = 2, h = 3, colour = "throat" },
  { cube = "head", face = "up", x = 1, y = 3, w = 2, h = 1, colour = "band" },
  { cube = "head", face = "west", x = 1, y = 0, colour = "eye" },
  { cube = "head", face = "east", x = 2, y = 0, colour = "eye" },
]

[proportions]
segments = 6
seg = [4, 2.5, 6]
taper = 0.35
head = [4, 2.5, 4]
walk = { cycle = 1.3, amp = 22 }
run = { cycle = 0.65, amp = 28 }

# Head pivot: the neck, mid-height of seg0 (y = 1.25).
[[cubes]]
name = "snout"
bone = "head"
part = "head"
from = [-1.5, -1.25, -5.5]
to = [1.5, 0.75, -4]

# Hood flaps: hinged on seg0's top edges (seg0's pivot is its back end), folded
# down along the flanks at rest (rest z = 90 hangs the flap's outer edge down).
[[bones]]
name = "hood_l"
parent = "seg0"
pivot = [-2, 1.25, -3.5]
rest = [0, 0, 90]
mirror = true

[[cubes]]
name = "hood_l"
bone = "hood_l"
part = "hood"
from = [-2.5, -0.5, -2.5]
to = [0, 0, 2.5]
mirror = true

[palette]
body = "#5f5534"
body_up = "#56502f"
body_down = "#d8cc94"
head = "#6a5d36"
hood = "#5f5534"
hood_down = "#d8cc94"
band = "#d8cc94"
throat = "#e6dba8"
eye = "#1a160c"

# Reared up: seg1 slopes up, seg0 stands upright, the head looks forward, the
# hood spread. A slow sway.
[clips.idle]
mode = "loop"
length = 4.0
keys = [
  { bone = "seg1", channel = "rotation", time = 0.0, value = [40, 0, 0] },
  { bone = "seg1", channel = "rotation", time = 1.0, value = [40, 6, 0] },
  { bone = "seg1", channel = "rotation", time = 2.0, value = [40, 0, 0] },
  { bone = "seg1", channel = "rotation", time = 3.0, value = [40, -6, 0] },
  { bone = "seg1", channel = "rotation", time = 4.0, value = [40, 0, 0] },
  { bone = "seg0", channel = "rotation", time = 0.0, value = [50, 0, 0] },
  { bone = "seg0", channel = "rotation", time = 1.0, value = [50, 0, -4] },
  { bone = "seg0", channel = "rotation", time = 2.0, value = [50, 0, 0] },
  { bone = "seg0", channel = "rotation", time = 3.0, value = [50, 0, 4] },
  { bone = "seg0", channel = "rotation", time = 4.0, value = [50, 0, 0] },
  { bone = "head", channel = "rotation", time = 0.0, value = [-85, 0, 0] },
  { bone = "head", channel = "rotation", time = 1.0, value = [-82, -8, 0] },
  { bone = "head", channel = "rotation", time = 2.0, value = [-85, 0, 0] },
  { bone = "head", channel = "rotation", time = 3.0, value = [-82, 8, 0] },
  { bone = "head", channel = "rotation", time = 4.0, value = [-85, 0, 0] },
  { bone = "hood_l", channel = "rotation", time = 0.0, value = [0, 0, -100] },
  { bone = "hood_l", channel = "rotation", time = 4.0, value = [0, 0, -100] },
  { bone = "hood_r", channel = "rotation", time = 0.0, value = [0, 0, 100] },
  { bone = "hood_r", channel = "rotation", time = 4.0, value = [0, 0, 100] },
]
