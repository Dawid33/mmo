# DF MANDRILL (wild, tropical forests): 20 kg, a large monkey with a blue face
# and rump that raids crops and garbage. Quadruped template: a heavy olive
# body, a stub tail, a long muzzle with a red ridge and blue grooved sides, a
# yellow beard, and a blue-and-red rump. Attacks bite (the template's
# `attack`, the powerful jaws) and scratch (optional, not made).
# CURIOUSBEAST_ITEM / _EATER: pick_up + carry. TRAINABLE but not a mount.
name = "mandrill"
template = "quadruped"
status = "draft"
extras = ["pick_up", "carry"]

[proportions]
body = [6, 6, 11]
leg = [2, 6]
head = [5, 5, 4]
head_up = 2
tail = [1, 2]
tail_raise = 30
walk = { cycle = 0.75, swing = 28, bob = 0.3 }
run = { cycle = 0.42, swing = 46, bob = 0.7, pitch = 6 }
idle = { length = 4.0, look = 25, breath = 0.15, wag = 6 }
attack = { length = 0.55, lunge = 2.5 }
eat = { length = 1.5, reach = 45, forward = 2 }

# Head pivot: the neck joint; the head cube spans y -2..3, z -3..1 around it.
[[cubes]]
name = "muzzle"
bone = "head"
part = "muzzle"
from = [-1, -1.5, -5.5]
to = [1, 1, -3]

[[cubes]]
name = "beard"
bone = "head"
part = "beard"
from = [-2, -3, -3.5]
to = [2, -1.5, -0.5]

# Body pivot: its centre; the rump pad on the back of the body.
[[cubes]]
name = "rump"
bone = "body"
part = "rump"
from = [-2.5, -2.5, 5.5]
to = [2.5, 1.5, 6]

[palette]
fur = "#4e4a36"
fur_up = "#5a5438"
fur_down = "#7a7868"
legs = "#444030"
head = "#4e4a36"
tail = "#444030"
muzzle = "#4a78b8"
muzzle_up = "#c83a30"
muzzle_north = "#c83a30"
muzzle_down = "#3a3428"
beard = "#d8c060"
rump = "#4a70c8"
rump_down = "#c04060"
eye = "#e0a020"
nose = "#100c08"

# The head's front face is 5×5 (row 0 at the top); the muzzle covers its lower
# rows, the eyes sit above it.
[[decals]]
cube = "head"
face = "north"
x = 1
y = 1
colour = "eye"

[[decals]]
cube = "head"
face = "north"
x = 3
y = 1
colour = "eye"

[[decals]]
cube = "muzzle"
face = "north"
x = 0
y = 0
w = 2
colour = "nose"

[[decals]]
cube = "rump"
face = "south"
x = 1
y = 2
w = 3
h = 2
colour = "rump_down"
