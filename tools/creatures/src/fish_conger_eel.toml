# DF FISH_CONGER_EEL (wild, ocean): 50 kg, "a medium-sized, brown, snake-like
# fish". Serpent template (eels per the authoring notes): six segments, a long
# continuous dorsal fin fold from behind the head to the tail tip, small
# pectoral fins behind the head, a pale belly. AQUATIC: swim, swim_idle (the
# slither, slowed). Attack bite (the template's strike).
name = "conger eel"
template = "serpent"
status = "draft"
extras = ["swim", "swim_idle"]

decals = [
  { cube = "head", face = "west", x = 1, y = 0, colour = "eye" },
  { cube = "head", face = "east", x = 2, y = 0, colour = "eye" },
  { cube = "head", face = "north", x = 0, y = 2, w = 3, h = 1, colour = "mouth" },
  { cube = "head", face = "west", x = 0, y = 2, w = 3, h = 1, colour = "mouth" },
  { cube = "head", face = "east", x = 1, y = 2, w = 3, h = 1, colour = "mouth" },
]

[proportions]
segments = 6
seg = [3, 3, 3.5]
taper = 0.5
head = [3, 3, 4]
walk = { cycle = 1.2, amp = 22 }
run = { cycle = 0.7, amp = 28 }

# Segment pivots: the back end of each segment at y = 1.5 (mid-height of seg0);
# segment k spans z -3.5..0 and its top is at y = 1.5, 1, 1, 0.5, 0.5, 0 for k = 0..5.
[[cubes]]
name = "fin1"
bone = "seg1"
part = "fins"
from = [-0.25, 1, -3.5]
to = [0.25, 2, 0]

[[cubes]]
name = "fin2"
bone = "seg2"
part = "fins"
from = [-0.25, 1, -3.5]
to = [0.25, 2, 0]

[[cubes]]
name = "fin3"
bone = "seg3"
part = "fins"
from = [-0.25, 0.5, -3.5]
to = [0.25, 1.5, 0]

[[cubes]]
name = "fin4"
bone = "seg4"
part = "fins"
from = [-0.25, 0.5, -3.5]
to = [0.25, 1.5, 0]

[[cubes]]
name = "fin5"
bone = "seg5"
part = "fins"
from = [-0.25, 0, -3.5]
to = [0.25, 1, 1.5]

# Pectorals just behind the head on seg0 (its sides at x = ±1.5).
[[cubes]]
name = "pec_l"
bone = "seg0"
part = "fins"
from = [-2.5, -0.5, -3]
to = [-1.5, 0, -1.5]
mirror = true

[palette]
body = "#6a5a44"
body_up = "#54473a"
body_down = "#c8bc9c"
head = "#62523e"
head_up = "#4e4234"
fins = "#4a3e30"
mouth = "#2a1e18"
eye = "#d8c890"
