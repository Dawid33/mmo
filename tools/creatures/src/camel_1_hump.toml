# DF CAMEL_1_HUMP (creature_domestic): 600 kg, dromedary; mount and pack animal.
# Attack kick (the template's `attack` lunge); bite optional, not made (DF
# camels spit in the description only; no SPIT interaction in the raws).
# MOUNT: ridden. A neck bone carries the head forward and up; the hump is a
# body cube.
name = "one-humped camel"
template = "quadruped"
status = "draft"
extras = ["ridden"]

[proportions]
body = [10, 10, 20]
leg = [3, 15]
head = [4, 4, 8]
head_up = 1
neck = [4, 13, 40]
tail = [2, 8]
tail_raise = -65
walk = { cycle = 1.35, swing = 20, bob = 0.5 }
run = { cycle = 0.7, swing = 38, bob = 1.2, pitch = 4 }
idle = { length = 5.0, look = 18, breath = 0.25, wag = 6 }
attack = { length = 0.8, lunge = 4 }
eat = { length = 2.0, reach = 45, forward = 2 }

# Body pivot: the body's centre (top at y 5).

[[cubes]]
name = "hump"
bone = "body"
part = "hump"
from = [-4, 5, -5]
to = [4, 10, 4]

[[cubes]]
name = "hump_top"
bone = "body"
part = "hump"
from = [-3, 10, -3]
to = [3, 11.5, 2]

# Head pivot: the end of the neck; the head cube spans y -1..3, z -7..1.

[[cubes]]
name = "muzzle"
bone = "head"
part = "muzzle"
from = [-1.5, -1, -8.5]
to = [1.5, 2, -7]

[[cubes]]
name = "ear_l"
bone = "head"
part = "ears"
mirror = true
from = [-2.5, 3, 0]
to = [-1.5, 4, 1]

[[cubes]]
name = "tuft"
bone = "tail"
part = "tuft"
from = [-1.5, -1.5, 7]
to = [1.5, 1.5, 9]

[palette]
fur = "#c69a62"
fur_up = "#cfa46c"
fur_down = "#b48a56"
legs = "#c09460"
head = "#c69a62"
neck = "#c69a62"
neck_down = "#b48a56"
muzzle = "#b08454"
hump = "#cfa46c"
ears = "#a8804e"
tail = "#b48a56"
tuft = "#5a4028"
eye = "#120e0b"
nostril = "#3a2a1c"

[[decals]]
cube = "head"
face = "west"
x = 2
y = 0
w = 1
h = 1
colour = "eye"

[[decals]]
cube = "head"
face = "east"
x = 5
y = 0
w = 1
h = 1
colour = "eye"

[[decals]]
cube = "muzzle"
face = "north"
x = 0
y = 0
w = 1
h = 1
colour = "nostril"

[[decals]]
cube = "muzzle"
face = "north"
x = 2
y = 0
w = 1
h = 1
colour = "nostril"
