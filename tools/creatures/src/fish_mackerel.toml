# DF FISH_MACKEREL (vermin, ocean): 0.2 kg, "a medium-sized oceanic fish prized for its
# meat". Vermin form: `move` + `death` only (vermin have no attack clip). Blue-green back with black tiger bars, silver-white belly, two
# dorsals and a forked tail.
name = "mackerel"
template = "vermin"
status = "draft"

decals = [
  { cube = "head", face = "west", x = 0, y = 0, colour = "eye" },
  { cube = "head", face = "east", x = 1, y = 0, colour = "eye" },
  { cube = "body", face = "up", x = 0, y = 0, colour = "bar" },
  { cube = "body", face = "up", x = 1, y = 1, colour = "bar" },
  { cube = "body", face = "up", x = 0, y = 2, colour = "bar" },
  { cube = "body", face = "up", x = 1, y = 3, colour = "bar" },
  { cube = "body", face = "up", x = 0, y = 4, colour = "bar" },
]

[proportions]
body = [1.25, 1.75, 5]
head = [1.25, 1.5, 1.25]
legs = 0
move = "swim"
cycle = 0.4

# Body pivot: its centre; the body spans y -0.875..0.875, z -2.5..2.5.
# The tail bone sits at the body's rear; the head's pivot is the body's front
# (the head spans y -0.875..0.625, z -1.25..0).
[[bones]]
name = "tail"
parent = "body"
pivot = [0, 0, 2.5]

[[cubes]]
name = "tail_fin"
bone = "tail"
part = "fins"
from = [-0.25, -0.875, 0]
to = [0.25, 0.875, 1.25]

[[cubes]]
name = "dorsal"
bone = "body"
part = "fins"
from = [-0.25, 0.875, -1.5]
to = [0.25, 1.375, -0.5]

[[cubes]]
name = "fin_l"
bone = "body"
part = "fins"
from = [-1.375, -0.625, -2.25]
to = [-0.625, -0.375, -1.25]
mirror = true

[[cubes]]
name = "dorsal_2"
bone = "body"
part = "fins"
from = [-0.25, 0.875, 0.5]
to = [0.25, 1.25, 1.5]

[palette]
eye = "#101010"
body = "#c6d0cc"
body_up = "#2e7a72"
body_down = "#f0f0ea"
head = "#b8c4c0"
head_up = "#2a6e68"
fins = "#4e6a66"
bar = "#16201e"

# The tail fin wags harder than the body's swim yaw.
[clips.move]
merge = true
mode = "loop"
length = 0.4
keys = [
  { bone = "tail", channel = "rotation", time = 0, value = [0, 0, 0] },
  { bone = "tail", channel = "rotation", time = 0.1, value = [0, 25, 0] },
  { bone = "tail", channel = "rotation", time = 0.2, value = [0, 0, 0] },
  { bone = "tail", channel = "rotation", time = 0.3, value = [0, -25, 0] },
  { bone = "tail", channel = "rotation", time = 0.4, value = [0, 0, 0] },
]
