# DF STOAT (creature_tundra_taiga_new): 0.35 kg, small weasel-like hunter.
# Attack bite (the template's `attack`); scratch optional, not made. Long thin
# body, brown above and cream below, and the black tail tip.
name = "stoat"
template = "quadruped"
status = "draft"

[proportions]
body = [3, 3, 5]
leg = [1, 2]
leg_ends = 0
head = [3, 2, 2]
head_up = 0
tail = [1, 4]
tail_raise = 20
walk = { cycle = 0.42, swing = 34, bob = 0.15 }
run = { cycle = 0.28, swing = 50, bob = 0.5, pitch = 8 }
idle = { length = 3.5, look = 26, breath = 0.08, wag = 8 }
attack = { length = 0.35, lunge = 1.5 }
eat = { length = 1.2, reach = 35, forward = 1 }

# Head pivot: the neck joint; the head cube spans y -1..1, z -1..1 around it.
[[cubes]]
name = "snout"
bone = "head"
part = "snout"
from = [-0.5, -1, -2]
to = [0.5, 0, -1]

[[cubes]]
name = "ear_l"
bone = "head"
part = "ears"
mirror = true
from = [-1.5, 1, 0]
to = [-1, 1.5, 0.5]

[[cubes]]
name = "tail_tip"
bone = "tail"
part = "tip"
from = [-0.5, -0.5, 3]
to = [0.5, 0.5, 5]

[palette]
fur = "#8a5a32"
fur_up = "#7e522c"
fur_down = "#ece2c8"
legs = "#7a4e2a"
head = "#8a5a32"
head_down = "#ece2c8"
snout = "#8a5a32"
ears = "#7a4e2a"
tail = "#8a5a32"
tip = "#141110"
eye = "#0a0807"
nose = "#2a1a14"

# Eyes on the head's sides (2 × 2 faces; front at west's left / east's right).
[[decals]]
cube = "head"
face = "west"
x = 0
y = 0
colour = "eye"

[[decals]]
cube = "head"
face = "east"
x = 1
y = 0
colour = "eye"

[[decals]]
cube = "snout"
face = "north"
x = 0
y = 0
colour = "nose"
