# DF RAT_LARGE (underground): 25 kg, "a huge rodent found underground"; the
# raws allow many browns, this one is a dark brown with a paler belly. Built
# like the rat: a pointed snout with a pink nose and yellow incisors, round
# pink-lined ears, and a long naked pink tail. Attack bite (the template's
# `attack`); scratch optional, not made. No mount flag.
# CURIOUSBEAST_EATER/GUZZLER: pick_up + carry.
name = "large rat"
template = "quadruped"
status = "draft"
extras = ["pick_up", "carry"]

[proportions]
body = [6, 5, 12]
leg = [2, 3]
leg_ends = 1
head = [5, 4, 3]
head_up = 0
head_overlap = 1
tail = [1, 14]
tail_raise = -6
walk = { cycle = 0.6, swing = 32, bob = 0.3 }
run = { cycle = 0.34, swing = 48, bob = 0.6, pitch = 6 }
idle = { length = 4.0, look = 22, breath = 0.25, wag = 8 }
attack = { length = 0.5, lunge = 2.5 }
eat = { length = 1.4, reach = 40, forward = 1.5 }

# Head pivot: the neck joint; the head cube spans y -3..1, z -2..1 around it.
[[cubes]]
name = "snout"
bone = "head"
part = "snout"
from = [-1.5, -3, -5]
to = [1.5, -0.5, -2]

[[cubes]]
name = "teeth"
bone = "head"
part = "teeth"
from = [-0.5, -4, -4.75]
to = [0.5, -3, -4.25]

[[cubes]]
name = "ear_l"
bone = "head"
part = "ears"
mirror = true
from = [-3, 1, -0.5]
to = [-1, 3, 0]

[palette]
fur = "#5a4636"
fur_up = "#4c3a2c"
fur_down = "#a89a8c"
legs = "#46362a"
head = "#54412f"
head_down = "#a89a8c"
snout = "#5a4636"
snout_down = "#a89a8c"
teeth = "#e8c860"
ears = "#7a6a64"
ears_north = "#d89a9c"
tail = "#d4a0a0"
nose = "#e88a94"
eye = "#0c0a0a"

[[decals]]
cube = "head"
face = "west"
x = 1
y = 0
colour = "eye"

[[decals]]
cube = "head"
face = "east"
x = 1
y = 0
colour = "eye"

[[decals]]
cube = "snout"
face = "north"
x = 1
y = 0
colour = "nose"
