# DF WILD_BOAR (creature_temperate): 80 kg, wild pig of temperate forests.
# Attack kick (the template's `attack` lunge reads as a tusk charge); bite
# optional, not made. High bristled shoulders, long snout, upturned tusks.
name = "wild boar"
template = "quadruped"
status = "draft"

[proportions]
body = [8, 9, 16]
leg = [3, 5]
head = [6, 6, 5]
head_up = -1
tail = [1, 4]
tail_raise = -40
walk = { cycle = 0.85, swing = 26, bob = 0.35 }
run = { cycle = 0.45, swing = 44, bob = 0.9, pitch = 5 }
idle = { length = 4.0, look = 14, breath = 0.2, wag = 14 }
attack = { length = 0.6, lunge = 4.5 }
eat = { length = 1.6, reach = 30, forward = 2 }

# Head pivot: the neck joint; the head cube spans y -6..0, z -4..1 around it.
[[cubes]]
name = "snout"
bone = "head"
part = "snout"
from = [-2, -6, -6]
to = [2, -3, -4]

[[cubes]]
name = "tusk_l"
bone = "head"
part = "tusks"
mirror = true
from = [-3, -5, -6]
to = [-2, -2.5, -5]

[[cubes]]
name = "ear_l"
bone = "head"
part = "ears"
mirror = true
from = [-3, 0, -1]
to = [-1.5, 2, 0]

# The bristle crest along the spine (body pivot: the centre; top at y 4.5).
[[cubes]]
name = "crest"
bone = "body"
part = "bristle"
from = [-1, 4, -8.5]
to = [1, 6, 2]

[palette]
fur = "#4f3d30"
fur_up = "#463528"
fur_down = "#3e3026"
legs = "#2f241c"
head = "#4f3d30"
snout = "#3a2d24"
tusks = "#ece4d0"
ears = "#3a2d24"
bristle = "#2a1f18"
tail = "#2f241c"
eye = "#0e0b09"
nostril = "#c9a59a"

[[decals]]
cube = "head"
face = "north"
x = 1
y = 1
colour = "eye"

[[decals]]
cube = "head"
face = "north"
x = 4
y = 1
colour = "eye"

[[decals]]
cube = "snout"
face = "north"
x = 1
y = 1
colour = "nostril"

[[decals]]
cube = "snout"
face = "north"
x = 2
y = 1
colour = "nostril"
