# DF SHARK_GREAT_WHITE (wild, large ocean): 2000 kg, the giant predator: a
# heavy grey body, white underside, rows of teeth (decals in the mouth).
# Built like the other sharks: the fish template plus a swept two-cube
# dorsal, an upper tail lobe, gill slits and a white lower flank (decals).
# LARGE_PREDATOR: alert, roar. Attacks bite (the template's `attack`) and slap
# (optional, not made).
name = "great white shark"
template = "fish"
status = "draft"
extras = ["alert", "roar"]

[proportions]
body = [12, 13, 28]
head = [10, 10, 10]
tail = [4, 5, 6]
fin = [1, 12, 3]
pectoral = [6, 6]
dorsal = [1, 0, 0]
swim = { cycle = 1.3, amp = 12 }

# Body pivot: its centre; the body spans y -6.5..6.5, z -14..14. The dorsal is a three-step swept triangle.
[[cubes]]
name = "dorsal"
bone = "body"
part = "fins"
from = [-0.5, 6.5, -6]
to = [0.5, 10, 2]

[[cubes]]
name = "dorsal_mid"
bone = "body"
part = "fins"
from = [-0.5, 10, -3.5]
to = [0.5, 12.5, 2.5]

[[cubes]]
name = "dorsal_tip"
bone = "body"
part = "fins"
from = [-0.5, 12.5, -1]
to = [0.5, 14.5, 3]

# Tail fin pivot: the stalk's end; the fin spans y -6..6, z 0..3. The upper lobe is a two-step sweep up and back.
[[cubes]]
name = "lobe_up"
bone = "tail_fin"
part = "fins"
from = [-0.5, 0, 1]
to = [0.5, 10, 4.5]

[[cubes]]
name = "lobe_tip"
bone = "tail_fin"
part = "fins"
from = [-0.5, 9, 4]
to = [0.5, 14, 8]

[palette]
body = "#6e7b85"
body_up = "#56626b"
body_down = "#eef0f0"
head = "#6e7b85"
head_up = "#56626b"
head_down = "#eef0f0"
fins = "#606c75"
belly = "#e9ecec"
eye = "#0b0c0d"
gill = "#2e3336"
mouth = "#2a1c1c"
teeth = "#f4f1ea"

