# DF FISH_SALMON (vermin, ocean/river): 0.2 kg, "a medium-sized red fish that lives in
# the ocean and swims up a river to breed". Vermin form: `move` + `death` only (vermin have no attack clip). Silver-pink flanks, a
# blue-grey speckled back, a tail fin on a bone that wags. Bite: not made.
name = "salmon"
template = "vermin"
status = "draft"

decals = [
  { cube = "head", face = "west", x = 0, y = 0, colour = "eye" },
  { cube = "head", face = "east", x = 1, y = 0, colour = "eye" },
  { cube = "body", face = "up", x = 0, y = 1, colour = "spot" },
  { cube = "body", face = "up", x = 1, y = 3, colour = "spot" },
]

[proportions]
body = [1.5, 2, 5]
head = [1.25, 1.75, 1.5]
legs = 0
move = "swim"
cycle = 0.5

# Body pivot: its centre; the body spans y -1..1, z -2.5..2.5.
# The tail bone sits at the body's rear; the head's pivot is the body's front
# (the head spans y -1..0.75, z -1.5..0).
[[bones]]
name = "tail"
parent = "body"
pivot = [0, 0, 2.5]

[[cubes]]
name = "tail_fin"
bone = "tail"
part = "fins"
from = [-0.25, -1, 0]
to = [0.25, 1, 1.5]

[[cubes]]
name = "dorsal"
bone = "body"
part = "fins"
from = [-0.25, 1, -1]
to = [0.25, 1.75, 0.5]

[[cubes]]
name = "fin_l"
bone = "body"
part = "fins"
from = [-1.5, -0.75, -2.25]
to = [-0.75, -0.5, -1.25]
mirror = true

[palette]
eye = "#101010"
body = "#cfa6a2"
body_up = "#56636e"
body_down = "#ece6e4"
head = "#bf9692"
head_up = "#4f5a63"
fins = "#7d7f86"
spot = "#2e3438"

# The tail fin wags harder than the body's swim yaw.
[clips.move]
merge = true
mode = "loop"
length = 0.5
keys = [
  { bone = "tail", channel = "rotation", time = 0, value = [0, 0, 0] },
  { bone = "tail", channel = "rotation", time = 0.125, value = [0, 25, 0] },
  { bone = "tail", channel = "rotation", time = 0.25, value = [0, 0, 0] },
  { bone = "tail", channel = "rotation", time = 0.375, value = [0, -25, 0] },
  { bone = "tail", channel = "rotation", time = 0.5, value = [0, 0, 0] },
]
