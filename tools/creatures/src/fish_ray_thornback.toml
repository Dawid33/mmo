# DF FISH_RAY_THORNBACK (vermin, shallow seas): 0.2 kg, "a small winged fish".
# Vermin form: `move` + `death` only (vermin have no attack clip). A flat diamond disc (body + wings on bones that undulate), brown with
# pale spots, a row of thorns down the back and tail (decals), a thick short tail with
# two small fins.
name = "thornback ray"
template = "vermin"
status = "draft"

decals = [
  { cube = "head", face = "up", x = 0, y = 0, colour = "eye" },
  { cube = "head", face = "up", x = 1, y = 0, colour = "eye" },
  { cube = "body", face = "up", x = 0, y = 1, colour = "thorn" },
  { cube = "body", face = "up", x = 1, y = 1, colour = "spot" },
  { cube = "body", face = "up", x = 0, y = 2, colour = "spot" },
  { cube = "tail_whip", face = "up", x = 0, y = 0, colour = "thorn" },
  { cube = "tail_whip", face = "up", x = 0, y = 2, colour = "thorn" },
  { cube = "wing_l", face = "up", x = 1, y = 1, colour = "spot" },
  { cube = "wing_r", face = "up", x = 0, y = 1, colour = "spot" },
]

[proportions]
body = [2, 0.75, 3]
head = [1.25, 0.75, 1]
legs = 0
move = "swim"
cycle = 1.2

# Body pivot: its centre; the body spans y -0.375..0.375, z -1.5..1.5.
# Wing bones sit on the body's sides at its centre; the tail bone at its rear.
[[bones]]
name = "tail"
parent = "body"
pivot = [0, 0, 1.5]

[[bones]]
name = "wing_l"
parent = "body"
pivot = [-1, 0, 0]
mirror = true

[[cubes]]
name = "tail_whip"
bone = "tail"
part = "tail"
from = [-0.25, -0.375, 0]
to = [0.25, -0.125, 3]

[[cubes]]
name = "wing_l"
bone = "wing_l"
part = "body"
from = [-2, -0.25, -1.25]
to = [0, 0.25, 1.25]
mirror = true

[[cubes]]
name = "tail_fins"
bone = "tail"
part = "tail"
from = [-0.25, -0.125, 1.75]
to = [0.25, 0.25, 2.5]

[palette]
eye = "#101010"
body = "#9a8058"
body_down = "#f0ece2"
head = "#927852"
head_down = "#f0ece2"
tail = "#8a7250"
thorn = "#f2e8cc"
spot = "#5a4630"

# The wings undulate (+Z lowers the left wing, -Z the right) and the tail sways.
[clips.move]
merge = true
mode = "loop"
length = 1.2
keys = [
  { bone = "wing_l", channel = "rotation", time = 0, value = [0, 0, 0] },
  { bone = "wing_l", channel = "rotation", time = 0.3, value = [0, 0, 20] },
  { bone = "wing_l", channel = "rotation", time = 0.6, value = [0, 0, 0] },
  { bone = "wing_l", channel = "rotation", time = 0.9, value = [0, 0, -20] },
  { bone = "wing_l", channel = "rotation", time = 1.2, value = [0, 0, 0] },
  { bone = "wing_r", channel = "rotation", time = 0, value = [0, 0, 0] },
  { bone = "wing_r", channel = "rotation", time = 0.3, value = [0, 0, -20] },
  { bone = "wing_r", channel = "rotation", time = 0.6, value = [0, 0, 0] },
  { bone = "wing_r", channel = "rotation", time = 0.9, value = [0, 0, 20] },
  { bone = "wing_r", channel = "rotation", time = 1.2, value = [0, 0, 0] },
  { bone = "tail", channel = "rotation", time = 0, value = [0, 0, 0] },
  { bone = "tail", channel = "rotation", time = 0.3, value = [0, 15, 0] },
  { bone = "tail", channel = "rotation", time = 0.6, value = [0, 0, 0] },
  { bone = "tail", channel = "rotation", time = 0.9, value = [0, -15, 0] },
  { bone = "tail", channel = "rotation", time = 1.2, value = [0, 0, 0] },
]
