# DF BEAR_GRIZZLY (creature_large_temperate): 200 kg, big brown bear, large predator.
# Attacks bite (the template's `attack`) and scratch (optional, not made).
# LARGE_PREDATOR: alert + roar; MOUNT_EXOTIC: ridden; CURIOUSBEAST_EATER/
# GUZZLER: pick_up + carry. Bigger than the black bear, with the grizzly's
# shoulder hump, dished face and grizzled tips.
name = "grizzly bear"
template = "quadruped"
status = "draft"
extras = ["alert", "roar", "ridden", "pick_up", "carry"]

[proportions]
body = [12, 11, 20]
leg = [5, 8]
head = [8, 7, 6]
head_up = 0
tail = [2, 2]
tail_raise = -20
walk = { cycle = 1.2, swing = 22, bob = 0.6 }
run = { cycle = 0.65, swing = 38, bob = 1.3, pitch = 5 }
idle = { length = 5.0, look = 16, breath = 0.28, wag = 3 }
attack = { length = 0.8, lunge = 4.5 }
eat = { length = 2.0, reach = 40, forward = 3 }

# Head pivot: the neck joint; the head cube spans y -6..1, z -5..1 around it.

[[cubes]]
name = "snout"
bone = "head"
part = "snout"
from = [-2.5, -6, -8]
to = [2.5, -2.5, -5]

[[cubes]]
name = "ear_l"
bone = "head"
part = "ears"
mirror = true
from = [-4, 1, -1.5]
to = [-2, 3, -0.5]

# The shoulder hump (body pivot: the centre, top at y 5.5).

[[cubes]]
name = "hump"
bone = "body"
part = "hump"
from = [-5.5, 5.5, -9]
to = [5.5, 8, -1]

[palette]
fur = "#6b4a2e"
fur_up = "#7a5636"
fur_down = "#4e3420"
legs = "#4a3220"
head = "#7a5838"
snout = "#a88458"
snout_up = "#8a6a46"
ears = "#4e3420"
hump = "#8a6644"
hump_up = "#a6845e"
tail = "#6b4a2e"
grizzle = "#a6845e"
eye = "#0a0807"
nose = "#141110"

