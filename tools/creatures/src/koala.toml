# DF KOALA (creature_tropical_new): 10 kg, grey tree-dwelling marsupial.
# Attacks bite (the template's `attack`) and scratch (optional, not made).
# Stocky with a big round head, fluffy white-lined ears and a large black nose;
# no visible tail (a stub).
name = "koala"
template = "quadruped"
status = "draft"

[proportions]
body = [7, 7, 9]
leg = [3, 3]
leg_ends = 0
head = [7, 6, 4]
head_up = 3
tail = [2, 1]
tail_raise = 0
walk = { cycle = 0.85, swing = 26, bob = 0.2 }
run = { cycle = 0.5, swing = 40, bob = 0.5, pitch = 4 }
idle = { length = 5.0, look = 20, breath = 0.15, wag = 0 }
attack = { length = 0.55, lunge = 2 }
eat = { length = 1.8, reach = 35, forward = 1.5 }

# Head pivot: the neck joint; the head cube spans y -2..4, z -3..1 around it.

[[cubes]]
name = "nose"
bone = "head"
part = "nose"
from = [-1, -1, -4]
to = [1, 2, -3]

[[cubes]]
name = "ear_l"
bone = "head"
part = "ears"
mirror = true
from = [-5.5, 2, -0.5]
to = [-2.5, 5.5, 1]

[palette]
fur = "#8e8e8a"
fur_up = "#9a9a96"
fur_down = "#d8d6d0"
legs = "#7e7e7a"
head = "#9a9a96"
nose = "#1e1c1a"
ears = "#8e8e8a"
ears_north = "#ecebe6"
tail = "#8e8e8a"
eye = "#0e0b09"
chin = "#e0deda"

[[decals]]
cube = "head"
face = "north"
x = 1
y = 2
w = 1
h = 1
colour = "eye"

[[decals]]
cube = "head"
face = "north"
x = 5
y = 2
w = 1
h = 1
colour = "eye"

[[decals]]
cube = "head"
face = "north"
x = 2
y = 5
w = 3
h = 1
colour = "chin"
