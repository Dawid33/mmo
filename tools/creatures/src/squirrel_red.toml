# DF SQUIRREL_RED (vermin, creature_small_mammals): 0.3 kg, the red tree
# squirrel. It has a giant, so the full quadruped rig at small size: rusty red body with
# a white belly, tufted ears (dark tips), a big bushy tail raised and curled forward over the
# back. Attack bite (the template's `attack`).
name = "red squirrel"
template = "quadruped"
status = "draft"

decals = [
  { cube = "head", face = "west", x = 0, y = 0, colour = "eye" },
  { cube = "head", face = "east", x = 1, y = 0, colour = "eye" },
  { cube = "snout", face = "north", x = 0, y = 0, colour = "nose" },
]

[proportions]
body = [2, 2, 3]
leg = [0.5, 1.5]
leg_ends = 0
head = [2, 2, 1.5]
head_up = 1
head_overlap = 0
tail = [2, 4]
tail_raise = 70
walk = { cycle = 0.28, swing = 32, bob = 0.15 }
run = { cycle = 0.18, swing = 50, bob = 0.45, pitch = 7 }
idle = { length = 3.0, look = 30, breath = 0.05, wag = 8 }
attack = { length = 0.3, lunge = 0.8 }
eat = { length = 1.0, reach = 35, forward = 0.4 }

# Head pivot: the neck joint; the head cube spans y 0..2, z -1.5..0 around it.
[[cubes]]
name = "snout"
bone = "head"
part = "head"
from = [-0.5, 0, -2]
to = [0.5, 0.75, -1.5]

[[cubes]]
name = "ear_l"
bone = "head"
part = "ears"
mirror = true
from = [-1, 2, -0.5]
to = [-0.5, 3, 0]

[[cubes]]
name = "tuft_l"
bone = "head"
part = "tuft"
mirror = true
from = [-1, 3, -0.5]
to = [-0.5, 3.75, 0]

# The curled tip, bent forward over the back (local -y is back toward the rump
# once the tail is raised).
[[cubes]]
name = "tail_tip"
bone = "tail"
part = "tail"
from = [-1, -1, 3]
to = [1, 2, 4.5]

[palette]
fur = "#b0582a"
fur_up = "#9c4c24"
fur_down = "#f0e8dc"
legs = "#a0502a"
head = "#b45c2c"
head_down = "#f0e8dc"
ears = "#9c4c24"
tail = "#a8522a"
tail_up = "#bc6634"
eye = "#0e0c0a"
nose = "#3a2018"
tuft = "#4a2414"
