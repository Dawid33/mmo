face = "up"
x = 1
y = 1
colour = "scale"

[[decals]]
cube = "body"
face = "up"
x = 2
y = 3
colour = "scale"

[[decals]]
cube = "wing_l"
face = "down"
x = 1
y = 1
w = 5
