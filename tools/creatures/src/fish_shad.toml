# DF FISH_SHAD (vermin, ocean/rivers): 0.2 kg, "a small marine fish that travels to
# rivers to breed". Vermin form: `move` + `death` only (vermin have no attack clip). A deep silver herring-like body, blue-grey back, the
# dark shoulder spot behind the gill, forked tail.
name = "shad"
template = "vermin"
status = "draft"

decals = [
  { cube = "head", face = "west", x = 0, y = 0, colour = "eye" },
  { cube = "head", face = "east", x = 1, y = 0, colour = "eye" },
  { cube = "body", face = "west", x = 0, y = 0, colour = "spot" },
  { cube = "body", face = "east", x = 3, y = 0, colour = "spot" },
]

[proportions]
body = [1.25, 2, 4]
head = [1.25, 1.75, 1.25]
legs = 0
move = "swim"
cycle = 0.45

# Body pivot: its centre; the body spans y -1..1, z -2..2.
# The tail bone sits at the body's rear; the head's pivot is the body's front
# (the head spans y -1..0.75, z -1.25..0).
[[bones]]
name = "tail"
parent = "body"
pivot = [0, 0, 2]

[[cubes]]
name = "tail_fin"
bone = "tail"
part = "fins"
from = [-0.25, -1, 0]
to = [0.25, 1, 1.25]

[[cubes]]
name = "dorsal"
bone = "body"
part = "fins"
from = [-0.25, 1, -0.75]
to = [0.25, 1.75, 0.5]

[palette]
eye = "#101010"
body = "#cdd5d9"
body_up = "#4a6a7e"
body_down = "#f0f2f2"
head = "#c2cbd0"
head_up = "#45637a"
fins = "#93a2aa"
spot = "#566068"

# The tail fin wags harder than the body's swim yaw.
[clips.move]
merge = true
mode = "loop"
length = 0.45
keys = [
  { bone = "tail", channel = "rotation", time = 0, value = [0, 0, 0] },
  { bone = "tail", channel = "rotation", time = 0.1125, value = [0, 25, 0] },
  { bone = "tail", channel = "rotation", time = 0.225, value = [0, 0, 0] },
  { bone = "tail", channel = "rotation", time = 0.3375, value = [0, -25, 0] },
  { bone = "tail", channel = "rotation", time = 0.45, value = [0, 0, 0] },
]
