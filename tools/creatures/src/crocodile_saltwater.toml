# DF CROCODILE_SALTWATER (creature_large_tropical): 800 kg, the great estuary
# crocodile. Low body on splayed legs (negative leg_inset), a long flat snout with
# a row of teeth, a scute ridge down the back and a long thick tail; dark olive
# above, pale yellow below. Attack bite (the template's `attack`).
# LARGE_PREDATOR: alert + roar (a hiss); AMPHIBIOUS: swim + swim_idle;
# MOUNT_EXOTIC: ridden. Built like the cave crocodile, a size larger.
name = "saltwater crocodile"
template = "quadruped"
status = "draft"
extras = ["alert", "roar", "swim", "swim_idle", "ridden"]

[proportions]
body = [13, 7, 26]
leg = [3, 4]
leg_inset = -1.5
leg_ends = 2
head = [8, 4, 6]
head_up = -2
head_overlap = 1
tail = [5, 26]
tail_raise = -6
walk = { cycle = 1.35, swing = 26, bob = 0.3 }
run = { cycle = 0.72, swing = 38, bob = 0.6, pitch = 3 }
idle = { length = 6.0, look = 10, breath = 0.2, wag = 4 }
attack = { length = 0.6, lunge = 5 }
eat = { length = 2.0, reach = 8, forward = 3 }

# Head pivot: the neck joint at the body's front, one below its top; the head cube
# spans y -5..-1, z -5..1 around it.
[[cubes]]
name = "snout"
bone = "head"
part = "snout"
from = [-2.5, -5, -15]
to = [2.5, -2.5, -5]

[[cubes]]
name = "brow_l"
bone = "head"
part = "head"
mirror = true
from = [-3.5, -1, -4]
to = [-1.5, 0, -2]

[[cubes]]
name = "nostrils"
bone = "head"
part = "snout"
from = [-1.5, -2.5, -15]
to = [1.5, -2, -13]

# A ridge of scutes down the back (body pivot: its centre, top at y 3.5) and the tail.
[[cubes]]
name = "scutes"
bone = "body"
part = "scutes"
from = [-4, 3.5, -11]
to = [4, 4.5, 12]

[[cubes]]
name = "tail_ridge"
bone = "tail"
part = "scutes"
from = [-1, 2.5, 0]
to = [1, 3.5, 23]

[palette]
fur = "#4a4e2e"
fur_up = "#41452a"
fur_down = "#d6c88e"
legs = "#454929"
head = "#4a4e2e"
snout = "#4e522f"
snout_down = "#d6c88e"
tail = "#454929"
tail_down = "#c9bb82"
scutes = "#33361f"
eye = "#b8a832"
teeth = "#f2eedc"
nose = "#22241a"

[[decals]]
cube = "brow_l"
face = "west"
x = 0
y = 0
colour = "eye"

[[decals]]
cube = "brow_r"
face = "east"
x = 1
y = 0
colour = "eye"

# A row of teeth along each side of the jaw line (snout sides 10 wide × 2.5 tall).
[[decals]]
cube = "snout"
face = "west"
x = 0
y = 1
w = 9
colour = "teeth"

[[decals]]
cube = "snout"
face = "east"
x = 1
y = 1
w = 9
colour = "teeth"

[[decals]]
cube = "nostrils"
face = "up"
x = 0
y = 0
w = 3
colour = "nose"
