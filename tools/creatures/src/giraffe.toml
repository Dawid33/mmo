# DF GIRAFFE (creature_large_tropical): 1000 kg, tall leaf-eating savanna giant.
# Attack kick (the template's `attack` lunge); MOUNT_EXOTIC: ridden. A neck bone
# carries the head high; patches are 2x2 / 3x3 decals on a cream coat, short
# ossicones and ears on the head, a mane along the neck, tufted tail.
name = "giraffe"
template = "quadruped"
status = "draft"
extras = ["ridden"]

[proportions]
body = [10, 11, 20]
leg = [3, 22]
head = [4, 5, 8]
head_up = 1
neck = [4, 26, 62]
tail = [1, 11]
tail_raise = -70
walk = { cycle = 1.6, swing = 18, bob = 0.6 }
run = { cycle = 0.85, swing = 34, bob = 1.6, pitch = 4 }
idle = { length = 6.0, look = 20, breath = 0.3, wag = 6 }
attack = { length = 1.0, lunge = 4 }
eat = { length = 2.4, reach = 50, forward = 2 }

# Neck pivot: the body's front top; the neck cube spans y -2..2, z -26..1.

[[cubes]]
name = "mane"
bone = "neck"
part = "mane"
from = [-0.5, 2, -24]
to = [0.5, 3, 0]

# Head pivot: the end of the neck; the head cube spans y -1.5..3.5, z -7..1.

[[cubes]]
name = "ossicone_l"
bone = "head"
part = "ossicones"
mirror = true
from = [-1.5, 3.5, -0.5]
to = [-0.5, 6, 0.5]

[[cubes]]
name = "ear_l"
bone = "head"
part = "ears"
mirror = true
from = [-3.5, 2, 0]
to = [-2, 3, 1]

[[cubes]]
name = "muzzle"
bone = "head"
part = "muzzle"
from = [-1.5, -1.5, -8]
to = [1.5, 2, -7]

[[cubes]]
name = "tuft"
bone = "tail"
part = "tuft"
from = [-1, -1, 10]
to = [1, 1, 13]

[palette]
fur = "#ead6a8"
fur_down = "#f2e6c8"
legs = "#ead6a8"
neck = "#ead6a8"
head = "#d8b47a"
muzzle = "#c49a62"
mane = "#7a4a26"
ossicones = "#3a2a1c"
ears = "#d8b47a"
tail = "#d8b47a"
tuft = "#2a1c12"
patch = "#7a4220"
eye = "#120e0b"

[[decals]]
cube = "head"
face = "west"
x = 2
y = 1
w = 1
h = 1
colour = "eye"

[[decals]]
cube = "head"
face = "east"
x = 5
y = 1
w = 1
h = 1
colour = "eye"


