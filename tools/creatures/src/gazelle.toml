# DF GAZELLE (creature_large_tropical): 20 kg, small leaping savanna antelope.
# Attack kick (the template's `attack` lunge); bite optional, not made.
# A Thomson's gazelle: tan back, black flank stripe, white belly, ringed lyre
# horns, neck as a cube on the head bone.
name = "gazelle"
template = "quadruped"
status = "draft"

[proportions]
body = [5, 6, 12]
leg = [2, 8]
head = [3, 4, 5]
head_up = 5
tail = [1, 3]
tail_raise = -20
walk = { cycle = 0.75, swing = 26, bob = 0.3 }
run = { cycle = 0.4, swing = 55, bob = 1.4, pitch = 7 }
idle = { length = 4.0, look = 24, breath = 0.12, wag = 14 }
attack = { length = 0.55, lunge = 3 }
eat = { length = 1.8, reach = 60, forward = 3 }

# Head pivot: the neck joint at the body's front top; the head cube spans
# y 2..6, z -4..1 around it.

[[cubes]]
name = "neck"
bone = "head"
part = "neck"
from = [-1.5, -2, -2]
to = [1.5, 4, 1]

[[cubes]]
name = "muzzle"
bone = "head"
part = "muzzle"
from = [-1, 2, -5.5]
to = [1, 4, -4]

[[cubes]]
name = "ear_l"
bone = "head"
part = "ears"
mirror = true
from = [-3, 5, -0.5]
to = [-1.5, 6, 0.5]

[[cubes]]
name = "horn_l"
bone = "head"
part = "horns"
mirror = true
from = [-1.5, 6, -1]
to = [-0.5, 10, 0]

[[cubes]]
name = "horn_tip_l"
bone = "head"
part = "horns"
mirror = true
from = [-1.5, 9.5, -2]
to = [-0.5, 10.5, -1]

[palette]
fur = "#c69156"
fur_down = "#f2ebe0"
legs = "#d4a46c"
head = "#c69156"
neck = "#c69156"
neck_down = "#f2ebe0"
muzzle = "#d9b384"
ears = "#b58250"
horns = "#3a3028"
tail = "#1e1814"
stripe = "#2a201a"
white = "#f2ebe0"
eye = "#120e0b"

[[decals]]
cube = "head"
face = "west"
x = 2
y = 1
w = 1
h = 1
colour = "eye"

[[decals]]
cube = "head"
face = "east"
x = 2
y = 1
w = 1
h = 1
colour = "eye"

[[decals]]
cube = "body"
face = "west"
x = 1
y = 4
w = 10
h = 1
colour = "stripe"

[[decals]]
cube = "body"
face = "east"
x = 1
y = 4
w = 10
h = 1
colour = "stripe"

[[decals]]
cube = "body"
face = "south"
x = 1
y = 0
w = 3
h = 6
colour = "white"
