# DF FISH_BARRACUDA_GREAT (wild, large ocean): 60 kg, a long silver ambush
# hunter with a jutting lower jaw full of fangs (teeth as decals), dark bars on
# the flanks, two widely spaced dorsals and a forked tail.
# Attacks bite (the template's `attack`) and slap (optional, not made).
name = "great barracuda"
template = "fish"
status = "draft"

[proportions]
body = [4, 5, 15]
head = [3, 4, 6]
tail = [2, 3, 3]
fin = [1, 5, 1.5]
pectoral = [1.5, 2]
dorsal = [1, 2, 3]
swim = { cycle = 0.7, amp = 16 }

# Body pivot: its centre; the body spans y -2.5..2.5, z -7.5..7.5.
[[cubes]]
name = "dorsal_2"
bone = "body"
part = "fins"
from = [-0.5, 2.5, 4]
to = [0.5, 4, 6.5]

# Head pivot: the body's front at mid-height; the head spans y -2..2, z -6..0.
[[cubes]]
name = "jaw"
bone = "head"
part = "jaw"
from = [-1.5, -2.5, -7]
to = [1.5, -1.5, 0]

[[cubes]]
name = "lobe_up"
bone = "tail_fin"
part = "fins"
from = [-0.5, 0.5, 1.5]
to = [0.5, 2.5, 3.5]

[[cubes]]
name = "lobe_down"
bone = "tail_fin"
part = "fins"
from = [-0.5, -2.5, 1.5]
to = [0.5, -0.5, 3.5]

[palette]
body = "#b4bdc2"
body_up = "#5d6a72"
body_down = "#e7ebec"
head = "#b4bdc2"
head_up = "#5d6a72"
head_down = "#e7ebec"
jaw = "#d9dfe1"
fins = "#7a858c"
bar = "#3b444a"
teeth = "#ffffff"
eye = "#101014"
eye_ring = "#d8d2a0"

