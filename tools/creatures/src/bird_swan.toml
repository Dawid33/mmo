# DF BIRD_SWAN (wild): 10 kg, the mute swan: white, a long neck (`neck`), orange bill
# with the black knob and black face patch, black legs. FLIER; not AMPHIBIOUS in the
# raws, but a swan lives on the water, so it gets swim / swim_idle. Attack: bite
# (the template's peck).
name = "swan"
template = "bird"
status = "draft"
extras = ["swim", "swim_idle"]

[proportions]
body = [7, 6, 11]
leg = [1, 2]
foot = [3, 1, 3]
head = [3, 3, 4]
neck = 8
head_back = 2
beak = [2, 1, 3]
tail = [5, 1, 3]
tail_raise = 30
wing = [10, 5]
walk = { cycle = 0.85, swing = 24, bob = 0.3 }
run = { cycle = 0.48 }
fly = { cycle = 0.7, flap = 35 }

# Head pivot: the neck base, at the body's top front. The knob sits where the bill meets the face.
[[cubes]]
name = "knob"
bone = "head"
part = "knob"
from = [-0.75, 10, -3]
to = [0.75, 10.75, -2]

[palette]
body = "#f5f4ef"
body_down = "#ebeae4"
head = "#f6f5f0"
wings = "#f0efe9"
tail = "#eeede7"
legs = "#1c1c1c"
beak = "#e8732a"
knob = "#1a1a1a"
eye = "#141414"
face = "#1a1a1a"

[[decals]]
cube = "head"
face = "west"
x = 1
y = 1
colour = "eye"

[[decals]]
cube = "head"
face = "east"
x = 2
y = 1
colour = "eye"

[[decals]]
cube = "head"
face = "west"
x = 0
y = 1
colour = "face"

[[decals]]
cube = "head"
face = "east"
x = 3
y = 1
colour = "face"
