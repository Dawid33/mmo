# DF BIRD_LOVEBIRD_MASKED (wild): 90 g, "a tiny, colorful bird" (the yellow-collared
# lovebird): green body and wings, a black head mask with white eye rings, a yellow
# collar and breast, red bill, short tail. Vermin in DF, but it has a giant, so it
# uses the full bird rig, small. FLIER; no brood. Attack: bite (the template's peck).
name = "masked lovebird"
template = "bird"
status = "draft"

[proportions]
body = [3, 3, 3]
leg = [1, 1]
foot = [2, 0.5, 1.5]
head = [2, 2, 2]
neck = 1
head_back = 1
beak = [1, 1, 0.5]
tail = [2, 0.5, 2]
tail_raise = -15
wing = [4, 2]
walk = { cycle = 0.35, swing = 30 }
run = { cycle = 0.22 }
fly = { cycle = 0.2, flap = 45 }

[palette]
body = "#3aa040"
body_north = "#f0d030"
body_up = "#38983c"
head = "#1c1a1a"
wings = "#2e8a34"
tail = "#2a6aa0"
legs = "#8a8a8e"
beak = "#d8282a"
ring = "#f4f4f0"
eye = "#141210"
collar = "#f0d030"

# The head's side faces are 2×2 (row 0 at the top); the front is on
# the left of west and the right of east. Body `up`: row 0 is the front.

[[decals]]
cube = "head"
face = "west"
x = 0
y = 0
colour = "ring"

[[decals]]
cube = "head"
face = "east"
x = 1
y = 0
colour = "ring"

[[decals]]
cube = "body"
face = "up"
x = 0
y = 0
w = 3
colour = "collar"
