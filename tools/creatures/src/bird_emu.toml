# DF BIRD_EMU (wild): 35 kg, the emu: shaggy grey-brown body, bare blue-grey neck,
# dark head, grey legs, a drooping rump. Not a FLIER (flier = false). Attack: kick —
# a creature clip replacing the template's peck.
name = "emu"
template = "bird"
status = "draft"

[proportions]
body = [8, 9, 12]
leg = [2, 10]
foot = [4, 1, 4]
head = [3, 3, 3]
neck = 7
head_back = 2
beak = [2, 1, 2]
tail = [5, 3, 3]
tail_raise = -45
wing = [3, 3]
flier = false
walk = { cycle = 0.95, swing = 24, bob = 0.5, nod = 1.5 }
run = { cycle = 0.5, swing = 40, lean = 10 }

[palette]
body = "#6a5947"
body_up = "#5c4d3e"
head = "#5f6c78"
wings = "#665544"
tail = "#5e4f40"
legs = "#6e6a62"
beak = "#2e2b28"
eye = "#8a5a20"

[[decals]]
