# DF TERMITE (vermin, soil colonies): 0.001 kg, "a tiny insect capable of destroying
# large wooden structures when in large numbers". Vermin form: `move` + `death` only (vermin have no attack clip). A soft pale cream body,
# an orange-brown head with dark mandibles, the legs slab for its legs; no eyes (workers
# are blind).
name = "termite"
template = "vermin"
status = "draft"

decals = [
  { cube = "body", face = "up", x = 0, y = 1, w = 2, h = 1, colour = "band" },
]

[proportions]
body = [1.25, 1, 3]
head = [1, 1, 1]
legs = 0.5
move = "scurry"
cycle = 0.35

# Body pivot: its centre (y 1); the body spans y -0.5..0.5, z -1.5..1.5. The head's
# pivot is the body's front (the head spans y -0.5..0.5, z -1..0).
[[cubes]]
name = "mandible_l"
bone = "head"
part = "jaw"
from = [-0.5, -0.5, -1.5]
to = [-0.125, -0.25, -1]
mirror = true

[palette]
body = "#ece2c8"
body_up = "#e2d6b8"
head = "#c07a30"
jaw = "#3a2214"
legs = "#d8c8a0"
band = "#d4c49e"
