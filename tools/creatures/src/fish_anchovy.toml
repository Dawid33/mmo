# DF FISH_ANCHOVY (vermin, temperate ocean): 0.2 kg, "a tiny blue-green oceanic fish".
# Vermin form: `move` + `death` only (vermin have no attack clip). Slender, blue-green back, a silver stripe along each flank.
name = "anchovy"
template = "vermin"
status = "draft"

decals = [
  { cube = "head", face = "west", x = 0, y = 0, colour = "eye" },
  { cube = "head", face = "east", x = 0, y = 0, colour = "eye" },
  { cube = "body", face = "west", x = 0, y = 0, w = 4, h = 1, colour = "stripe" },
  { cube = "body", face = "east", x = 0, y = 0, w = 4, h = 1, colour = "stripe" },
]

[proportions]
body = [1, 1.25, 3.5]
head = [1, 1.25, 1]
legs = 0
move = "swim"
cycle = 0.4

# Body pivot: its centre; the body spans y -0.625..0.625, z -1.75..1.75.
# The tail bone sits at the body's rear; the head's pivot is the body's front
# (the head spans y -0.625..0.625, z -1..0).
[[bones]]
name = "tail"
parent = "body"
pivot = [0, 0, 1.75]

[[cubes]]
name = "tail_fin"
bone = "tail"
part = "fins"
from = [-0.25, -0.625, 0]
to = [0.25, 0.625, 1]

[[cubes]]
name = "dorsal"
bone = "body"
part = "fins"
from = [-0.25, 0.625, -0.5]
to = [0.25, 1.125, 0.5]

[palette]
eye = "#101010"
body = "#c9d3d6"
body_up = "#2f7a80"
body_down = "#e6ecee"
head = "#bcc8cc"
head_up = "#2c7076"
fins = "#9fb2b6"
stripe = "#eef3f4"

# The tail fin wags harder than the body's swim yaw.
[clips.move]
merge = true
mode = "loop"
length = 0.4
keys = [
  { bone = "tail", channel = "rotation", time = 0, value = [0, 0, 0] },
  { bone = "tail", channel = "rotation", time = 0.1, value = [0, 25, 0] },
  { bone = "tail", channel = "rotation", time = 0.2, value = [0, 0, 0] },
  { bone = "tail", channel = "rotation", time = 0.3, value = [0, -25, 0] },
  { bone = "tail", channel = "rotation", time = 0.4, value = [0, 0, 0] },
]
