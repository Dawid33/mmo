# DF THRIPS (wild, soil): "a tiny pest insect. It feeds on both crops and other
# bugs." Vermin with a giant, so the full arthropod rig at small size: six short
# legs, a slender dark body, and narrow fringed [wings] on the thorax (FLIER:
# the fly set; the fringe is not modelled). No attacks in the raws; the
# template's lunge stands in for a bite.
name = "thrips"
template = "arthropod"
status = "draft"

[proportions]
body = [1.5, 1, 1.5]
head = [1, 1, 1]
abdomen = [1.5, 1, 4]
abdomen_raise = 3
legs = 6
leg = [0.5, 1.5, 0.5]
splay = 35
walk = { cycle = 0.35, swing = 20, lift = 16 }
run = { cycle = 0.22, swing = 24, lift = 20 }

[wings]
bone = "body"
at = [-0.25, 0.5, 0]
span = 3.5
chord = 0.5
part = "wings"
cycle = 0.08
flap = 40

[[cubes]]
name = "antenna_l"
bone = "head"
part = "legs"
from = [-0.5, 0, -2]
to = [0, 0.5, -1]
mirror = true

[palette]
body = "#3a2e22"
body_up = "#463828"
head = "#2e241a"
abdomen = "#342a1e"
abdomen_up = "#2a2018"
legs = "#5a4a36"
wings = "#b8b2a4"
eye = "#7a2a1e"

[[decals]]
cube = "head"
face = "west"
x = 0
y = 0
colour = "eye"

[[decals]]
cube = "head"
face = "east"
x = 0
y = 0
colour = "eye"
