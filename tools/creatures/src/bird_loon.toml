# DF BIRD_LOON (wild): 6 kg, the common loon in breeding plumage: long low body, black
# back checked white, white belly, a black-green head with a striped white collar,
# red eye, dagger bill. FLIER; not AMPHIBIOUS in the raws, but a loon lives on the
# water, so it gets swim / swim_idle. Attack: bite (the template's peck).
name = "loon"
template = "bird"
status = "draft"
extras = ["swim", "swim_idle"]

[proportions]
body = [5, 4, 10]
leg = [1, 2]
foot = [3, 1, 3]
head = [3, 3, 4]
neck = 3
head_back = 2
beak = [1, 1, 3]
tail = [3, 1, 1]
tail_raise = 0
wing = [8, 3]
walk = { cycle = 0.8, swing = 22, bob = 0.3 }
run = { cycle = 0.45 }
fly = { cycle = 0.45, flap = 40 }

[palette]
body = "#1c1f1f"
body_down = "#efede6"
head = "#14261d"
wings = "#1e2121"
tail = "#1c1f1f"
legs = "#2a2a2a"
beak = "#1a1a1a"
eye = "#b5221c"
check = "#e8e6df"

