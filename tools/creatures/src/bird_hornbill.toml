# DF BIRD_HORNBILL (wild): 2.5 kg, the great hornbill: black body and wings with a
# white wing bar, white tail with a black band, a huge yellow bill topped by its
# casque. FLIER; no brood. Attack: bite (the template's peck).
name = "hornbill"
template = "bird"
status = "draft"

[proportions]
body = [5, 5, 8]
leg = [1, 2]
foot = [2, 1, 2]
head = [3, 3, 3]
neck = 2
head_back = 2
beak = [2, 2, 5]
tail = [4, 1, 6]
tail_raise = 5
wing = [8, 4]
walk = { cycle = 0.6, swing = 26 }
run = { cycle = 0.35 }
fly = { cycle = 0.6, flap = 40 }

# Head pivot: the neck, at the body's top front. The casque rides on the bill.
[[cubes]]
name = "casque"
bone = "head"
part = "casque"
from = [-1, 5, -4.5]
to = [1, 6, -1.5]

[palette]
body = "#1b1b1c"
body_down = "#e8e2c8"
head = "#1b1b1c"
wings = "#1d1d1e"
tail = "#efebe0"
legs = "#4a4a4a"
beak = "#e9c03a"
casque = "#e6a92c"
eye = "#c43a2a"
bar = "#efebe0"
band = "#1b1b1c"

[[decals]]
cube = "head"
face = "west"
x = 1
y = 1
colour = "eye"

[[decals]]
cube = "head"
face = "east"
x = 1
y = 1
colour = "eye"

[[decals]]
cube = "wing_l"
face = "down"
x = 0
y = 1
w = 8
colour = "bar"

[[decals]]
cube = "wing_r"
face = "down"
x = 0
y = 1
w = 8
colour = "bar"

[[decals]]
cube = "tail"
face = "up"
x = 0
y = 3
w = 4
colour = "band"

[[decals]]
cube = "tail"
face = "down"
x = 0
y = 3
w = 4
colour = "band"

# The long bill: the template's eat (head −55°) drives it into the ground.
[clips.eat]
merge = true
keys = [
  { bone = "head", channel = "rotation", time = 0.0, value = [-25, 0, 0] },
  { bone = "head", channel = "rotation", time = 0.2, value = [-35, 0, 0] },
  { bone = "head", channel = "rotation", time = 0.4, value = [-25, 0, 0] },
  { bone = "head", channel = "rotation", time = 0.6, value = [-35, 0, 0] },
  { bone = "head", channel = "rotation", time = 0.8, value = [-25, 0, 0] },
  { bone = "head", channel = "rotation", time = 1.0, value = [-35, 0, 0] },
  { bone = "head", channel = "rotation", time = 1.2, value = [-25, 0, 0] },
]
