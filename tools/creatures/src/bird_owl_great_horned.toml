# DF BIRD_OWL_GREAT_HORNED (wild): 2 kg, the great horned owl: upright mottled brown
# body, ear tufts, a tawny facial disc, yellow eyes looking forward, a white throat.
# FLIER; no brood. Attack: peck (the template's `attack`); the talon scratch is
# optional.
name = "great horned owl"
template = "bird"
status = "draft"

[proportions]
body = [5, 7, 5]
leg = [1, 2]
foot = [2, 1, 2]
head = [6, 5, 5]
neck = 1
head_back = 4
beak = [1, 1, 1]
tail = [4, 1, 3]
tail_raise = -40
wing = [5, 4]
walk = { cycle = 0.55, swing = 26, nod = 0.5 }
run = { cycle = 0.32 }

# Head pivot: the neck, at the body's top front. Ear tufts on the head's top corners.
[[cubes]]
name = "tuft_l"
bone = "head"
part = "tuft"
mirror = true
from = [-3, 6, -0.5]
to = [-1.75, 7.5, 0.5]

[palette]
body = "#6e5640"
body_north = "#b89c76"
body_down = "#a88c66"
head = "#6a523c"
head_north = "#c4884a"
wings = "#5f4936"
tail = "#634c38"
tuft = "#4e3c2c"
legs = "#c8b48e"
beak = "#2e2a26"
eye = "#f2c12e"
throat = "#f1ece2"
rim = "#2e241c"

[[decals]]
cube = "head"
face = "north"
x = 0
y = 0
w = 6
colour = "rim"

[[decals]]
cube = "head"
face = "north"
x = 1
y = 1
colour = "eye"

[[decals]]
cube = "head"
face = "north"
x = 4
y = 1
colour = "eye"

[[decals]]
cube = "head"
face = "north"
x = 1
y = 4
w = 4
colour = "throat"
