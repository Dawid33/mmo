# DF RAT_GIANT (underground): 200 kg, "a gigantic rodent found underground"; the
# raws allow many browns, this one is a dusky grey-brown with a paler belly. Built
# like the rat: a pointed snout with a pink nose and yellow incisors, round
# pink-lined ears, and a long naked pink tail. Attack bite (the template's
# `attack`); scratch optional, not made. MOUNT_EXOTIC: ridden;
# CURIOUSBEAST_EATER/GUZZLER: pick_up + carry.
name = "giant rat"
template = "quadruped"
status = "draft"
extras = ["ridden", "pick_up", "carry"]

[proportions]
body = [10, 8, 21]
leg = [3, 5]
leg_ends = 2
head = [7, 6, 5]
head_up = 0
head_overlap = 1
tail = [2, 24]
tail_raise = -6
walk = { cycle = 0.9, swing = 30, bob = 0.4 }
run = { cycle = 0.5, swing = 46, bob = 1.0, pitch = 6 }
idle = { length = 4.0, look = 22, breath = 0.25, wag = 8 }
attack = { length = 0.55, lunge = 4 }
eat = { length = 1.6, reach = 40, forward = 2 }

# Head pivot: the neck joint; the head cube spans y -5..1, z -4..1 around it.
[[cubes]]
name = "snout"
bone = "head"
part = "snout"
from = [-2, -5, -8]
to = [2, -1.5, -4]

[[cubes]]
name = "teeth"
bone = "head"
part = "teeth"
from = [-1, -6.5, -7.75]
to = [1, -5, -7]

[[cubes]]
name = "ear_l"
bone = "head"
part = "ears"
mirror = true
from = [-4.5, 0, -1]
to = [-1.5, 3, 0]

[palette]
fur = "#6e625a"
fur_up = "#5e534c"
fur_down = "#a89a8c"
legs = "#5a504a"
head = "#665a52"
head_down = "#a89a8c"
snout = "#6e625a"
snout_down = "#a89a8c"
teeth = "#e8c860"
ears = "#7a6a64"
ears_north = "#d89a9c"
tail = "#d4a0a0"
nose = "#e88a94"
eye = "#0c0a0a"

[[decals]]
cube = "head"
face = "west"
x = 1
y = 1
colour = "eye"

[[decals]]
cube = "head"
face = "east"
x = 3
y = 1
colour = "eye"

[[decals]]
cube = "snout"
face = "north"
x = 1
y = 0
w = 2
colour = "nose"
