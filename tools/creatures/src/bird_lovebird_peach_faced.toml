# DF BIRD_LOVEBIRD_PEACH-FACED (wild): 60 g, "a tiny, brightly colored parrot" (the
# rosy-faced lovebird): green body and wings, a peach-pink face and throat, a blue
# rump, horn-coloured bill, short tail. Vermin in DF, but it has a giant, so it uses
# the full bird rig, small. FLIER; no brood. Attack: bite (the template's peck).
name = "peach-faced lovebird"
template = "bird"
status = "draft"

[proportions]
body = [3, 3, 3]
leg = [1, 1]
foot = [2, 0.5, 1.5]
head = [2, 2, 2]
neck = 1
head_back = 1
beak = [1, 1, 0.5]
tail = [2, 0.5, 2]
tail_raise = -15
wing = [4, 2]
walk = { cycle = 0.35, swing = 30 }
run = { cycle = 0.22 }
fly = { cycle = 0.2, flap = 45 }

[palette]
body = "#4aa840"
body_south = "#3a8ad8"
head = "#4aa840"
head_north = "#f08a7a"
wings = "#3e9638"
tail = "#3a8ad8"
legs = "#8a8a8e"
beak = "#e8dcb8"
face = "#f08a7a"
eye = "#141210"

# The head's side faces are 2×2 (row 0 at the top); the front is on
# the left of west and the right of east. Body `up`: row 0 is the front.

[[decals]]
cube = "head"
face = "west"
x = 0
y = 0
colour = "face"
h = 2

[[decals]]
cube = "head"
face = "east"
x = 1
y = 0
colour = "face"
h = 2

[[decals]]
cube = "head"
face = "west"
x = 1
y = 0
colour = "eye"

[[decals]]
cube = "head"
face = "east"
x = 0
y = 0
colour = "eye"
