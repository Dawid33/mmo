# DF SNAIL (vermin, soil): a tiny land mollusk with a large shell. Serpent, not
# the vermin form: the giant snail is derived from it and needs the full rig.
# About 50 cm here (tiny in DF). A grey foot with eyestalks and a brown spiral
# shell on seg1, which rides the foot's undulation. No attacks in the raws.
name = "snail"
template = "serpent"
status = "draft"

decals = [
  # A square spiral on each side of the shell (4 wide, 4 tall).
  { cube = "shell", face = "west", x = 0, y = 0, w = 4, h = 1, colour = "whorl" },
  { cube = "shell", face = "west", x = 3, y = 0, w = 1, h = 4, colour = "whorl" },
  { cube = "shell", face = "west", x = 0, y = 3, w = 4, h = 1, colour = "whorl" },
  { cube = "shell", face = "west", x = 0, y = 1, w = 1, h = 2, colour = "whorl" },
  { cube = "shell", face = "west", x = 1, y = 1, w = 1, h = 1, colour = "whorl" },
  { cube = "shell", face = "east", x = 0, y = 0, w = 4, h = 1, colour = "whorl" },
  { cube = "shell", face = "east", x = 0, y = 0, w = 1, h = 4, colour = "whorl" },
  { cube = "shell", face = "east", x = 0, y = 3, w = 4, h = 1, colour = "whorl" },
  { cube = "shell", face = "east", x = 3, y = 1, w = 1, h = 2, colour = "whorl" },
  { cube = "shell", face = "east", x = 2, y = 1, w = 1, h = 1, colour = "whorl" },
  { cube = "shell", face = "up", x = 0, y = 1, w = 4, h = 1, colour = "whorl" },
  { cube = "stalk_l", face = "north", x = 0, y = 0, w = 1, h = 1, colour = "eye" },
  { cube = "stalk_r", face = "north", x = 0, y = 0, w = 1, h = 1, colour = "eye" },
  { cube = "stalk_l", face = "up", x = 0, y = 0, w = 1, h = 1, colour = "eye" },
  { cube = "stalk_r", face = "up", x = 0, y = 0, w = 1, h = 1, colour = "eye" },
]

[proportions]
segments = 4
seg = [2.5, 1.5, 2]
taper = 0.5
head = [2, 1.5, 1.5]
walk = { cycle = 2.6, amp = 10 }
run = { cycle = 1.8, amp = 12 }

# The shell, sitting on the foot over seg1 (pivot at seg1's back end, y = 0.75).
[[cubes]]
name = "shell"
bone = "seg1"
part = "shell"
from = [-1.75, 0.25, -3]
to = [1.75, 4.25, 1]

# Head pivot: the neck (y = 0.75); the head is y -0.75..0.75, z -1.5..0.
[[cubes]]
name = "stalk_l"
bone = "head"
part = "head"
from = [-0.9, 0.75, -1.4]
to = [-0.4, 2.75, -0.9]
mirror = true

[palette]
body = "#8c8478"
body_up = "#7e766a"
body_down = "#a8a094"
head = "#8c8478"
shell = "#9a6b3c"
shell_up = "#a8784a"
whorl = "#5a3a1e"
eye = "#1e1a15"
