# DF COYOTE (creature_temperate_new): 15 kg, a sly, howling wild dog.
# Lean grey-tawny dog with a narrow snout, tall pointed ears, a bushy black-tipped
# tail carried low. Between the fox and the dog in size. Attacks bite (the
# template's `attack`); scratch optional, not made.
name = "coyote"
template = "quadruped"
status = "draft"

decals = [
  { cube = "head", face = "north", x = 0, y = 1, colour = "eye" },
  { cube = "head", face = "north", x = 3, y = 1, colour = "eye" },
  { cube = "snout", face = "north", x = 0, y = 0, w = 2, colour = "nose" },
  { cube = "tail", face = "up", x = 0, y = 6, w = 2, colour = "nose" },
  { cube = "tail", face = "down", x = 0, y = 6, w = 2, colour = "nose" },
]

[proportions]
body = [5, 5, 10]
leg = [2, 5]
leg_ends = 0
head = [4, 4, 3]
head_up = 2
head_overlap = 1
tail = [2, 7]
tail_raise = -25
walk = { cycle = 0.7, swing = 30, bob = 0.25 }
run = { cycle = 0.4, swing = 50, bob = 0.8, pitch = 6 }
idle = { length = 4.0, look = 22, breath = 0.12, wag = 8 }
attack = { length = 0.55, lunge = 3 }
eat = { length = 1.5, reach = 48, forward = 2 }

# Head pivot: the neck joint; the head cube spans y -1..3, z -2..1 around it.
[[cubes]]
name = "snout"
bone = "head"
part = "snout"
from = [-1, -1, -5]
to = [1, 0.5, -2]

[[cubes]]
name = "ear_l"
bone = "head"
part = "ears"
mirror = true
from = [-2, 3, 0]
to = [-0.5, 5, 1]

[palette]
fur = "#a08a6a"
fur_up = "#7e6c55"
fur_down = "#d8cbb2"
legs = "#b0926a"
head = "#a8906c"
snout = "#c4ad8a"
ears = "#8e6e4c"
tail = "#8e7a5e"
eye = "#b08a40"
nose = "#1e1814"
