# DF FISH_CAVE (underground, subterranean water): 1 kg, a small pale blind fish
# (no eyes in DF's body plan, so no eye decals). Vermin form: one `swim` move
# loop and `death`; the tail and dorsal fins are extra cubes on the body.
name = "cave fish"
template = "vermin"
status = "draft"

[proportions]
body = [1.5, 2, 4]
head = [1.5, 1.5, 1.5]
legs = 0
move = "swim"

# Body pivot: its centre; the body spans y -1..1, z -2..2.
[[cubes]]
name = "tail_fin"
bone = "body"
part = "fins"
from = [-0.25, -0.5, 2]
to = [0.25, 1, 3.5]

[[cubes]]
name = "dorsal"
bone = "body"
part = "fins"
from = [-0.25, 1, -0.5]
to = [0.25, 1.5, 1]

[palette]
body = "#ead9d1"
body_up = "#e2cdc4"
head = "#efc9c0"
fins = "#f2e4de"
