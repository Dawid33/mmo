# DF JACKAL (creature_temperate_new): 10 kg, small wolf-like scavenger.
# Attacks bite (the template's `attack`) and scratch (optional, not made).
# Black-backed: golden flanks, a grizzled dark saddle, big ears, bushy dark tail.
name = "jackal"
template = "quadruped"
status = "draft"

[proportions]
body = [5, 5, 10]
leg = [2, 5]
head = [4, 4, 3]
head_up = 2
tail = [2, 6]
tail_raise = -10
walk = { cycle = 0.7, swing = 30, bob = 0.25 }
run = { cycle = 0.4, swing = 52, bob = 0.7, pitch = 6 }
idle = { length = 4.0, look = 22, breath = 0.12, wag = 6 }
attack = { length = 0.5, lunge = 2.5 }
eat = { length = 1.4, reach = 45, forward = 2 }

# Head pivot: the neck joint; the head cube spans y -1..3, z -2..1 around it.
[[cubes]]
name = "snout"
bone = "head"
part = "snout"
from = [-1, -1, -5]
to = [1, 1, -2]

[[cubes]]
name = "ear_l"
bone = "head"
part = "ears"
mirror = true
from = [-2, 3, -0.5]
to = [-0.5, 5.5, 0.5]

[palette]
fur = "#c4904f"
fur_down = "#ead6b4"
legs = "#c99a5e"
head = "#c4904f"
snout = "#d9b282"
ears = "#b07a3e"
tail = "#3c332b"
saddle = "#4a4038"
grizzle = "#9a8c7c"
eye = "#1a120c"
nose = "#141010"

[[decals]]
cube = "head"
face = "north"
x = 0
y = 1
colour = "eye"

[[decals]]
cube = "head"
face = "north"
x = 3
y = 1
colour = "eye"

[[decals]]
cube = "snout"
face = "north"
x = 0
y = 0
w = 2
colour = "nose"

# The saddle: the back (5 wide x 10 long) and the top rows of the flanks.
[[decals]]
cube = "body"
face = "up"
x = 0
y = 1
w = 5
h = 8
colour = "saddle"

[[decals]]
cube = "body"
