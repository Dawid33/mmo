# DF MONGOOSE (creature_tropical_new): 2 kg, small snake-hunting carnivore.
# Attacks bite (the template's `attack`) and scratch (optional, not made).
# Short legs, a pointed face, a long tapering tail; grizzled grey-brown.
name = "mongoose"
template = "quadruped"
status = "draft"

[proportions]
body = [4, 4, 9]
leg = [2, 2]
leg_ends = 0
head = [3, 3, 3]
head_up = 1
tail = [2, 7]
tail_raise = -5
walk = { cycle = 0.5, swing = 32, bob = 0.15 }
run = { cycle = 0.3, swing = 50, bob = 0.4, pitch = 6 }
idle = { length = 3.5, look = 28, breath = 0.08, wag = 6 }
attack = { length = 0.4, lunge = 2.5 }
eat = { length = 1.2, reach = 40, forward = 1 }

# Head pivot: the neck joint; the head cube spans y -1..2, z -2..1 around it.

[[cubes]]
name = "snout"
bone = "head"
part = "snout"
from = [-1, -1, -4]
to = [1, 0.5, -2]

[[cubes]]
name = "ear_l"
bone = "head"
part = "ears"
mirror = true
from = [-1.5, 2, 0]
to = [-1, 2.5, 0.5]

# The tail cube runs z -1..6 from its root; the tip tapers it.

[[cubes]]
name = "tail_tip"
bone = "tail"
part = "tail_tip"
from = [-0.5, -0.5, 6]
to = [0.5, 0.5, 8]

[palette]
fur = "#8a7a62"
fur_up = "#7e6e58"
fur_down = "#9e8e74"
legs = "#5a4c3a"
head = "#8a7a62"
snout = "#7a6a54"
ears = "#5a4c3a"
tail = "#8a7a62"
tail_tip = "#3a2e22"
grizzle = "#b8aa90"
eye = "#0e0b09"
nose = "#1e1812"

[[decals]]
cube = "head"
face = "north"
