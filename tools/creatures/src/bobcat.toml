# DF BOBCAT (creature_temperate_new): 8 kg, a small wild cat with a bobbed tail.
# Tawny, dark-spotted, tufted ears, a short black-tipped tail. Bigger and
# longer-legged than the cat. Attacks bite (the template's `attack`); scratch
# optional, not made.
name = "bobcat"
template = "quadruped"
status = "draft"

decals = [
  { cube = "head", face = "north", x = 0, y = 1, colour = "eye" },
  { cube = "head", face = "north", x = 3, y = 1, colour = "eye" },
  { cube = "snout", face = "north", x = 0, y = 0, w = 2, colour = "nose" },
  { cube = "tail", face = "up", x = 0, y = 2, w = 2, colour = "black" },
  { cube = "body", face = "up", x = 1, y = 2, colour = "spot" },
  { cube = "body", face = "up", x = 3, y = 4, colour = "spot" },
  { cube = "body", face = "up", x = 1, y = 6, colour = "spot" },
  { cube = "body", face = "west", x = 2, y = 1, colour = "spot" },
  { cube = "body", face = "west", x = 5, y = 2, colour = "spot" },
  { cube = "body", face = "west", x = 7, y = 1, colour = "spot" },
  { cube = "body", face = "east", x = 6, y = 1, colour = "spot" },
  { cube = "body", face = "east", x = 3, y = 2, colour = "spot" },
  { cube = "body", face = "east", x = 1, y = 1, colour = "spot" },
]

[proportions]
body = [5, 5, 9]
leg = [2, 4]
leg_ends = 0
head = [4, 4, 3]
head_up = 1
head_overlap = 1
tail = [2, 3]
tail_raise = 30
walk = { cycle = 0.62, swing = 30, bob = 0.2 }
run = { cycle = 0.35, swing = 52, bob = 0.7, pitch = 7 }
idle = { length = 4.0, look = 22, breath = 0.1, wag = 8 }
attack = { length = 0.5, lunge = 3 }
eat = { length = 1.4, reach = 45, forward = 1.5 }

# Head pivot: the neck joint; the head cube spans y -2..2, z -2..1 around it.
[[cubes]]
name = "snout"
bone = "head"
part = "snout"
from = [-1, -2, -3]
to = [1, -0.5, -2]

[[cubes]]
name = "ear_l"
bone = "head"
part = "ears"
mirror = true
from = [-2, 2, -0.5]
to = [-1, 3.5, 0.5]

[[cubes]]
name = "tuft_l"
bone = "head"
part = "black"
mirror = true
from = [-1.75, 3.5, -0.25]
to = [-1.25, 4.5, 0.25]

[palette]
fur = "#a9825a"
fur_down = "#e6d8c2"
legs = "#a07a52"
head = "#a9825a"
head_down = "#e6d8c2"
snout = "#e6d8c2"
ears = "#5a4632"
tail = "#a9825a"
black = "#1c1714"
spot = "#5e4630"
eye = "#b8a040"
nose = "#3a2a24"
