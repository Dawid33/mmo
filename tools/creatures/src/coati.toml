# DF COATI (creature_temperate_new): 6 kg, a long-nosed raccoon relative.
# Reddish-brown body, a long upturned snout with a pale mask, a long ringed tail
# carried upright. Attacks bite (the template's `attack`); scratch optional, not
# made. CURIOUSBEAST_ITEM (a thief): pick_up + carry.
name = "coati"
template = "quadruped"
status = "draft"
extras = ["pick_up", "carry"]

decals = [
  { cube = "head", face = "north", x = 0, y = 1, colour = "eye" },
  { cube = "head", face = "north", x = 2, y = 1, colour = "eye" },
  { cube = "head", face = "north", x = 0, y = 2, w = 3, colour = "mask" },
  { cube = "snout", face = "north", x = 0, y = 0, colour = "nose" },
  { cube = "tail", face = "up", x = 0, y = 1, w = 2, colour = "ring" },
  { cube = "tail", face = "up", x = 0, y = 4, w = 2, colour = "ring" },
  { cube = "tail", face = "up", x = 0, y = 7, w = 2, colour = "ring" },
  { cube = "tail", face = "west", x = 1, y = 0, h = 2, colour = "ring" },
  { cube = "tail", face = "west", x = 4, y = 0, h = 2, colour = "ring" },
  { cube = "tail", face = "west", x = 7, y = 0, h = 2, colour = "ring" },
  { cube = "tail", face = "east", x = 8, y = 0, h = 2, colour = "ring" },
  { cube = "tail", face = "east", x = 5, y = 0, h = 2, colour = "ring" },
  { cube = "tail", face = "east", x = 2, y = 0, h = 2, colour = "ring" },
]

[proportions]
body = [4, 4, 8]
leg = [2, 3]
leg_ends = 0
head = [3, 3, 3]
head_up = 1
head_overlap = 1
tail = [2, 10]
tail_raise = 70
walk = { cycle = 0.5, swing = 30, bob = 0.2 }
run = { cycle = 0.32, swing = 48, bob = 0.5, pitch = 6 }
idle = { length = 4.0, look = 25, breath = 0.1, wag = 6 }
attack = { length = 0.45, lunge = 2 }
eat = { length = 1.3, reach = 45, forward = 1.2 }

# Head pivot: the neck joint; the head cube spans y -1..2, z -2..1 around it.
[[cubes]]
name = "snout"
bone = "head"
part = "snout"
from = [-0.5, -1, -5]
to = [0.5, 0, -2]

[[cubes]]
name = "ear_l"
bone = "head"
part = "ears"
mirror = true
from = [-1.5, 2, 0]
to = [-0.5, 2.5, 1]

[palette]
fur = "#8a5a36"
fur_up = "#7a4e2e"
fur_down = "#c09a72"
legs = "#3a2a20"
head = "#7a5a40"
snout = "#5a4232"
ears = "#e0d0b8"
tail = "#8a5a36"
ring = "#3e2a1c"
mask = "#e6dccb"
eye = "#120c08"
nose = "#1a1210"
