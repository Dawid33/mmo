# DF SHARK_MAKO_LONGFIN (wild, large ocean): 80 kg, a dark slate mako with very
# long pectoral fins and big dark eyes.
# Built like the other sharks: the fish template plus a swept two-cube
# dorsal, an upper tail lobe, gill slits and a white lower flank (decals).
# LARGE_PREDATOR: alert, roar. Attacks bite (the template's `attack`) and slap
# (optional, not made).
name = "longfin mako shark"
template = "fish"
status = "draft"
extras = ["alert", "roar"]

[proportions]
body = [5, 6, 14]
head = [4, 5, 6]
tail = [2, 3, 3]
fin = [1, 6, 1.5]
pectoral = [2, 5]
dorsal = [1, 0, 0]
swim = { cycle = 0.8, amp = 15 }

# Body pivot: its centre; the body spans y -3..3, z -7..7. The dorsal is a three-step swept triangle.
[[cubes]]
name = "dorsal"
bone = "body"
part = "fins"
from = [-0.5, 3, -3]
to = [0.5, 5, 1]

[[cubes]]
name = "dorsal_mid"
bone = "body"
part = "fins"
from = [-0.5, 5, -2]
to = [0.5, 7, 1.5]

[[cubes]]
name = "dorsal_tip"
bone = "body"
part = "fins"
from = [-0.5, 7, -0.5]
to = [0.5, 8, 2]

# Tail fin pivot: the stalk's end; the fin spans y -3..3, z 0..1.5. The upper lobe is a two-step sweep up and back.
[[cubes]]
name = "lobe_up"
bone = "tail_fin"
part = "fins"
from = [-0.5, 0, 0.5]
to = [0.5, 5, 2]

[[cubes]]
name = "lobe_tip"
bone = "tail_fin"
part = "fins"
from = [-0.5, 4.5, 1.5]
to = [0.5, 7, 3.5]

[palette]
body = "#3a4b63"
body_up = "#2b394c"
body_down = "#eef0f0"
head = "#3a4b63"
head_up = "#2b394c"
head_down = "#eef0f0"
fins = "#33435a"
belly = "#e9ecec"
eye = "#0b0c0d"
gill = "#2e3336"
mouth = "#2a1c1c"
teeth = "#f4f1ea"

[[decals]]
cube = "body"
face = "west"
x = 0
y = 4
w = 14
h = 2
colour = "belly"

