# DF SHARK_SPINY_DOGFISH (wild, large ocean): 30 kg, a slim grey shark with
# white spots and a pale spine in front of each of its two dorsals.
# Built like the other sharks: the fish template plus a swept two-cube
# dorsal, an upper tail lobe, gill slits and a white lower flank (decals).
# Attacks bite (the template's `attack`) and slap (optional, not made).
name = "spiny dogfish"
template = "fish"
status = "draft"

[proportions]
body = [4, 4, 11]
head = [3, 3, 4]
tail = [2, 2, 3]
fin = [1, 4, 1.5]
pectoral = [1, 2]
dorsal = [1, 0, 0]
swim = { cycle = 0.7, amp = 16 }

# Body pivot: its centre; the body spans y -2..2, z -5.5..5.5. The dorsal is a three-step swept triangle.
[[cubes]]
name = "dorsal"
bone = "body"
part = "fins"
from = [-0.5, 2, -3]
to = [0.5, 3, -0.5]

[[cubes]]
name = "dorsal_mid"
bone = "body"
part = "fins"
from = [-0.5, 3, -2]
to = [0.5, 4, 0]

[[cubes]]
name = "dorsal_tip"
bone = "body"
part = "fins"
from = [-0.5, 4, -1.5]
to = [0.5, 4.5, 0.5]

# Tail fin pivot: the stalk's end; the fin spans y -2..2, z 0..1.5. The upper lobe is a two-step sweep up and back.
[[cubes]]
name = "lobe_up"
bone = "tail_fin"
part = "fins"
from = [-0.5, 0, 0.5]
to = [0.5, 3, 2]

[[cubes]]
name = "lobe_tip"
bone = "tail_fin"
part = "fins"
from = [-0.5, 3, 1.5]
to = [0.5, 4, 3.5]

[[cubes]]
name = "spine_1"
bone = "body"
part = "spine"
from = [-0.25, 2, -3.5]
to = [0.25, 4, -3]

[[cubes]]
name = "dorsal_2"
bone = "body"
part = "fins"
from = [-0.5, 2, 3]
to = [0.5, 3.5, 5]

[[cubes]]
name = "spine_2"
bone = "body"
part = "spine"
from = [-0.25, 2, 2.5]
to = [0.25, 3.5, 3]

[palette]
body = "#6f777b"
body_up = "#596065"
body_down = "#eef0f0"
head = "#6f777b"
head_up = "#596065"
head_down = "#eef0f0"
fins = "#62696d"
belly = "#e9ecec"
spine = "#efe9dc"
spot = "#e3e6e6"
eye = "#0b0c0d"
gill = "#2e3336"
mouth = "#2a1c1c"
teeth = "#f4f1ea"

[[decals]]
cube = "body"
face = "west"
x = 0
y = 3
w = 11
h = 1
colour = "belly"

[[decals]]
cube = "body"
face = "east"
x = 0
y = 3
w = 11
h = 1
colour = "belly"

[[decals]]
cube = "head"
face = "west"
x = 0
y = 2
w = 4
h = 1
colour = "belly"

[[decals]]
cube = "head"
face = "east"
x = 0
y = 2
w = 4
h = 1
colour = "belly"

[[decals]]
cube = "head"
face = "west"
x = 1
y = 1
colour = "eye"

[[decals]]
cube = "head"
face = "east"
x = 2
y = 1
colour = "eye"

[[decals]]
cube = "body"
