# DF FISH_GROUPER_GIANT (giant, tropical ocean): 600 kg, "a large, big-mouthed fish,
# found around coral reefs". A giant with no base fish in the roster, so a source of
# its own on the fish template (the carp's build, much bigger and deeper). Attacks
# bite (the template's `attack`) and slap (optional, not made).
name = "giant grouper"
template = "fish"
status = "draft"

[proportions]
body = [12, 13, 20]
head = [11, 12, 8]
tail = [6, 8, 5]
fin = [2, 13, 6]
pectoral = [6, 4]
dorsal = [2, 4, 16]
swim = { cycle = 1.3, amp = 14 }

# Head pivot: the body's front at mid-height; the head spans z -8..0. The wide jaw
# juts out under the snout.
[[cubes]]
name = "jaw"
bone = "head"
part = "head"
from = [-5, -6, -10]
to = [5, -2, -7]

[[cubes]]
name = "lip"
bone = "head"
part = "lip"
from = [-4.5, -2, -9.5]
to = [4.5, -1, -8]

[palette]
body = "#6b5a3e"
body_up = "#4f4330"
body_down = "#a8977a"
head = "#6b5a3e"
head_down = "#a8977a"
lip = "#3d3328"
fins = "#55472f"
blotch = "#3f3526"
eye = "#121010"
eye_ring = "#c9a64a"

[[decals]]
cube = "head"
face = "west"
x = 2
y = 2
w = 2
h = 2
colour = "eye_ring"

[[decals]]
cube = "head"
face = "west"
x = 2
y = 2
colour = "eye"

[[decals]]
cube = "head"
face = "east"
x = 4
y = 2
w = 2
h = 2
colour = "eye_ring"

[[decals]]
cube = "head"
face = "east"
x = 5
y = 2
colour = "eye"

[[decals]]
cube = "body"
face = "west"
x = 4
y = 3
w = 3
h = 2
colour = "blotch"

[[decals]]
cube = "body"
face = "west"
x = 12
y = 6
w = 3
h = 3
colour = "blotch"

[[decals]]
