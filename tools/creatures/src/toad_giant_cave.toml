# DF TOAD_GIANT_CAVE (underground): 200 kg, a giant predatory cave toad; taupe-grey
# skin, black markings (raws). Squat wide body on splayed legs with big hind haunches,
# a broad flat head with a wide mouth and bulging eyes on top, no tail (none in its
# body plan). Attack bite (the template's `attack`). LARGE_PREDATOR: alert + roar
# (a croak); AMPHIBIOUS: swim + swim_idle; MOUNT_EXOTIC: ridden.
name = "giant cave toad"
template = "quadruped"
status = "draft"
extras = ["alert", "roar", "swim", "swim_idle", "ridden"]

[proportions]
body = [16, 8, 18]
leg = [4, 4]
leg_inset = -2
leg_ends = 1
head = [14, 6, 8]
head_up = -1
head_overlap = 1
tail = [0, 0]
tail_raise = 0
walk = { cycle = 1.1, swing = 28, bob = 0.6 }
run = { cycle = 0.6, swing = 42, bob = 1.6, pitch = 8 }
idle = { length = 5.0, look = 10, breath = 0.5, wag = 0 }
attack = { length = 0.5, lunge = 5 }
eat = { length = 1.8, reach = 15, forward = 2 }

# Head pivot: the neck joint; the head cube spans y -6..0, z -7..1 around it.
[[cubes]]
name = "eye_l"
bone = "head"
part = "eyes"
mirror = true
from = [-6, -0.5, -5]
to = [-3, 2, -2]

[[cubes]]
name = "throat"
bone = "head"
part = "throat"
from = [-5, -7, -6]
to = [5, -6, 0]

# Big hind haunches on the flanks (body pivot: its centre; flank at x ±8,
# body y -4.5..4.5, z -9..9).
[[cubes]]
name = "haunch_l"
bone = "body"
part = "fur"
mirror = true
from = [-10, -4, 2]
to = [-7, 2, 9]

[palette]
fur = "#8b8378"
fur_up = "#7a7268"
fur_down = "#bdb4a3"
legs = "#7f776c"
head = "#8b8378"
head_down = "#bdb4a3"
throat = "#c9c0ae"
eyes = "#7a7268"
tail = "#8b8378"
eye = "#0d0c0b"
mouth = "#3d3832"
wart = "#2a2622"

[[decals]]
cube = "eye_l"
face = "west"
x = 0
y = 0
w = 2
h = 2
colour = "eye"

[[decals]]
cube = "eye_r"
face = "east"
x = 1
y = 0
w = 2
h = 2
colour = "eye"

[[decals]]
cube = "head"
face = "north"
x = 0
y = 4
w = 14
colour = "mouth"

# Black blotches on the back (16 wide × 18 long; row 0 at the front).
[[decals]]
cube = "body"
face = "up"
x = 3
y = 3
w = 2
h = 2
colour = "wart"

[[decals]]
cube = "body"
face = "up"
x = 10
y = 5
w = 2
h = 2
colour = "wart"

[[decals]]
cube = "body"
face = "up"
x = 6
y = 10
w = 2
h = 2
colour = "wart"

[[decals]]
cube = "body"
face = "up"
x = 12
y = 13
w = 2
h = 2
colour = "wart"

[[decals]]
cube = "body"
face = "up"
