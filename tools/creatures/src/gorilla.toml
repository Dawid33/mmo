# DF GORILLA (wild, tropical forests): 150 kg, a huge ground-living ape; the
# dominant male has a silver back. Biped template (the raws call it a quadruped
# with grasping forelimbs; standing it reads as an ape): short legs, a broad,
# deep chest, arms long enough to reach the knees, a heavy brow and a bare
# black face. A small forward lean of the torso is merged into idle and walk.
# Attacks bite (mapped to the template's `attack`, a swing of the arm) and
# scratch (optional, not made). Not SAVAGE: the biped worker clips are harmless.
name = "gorilla"
template = "biped"
status = "draft"

[proportions]
leg = [6, 8]
foot = 2
leg_inset = 1
body = [15, 14, 10]
arm = [5, 17]
hand = 4
head = [8, 8, 7]
walk = { cycle = 1.1, swing = 24, bob = 0.6 }
run = { cycle = 0.7, swing = 40, bob = 1.3, lean = 18 }

# Head pivot: the neck; the head spans y 0..8, z -3.5..3.5.
[[cubes]]
name = "brow"
bone = "head"
part = "fur"
from = [-4, 5.5, -4.5]
to = [4, 7.5, -3.5]

[[cubes]]
name = "muzzle"
bone = "head"
part = "face"
from = [-2.5, 0.5, -4.5]
to = [2.5, 4, -3.5]

[[cubes]]
name = "crest"
bone = "head"
part = "fur"
from = [-2, 8, -2]
to = [2, 9.5, 2]

# Torso pivot: the hips; the torso spans y 0..14 above it. Hunched shoulders
# standing a unit proud of the torso top.
[[cubes]]
name = "shoulders"
bone = "torso"
part = "torso"
from = [-8, 10, -5.5]
to = [8, 15, 4.5]

# Hunched: lean the torso a little in idle and walk (the head rides on it).
[clips.idle]
merge = true
keys = [
  { bone = "torso", channel = "rotation", time = 0, value = [-8, 0, 0] },
  { bone = "torso", channel = "rotation", time = 4, value = [-8, 0, 0] },
]

[clips.walk]
merge = true
keys = [
  { bone = "torso", channel = "rotation", time = 0, value = [-10, 0, 0] },
  { bone = "torso", channel = "rotation", time = 1.1, value = [-10, 0, 0] },
]

[palette]
head = "#2a2826"
head_up = "#34312e"
fur = "#2a2826"
fur_up = "#34312e"
face = "#141312"
hands = "#1c1a19"
torso = "#2a2826"
torso_up = "#9a9894"
torso_down = "#22201e"
arms = "#2a2826"
legs = "#2a2826"
feet = "#1c1a19"
eye = "#5a3a20"
nostril = "#050505"
mouth = "#0a0909"
silver = "#8e8c88"

# The head's front face is 8×8 (row 0 at the top): the brow covers rows 1-2,
# the face under it; the muzzle's 5×3.5.
[[decals]]
cube = "head"
face = "north"
x = 1
y = 2
w = 6
h = 3
colour = "face"

[[decals]]
cube = "head"
face = "north"
x = 2
y = 3
w = 1
colour = "eye"

[[decals]]
cube = "head"
face = "north"
x = 5
y = 3
w = 1
colour = "eye"

[[decals]]
cube = "muzzle"
face = "north"
x = 1
y = 0
w = 3
colour = "nostril"

[[decals]]
cube = "muzzle"
face = "north"
x = 1
y = 2
w = 3
colour = "mouth"

# The silver back: the shoulders' back and the torso's back face.
[[decals]]
cube = "torso"
face = "south"
x = 1
y = 0
w = 13
h = 9
colour = "silver"

[[decals]]
cube = "shoulders"
face = "south"
x = 0
y = 0
w = 16
h = 5
colour = "silver"
