# DF SPIDER_MONKEY (wild, tropical forests): 8.5 kg, a canopy monkey with
# extremely long arms and legs. Quadruped template on stilt legs with a very
# long tail carried high in a curve (a second tail cube, bent up): black-brown
# fur, a bare dark face with a pale ring round the eyes. Attacks bite (the
# template's `attack`) and scratch (optional, not made).
name = "spider monkey"
template = "quadruped"
status = "draft"

[proportions]
body = [4, 4, 8]
leg = [2, 8]
leg_ends = 0
head = [4, 4, 3]
head_up = 2
tail = [1, 9]
tail_raise = 35
walk = { cycle = 0.8, swing = 24, bob = 0.3 }
run = { cycle = 0.46, swing = 40, bob = 0.7, pitch = 6 }
idle = { length = 4.0, look = 28, breath = 0.1, wag = 8 }
attack = { length = 0.5, lunge = 2 }
eat = { length = 1.5, reach = 50, forward = 2 }

# Head pivot: the neck joint; the head cube spans y -1..3, z -2..1 around it.
[[cubes]]
name = "muzzle"
bone = "head"
part = "face"
from = [-1, -1, -2.5]
to = [1, 0.5, -2]

# The tail's tip curls up (tail pivot: its root; the tail runs +z from it).
[[cubes]]
name = "tail_tip"
bone = "tail"
part = "tail"
from = [-0.5, 0, 8]
to = [0.5, 4, 9]

[palette]
fur = "#3a2c22"
fur_down = "#5a4434"
legs = "#30241c"
head = "#3a2c22"
tail = "#30241c"
face = "#4a3a30"
ring = "#a88c70"
eye = "#120c08"
nose = "#1a1210"

# The head's front face is 4×4 (row 0 at the top): pale rings round the eyes.
[[decals]]
cube = "head"
face = "north"
x = 0
y = 1
w = 4
h = 2
colour = "ring"

[[decals]]
cube = "head"
face = "north"
x = 0
y = 1
colour = "eye"

[[decals]]
cube = "head"
face = "north"
x = 3
y = 1
colour = "eye"

[[decals]]
cube = "head"
face = "north"
x = 1
y = 3
w = 2
colour = "face"

[[decals]]
cube = "muzzle"
face = "north"
x = 0
y = 0
w = 2
colour = "nose"
