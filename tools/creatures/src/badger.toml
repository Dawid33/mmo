# DF BADGER (creature_temperate): 15 kg, low, broad digging mustelid.
# Attacks bite (the template's `attack`) and scratch (optional, not made).
# White head with the two black stripes through the eyes, grey body, black legs.
name = "badger"
template = "quadruped"
status = "draft"

[proportions]
body = [7, 5, 11]
leg = [2, 3]
leg_ends = 0
head = [5, 4, 4]
head_up = 0
tail = [2, 3]
tail_raise = 10
walk = { cycle = 0.6, swing = 30, bob = 0.2 }
run = { cycle = 0.36, swing = 48, bob = 0.6, pitch = 5 }
idle = { length = 4.0, look = 18, breath = 0.12, wag = 4 }
attack = { length = 0.5, lunge = 2.5 }
eat = { length = 1.4, reach = 30, forward = 1.5 }

# Head pivot: the neck joint; the head cube spans y -3..1, z -3..1 around it.
[[cubes]]
name = "snout"
bone = "head"
part = "snout"
from = [-1.5, -3, -5]
to = [1.5, -1, -3]

[[cubes]]
name = "ear_l"
bone = "head"
part = "ears"
mirror = true
from = [-2.5, 1, 0]
to = [-1.5, 2, 1]

[palette]
fur = "#8e8a85"
fur_up = "#a19d97"
fur_down = "#2a2826"
legs = "#1e1c1b"
head = "#eeeae2"
snout = "#eeeae2"
ears = "#eeeae2"
tail = "#8e8a85"
stripe = "#1e1c1b"
nose = "#121110"

# The two stripes from the nose over the eyes to the ears: the head's front
# (5 × 4, the snout covers the lower two rows), top (5 wide × 4 long) and
# sides (4 × 4), plus the snout's top (3 wide × 2 long).
[[decals]]
cube = "head"
face = "north"
x = 1
y = 0
h = 2
colour = "stripe"

[[decals]]
cube = "head"
face = "north"
x = 3
y = 0
h = 2
colour = "stripe"

[[decals]]
cube = "head"
face = "up"
x = 1
y = 0
h = 4
colour = "stripe"

[[decals]]
cube = "head"
face = "up"
x = 3
y = 0
h = 4
colour = "stripe"

[[decals]]
cube = "head"
face = "west"
x = 0
y = 1
w = 4
colour = "stripe"

[[decals]]
cube = "head"
face = "east"
x = 0
y = 1
w = 4
colour = "stripe"

[[decals]]
cube = "snout"
face = "up"
x = 0
y = 0
h = 2
colour = "stripe"

[[decals]]
cube = "snout"
face = "up"
x = 2
y = 0
h = 2
colour = "stripe"

[[decals]]
cube = "snout"
face = "north"
x = 1
y = 0
colour = "nose"
