# DF SKUNK (creature_temperate_new): 4 kg, the striped skunk.
# Attack bite (the template's `attack`); scratch optional, not made. The spray
# is not an interaction in the raws, so no clip. Black with the white blaze up the
# face and the two white stripes down the back into the big raised plume tail.
name = "skunk"
template = "quadruped"
status = "draft"

[proportions]
body = [5, 5, 8]
leg = [2, 2]
leg_ends = 0
head = [4, 3, 3]
head_up = 0
tail = [4, 7]
tail_raise = 55
walk = { cycle = 0.65, swing = 28, bob = 0.2 }
run = { cycle = 0.4, swing = 42, bob = 0.5, pitch = 5 }
idle = { length = 4.0, look = 18, breath = 0.12, wag = 5 }
attack = { length = 0.45, lunge = 2 }
eat = { length = 1.4, reach = 35, forward = 1.5 }

# Head pivot: the neck joint; the head cube spans y -2..1, z -2..1 around it.
[[cubes]]
name = "snout"
bone = "head"
part = "snout"
from = [-1, -2, -4]
to = [1, -0.5, -2]

[[cubes]]
name = "ear_l"
bone = "head"
part = "ears"
mirror = true
from = [-2, 1, 0]
to = [-1, 1.5, 1]

[palette]
fur = "#161414"
legs = "#121010"
head = "#161414"
snout = "#161414"
ears = "#161414"
tail = "#161414"
tail_up = "#ece8e0"
white = "#ece8e0"
eye = "#3a3434"
nose = "#0a0909"

# The blaze up the face (4 × 3) and over the crown, and the two back stripes
# (body top 5 wide × 8 long; sides 8 × 5, front west-left / east-right).
[[decals]]
cube = "head"
face = "north"
x = 1
y = 0
w = 2
h = 1
colour = "white"

[[decals]]
cube = "head"
face = "up"
x = 1
y = 0
w = 2
h = 3
colour = "white"

[[decals]]
cube = "snout"
face = "up"
x = 0
y = 1
w = 2
h = 1
colour = "white"

[[decals]]
cube = "body"
face = "up"
x = 0
y = 0
w = 1
h = 8
colour = "white"

[[decals]]
cube = "body"
face = "up"
x = 4
y = 0
w = 1
h = 8
colour = "white"

[[decals]]
cube = "body"
face = "up"
