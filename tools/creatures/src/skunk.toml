[[decals]]
cube = "body"
face = "east"
x = 0
y = 0
w = 8
h = 1
colour = "white"

[[decals]]
cube = "head"
face = "north"
x = 0
y = 1
colour = "eye"

[[decals]]
cube = "head"
face = "north"
x = 3
y = 1
colour = "eye"
