# DF SHARK_ANGEL (wild, large ocean): 15 kg, a flat ray-like shark buried in the
# sand: a wide low body, broad wing-like pectorals and small pelvics laid flat
# (static extra cubes: hinged pectorals would dip through the ground on a body
# this low), eyes on top, two small dorsals on the tail, sandy with spots.
# Attacks bite (the template's `attack`) and slap (optional, not made).
name = "angelshark"
template = "fish"
status = "draft"

[proportions]
body = [7, 2, 9]
head = [6, 2, 3]
tail = [2, 1.5, 5]
fin = [1, 2, 2]
pectoral = [0, 0]
dorsal = [1, 0, 0]
swim = { cycle = 0.9, amp = 14 }

# Body pivot: its centre; the body spans x -3.5..3.5, y -1..1, z -4.5..4.5.
[[cubes]]
name = "pectoral_l"
bone = "body"
part = "fins"
from = [-6.5, -1, -3.5]
to = [-3.5, 0, 2.5]
mirror = true

[[cubes]]
name = "pelvic_l"
bone = "body"
part = "fins"
from = [-5, -1, 2.5]
to = [-3.5, 0, 4.5]
mirror = true

# Tail pivot: the body's back at mid-height; the tail spans y -0.75..0.75, z 0..5.
[[cubes]]
name = "dorsal_1"
bone = "tail"
part = "fins"
from = [-0.5, 0.75, 1]
to = [0.5, 2, 2.5]

[[cubes]]
name = "dorsal_2"
bone = "tail"
part = "fins"
from = [-0.5, 0.75, 3]
to = [0.5, 1.75, 4.5]

[palette]
body = "#a08a62"
body_down = "#e3dccb"
head = "#a08a62"
head_down = "#e3dccb"
fins = "#94805a"
spot = "#6e5c3e"
light = "#e0d4b8"
eye = "#121010"

[[decals]]
cube = "head"
face = "up"
x = 1
y = 1
colour = "eye"

[[decals]]
cube = "head"
face = "up"
x = 4
y = 1
colour = "eye"

[[decals]]
