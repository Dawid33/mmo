# DF RIVER OTTER (creature_riverlakepool_new): 10 kg, long sleek river hunter.
# Attack bite (the template's `attack`); scratch optional, not made.
# AMPHIBIOUS: swim + swim_idle. Long low body, short legs, a flat broad head
# with a pale muzzle and throat, thick tapering tail.
name = "river otter"
template = "quadruped"
status = "draft"
extras = ["swim", "swim_idle"]

[proportions]
body = [5, 4, 11]
leg = [2, 2]
leg_ends = 0
head = [4, 3, 3]
head_up = 0
tail = [3, 6]
tail_raise = -8
walk = { cycle = 0.6, swing = 30, bob = 0.2 }
run = { cycle = 0.36, swing = 46, bob = 0.6, pitch = 6 }
idle = { length = 4.0, look = 22, breath = 0.12, wag = 8 }
attack = { length = 0.45, lunge = 2.5 }
eat = { length = 1.4, reach = 32, forward = 1.5 }

# Head pivot: the neck joint; the head cube spans y -2..1, z -2..1 around it.
[[cubes]]
name = "muzzle"
bone = "head"
part = "muzzle"
from = [-1.5, -2, -3.5]
to = [1.5, -0.5, -2]

[[cubes]]
name = "ear_l"
bone = "head"
part = "ears"
mirror = true
from = [-2, 1, 0]
to = [-1.5, 1.5, 0.5]

# The tail tapers: a thinner tip beyond the 6-long root.
[[cubes]]
name = "tail_tip"
bone = "tail"
part = "tail"
from = [-1, -1, 5]
to = [1, 1, 9]

[palette]
fur = "#5a3e28"
fur_up = "#523824"
fur_down = "#8e6e4e"
legs = "#4a3220"
head = "#5a3e28"
head_down = "#b49a7a"
muzzle = "#a08466"
ears = "#4a3220"
tail = "#523824"
eye = "#0a0807"
nose = "#141110"

[[decals]]
cube = "head"
face = "north"
x = 0
y = 0
colour = "eye"

[[decals]]
cube = "head"
face = "north"
x = 3
y = 0
colour = "eye"

[[decals]]
cube = "muzzle"
face = "north"
x = 1
y = 0
colour = "nose"
