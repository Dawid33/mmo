# DF BAT_MAN (underground, chasm): an animal person of the bat, "a humanoid with the
# head of a bat and wings stretching from wrist to ankle". Hand-made on the biped +
# [wings] (an animal person derived from the bat gets no wings): 26 units, dark
# brown fur, a bat head with tall ears and a pug snout, black membrane wings from
# the shoulders (the wrist-to-ankle membrane is not modelled). FLIER: the fly set.
# Attacks bite (the template's `attack` is a punch), punch, kick, scratch optional
# (not made). Worker set from the biped.
name = "bat man"
template = "biped"
status = "draft"

[proportions]
leg = [3, 10]
foot = 1
body = [9, 10, 5]
arm = [3, 11]
hand = 2
head = [7, 6, 6]
walk = { cycle = 0.85, swing = 28 }
run = { cycle = 0.52 }

# Torso pivot: the hips; the wings' left root at the shoulder blades.
[wings]
bone = "torso"
at = [-1, 9, 2]
span = 9
chord = 7
part = "wings"
cycle = 0.45
flap = 50

# Head pivot: the neck; the head spans y 0..6, z -3..3.
[[cubes]]
name = "ear_l"
bone = "head"
part = "ears"
mirror = true
from = [-3.5, 5, -1]
to = [-1.5, 10, 1]

[[cubes]]
name = "snout"
bone = "head"
part = "snout"
from = [-1.5, 1, -4.5]
to = [1.5, 3, -3]

[[cubes]]
name = "fang_l"
bone = "head"
part = "fang"
mirror = true
from = [-1.5, 0, -4]
to = [-0.5, 1, -3]

[palette]
head = "#4a3426"
hands = "#2a201a"
torso = "#4a3426"
torso_north = "#5e4434"
arms = "#4a3426"
legs = "#3e2c20"
feet = "#2a201a"
ears = "#2c201a"
ears_north = "#5a3a32"
snout = "#2a1a14"
fang = "#ece4d0"
wings = "#221a18"
wings_up = "#2c2220"
eye = "#e0a020"

# The head's front face is 7×6 (row 0 at the top).
[[decals]]
cube = "head"
face = "north"
x = 1
y = 1
w = 2
colour = "eye"

[[decals]]
cube = "head"
face = "north"
x = 4
y = 1
w = 2
colour = "eye"

# Wings flat against the back when lying (as on the pixie).
[clips.lie]
merge = true
keys = [
  { bone = "wing_l", channel = "rotation", time = 0, value = [-180, -90, 0] },
  { bone = "wing_r", channel = "rotation", time = 0, value = [-180, 90, 0] },
]

[clips.sleep]
merge = true
keys = [
  { bone = "wing_l", channel = "rotation", time = 0, value = [-180, -90, 0] },
  { bone = "wing_r", channel = "rotation", time = 0, value = [-180, 90, 0] },
]

[clips.death]
merge = true
keys = [
  { bone = "wing_l", channel = "rotation", time = 0, value = [-180, -90, 0] },
  { bone = "wing_r", channel = "rotation", time = 0, value = [-180, 90, 0] },
]
