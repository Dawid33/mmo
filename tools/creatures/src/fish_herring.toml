# DF FISH_HERRING (vermin, ocean): 0.2 kg, "a tiny marine fish found in vast schools".
# Vermin form: `move` + `death` only (vermin have no attack clip). Silver flanks under a blue-green back, a forked tail.
name = "herring"
template = "vermin"
status = "draft"

decals = [
  { cube = "head", face = "west", x = 0, y = 0, colour = "eye" },
  { cube = "head", face = "east", x = 0, y = 0, colour = "eye" },
]

[proportions]
body = [1, 1.5, 3.5]
head = [1, 1.25, 1]
legs = 0
move = "swim"
cycle = 0.4

# Body pivot: its centre; the body spans y -0.75..0.75, z -1.75..1.75.
# The tail bone sits at the body's rear; the head's pivot is the body's front
# (the head spans y -0.75..0.5, z -1..0).
[[bones]]
name = "tail"
parent = "body"
pivot = [0, 0, 1.75]

[[cubes]]
name = "tail_fin"
bone = "tail"
part = "fins"
from = [-0.25, -0.75, 0]
to = [0.25, 0.75, 1]

[[cubes]]
name = "dorsal"
bone = "body"
part = "fins"
from = [-0.25, 0.75, -0.5]
to = [0.25, 1.25, 0.5]

[palette]
eye = "#101010"
body = "#c8d0d4"
body_up = "#3a6a7a"
body_down = "#eef0f0"
head = "#bcc5ca"
head_up = "#365f6e"
fins = "#8e9ca2"

# The tail fin wags harder than the body's swim yaw.
[clips.move]
merge = true
mode = "loop"
length = 0.4
keys = [
  { bone = "tail", channel = "rotation", time = 0, value = [0, 0, 0] },
  { bone = "tail", channel = "rotation", time = 0.1, value = [0, 25, 0] },
  { bone = "tail", channel = "rotation", time = 0.2, value = [0, 0, 0] },
  { bone = "tail", channel = "rotation", time = 0.3, value = [0, -25, 0] },
  { bone = "tail", channel = "rotation", time = 0.4, value = [0, 0, 0] },
]
