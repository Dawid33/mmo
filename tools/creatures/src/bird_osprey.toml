# DF BIRD_OSPREY (wild): 2 kg, the osprey: dark brown back and wings, white underside
# and head with a dark stripe through the yellow eye, black hooked bill, pale grey
# feet, long wings. FLIER; no brood. Attack: peck (the template's `attack`); the
# talon scratch is optional.
name = "osprey"
template = "bird"
status = "draft"

[proportions]
body = [5, 5, 7]
leg = [1, 3]
foot = [3, 1, 2]
head = [3, 3, 3]
neck = 1
head_back = 2
beak = [1, 1, 1.5]
tail = [4, 1, 4]
tail_raise = 15
wing = [10, 4]
walk = { cycle = 0.6, swing = 26 }
run = { cycle = 0.35 }
fly = { cycle = 0.7, flap = 35 }

[palette]
body = "#4a3626"
body_north = "#f1eee6"
body_down = "#f1eee6"
head = "#f1eee6"
head_up = "#e6e1d6"
wings = "#45322a"
tail = "#5a4636"
legs = "#c9c8c0"
beak = "#1c1c1c"
eye = "#e8c22a"
stripe = "#3a2a20"

[[decals]]
cube = "head"
face = "west"
x = 0
y = 1
w = 3
colour = "stripe"

[[decals]]
cube = "head"
face = "east"
x = 0
y = 1
w = 3
colour = "stripe"

[[decals]]
cube = "head"
face = "west"
x = 0
y = 1
colour = "eye"

[[decals]]
cube = "head"
face = "east"
x = 2
y = 1
colour = "eye"
