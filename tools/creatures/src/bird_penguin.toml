# DF BIRD_PENGUIN (wild, shorelines): 4 kg, "a small flightless bird that lives on
# arctic shorelines". Bird template, flier = false, the body stood upright: 14
# units tall, black back and head with a white band round the face, white front,
# a black bill, pink feet. Not AMPHIBIOUS in the raws, but a penguin swims: swim +
# swim_idle. LAYS_EGGS but wild: no brood. Attack bite (the template's peck).
name = "penguin"
template = "bird"
status = "draft"
extras = ["swim", "swim_idle"]

[proportions]
body = [5, 9, 5]
leg = [1, 2]
foot = [2, 1, 2]
head = [4, 4, 4]
neck = 0
head_back = 3
beak = [1, 1, 2]
tail = [0, 0, 0]
wing = [1, 1]
flier = false
walk = { cycle = 0.5, swing = 22, bob = 0.2, nod = 0.3 }
run = { cycle = 0.33, swing = 34, lean = 8 }

# Body pivot: its centre. Flippers hang down the sides (static cubes: the bird
# template's wings fold along the back, so they are kept as stubs); the short tail
# sits at the bottom of the back.
[[cubes]]
name = "flipper_l"
bone = "body"
part = "wings"
mirror = true
from = [-3, -3.5, -1]
to = [-2.5, 3, 1]

[[cubes]]
name = "tail_stub"
bone = "body"
part = "wings"
from = [-1, -4.5, 2.5]
to = [1, -3.5, 4]

# A side-to-side waddle on the walk (keys at 0, half and full cycle).
[clips.walk]
merge = true
keys = [
  { bone = "body", channel = "rotation", time = 0, value = [0, 0, 7] },
  { bone = "body", channel = "rotation", time = 0.25, value = [0, 0, -7] },
  { bone = "body", channel = "rotation", time = 0.5, value = [0, 0, 7] },
]

[palette]
body = "#1a1c22"
body_north = "#f4f2ec"
body_down = "#e8e6e0"
head = "#1a1c22"
wings = "#1a1c22"
tail = "#1a1c22"
legs = "#e0a0a0"
beak = "#1a1a1a"
band = "#f4f2ec"
eye = "#0a0a0a"

# The head sides are 4×4: a white band from the eye down to the throat.
[[decals]]
cube = "head"
face = "west"
x = 1
y = 0
w = 2
h = 4
colour = "band"

[[decals]]
cube = "head"
face = "east"
x = 1
y = 0
w = 2
h = 4
colour = "band"

[[decals]]
cube = "head"
face = "west"
x = 0
y = 1
colour = "eye"

[[decals]]
cube = "head"
face = "east"
x = 3
y = 1
colour = "eye"
