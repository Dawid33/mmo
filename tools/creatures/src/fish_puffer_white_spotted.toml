# DF FISH_PUFFER_WHITE_SPOTTED (vermin, coral reefs): 0.2 kg, "a small, round,
# brightly-colored fish". Vermin form: `move` + `death` only (vermin have no attack clip). A boxy-round grey-brown body covered in white
# spots, a pale belly, small fins and a stubby tail. (Inflating is not a DF behaviour
# for it, so not made.)
name = "white-spotted puffer"
template = "vermin"
status = "draft"

decals = [
  { cube = "head", face = "west", x = 0, y = 0, colour = "eye" },
  { cube = "head", face = "east", x = 0, y = 0, colour = "eye" },
  { cube = "body", face = "up", x = 0, y = 0, colour = "spot" },
  { cube = "body", face = "up", x = 2, y = 1, colour = "spot" },
  { cube = "body", face = "up", x = 0, y = 2, colour = "spot" },
  { cube = "body", face = "west", x = 1, y = 0, colour = "spot" },
  { cube = "body", face = "west", x = 2, y = 2, colour = "spot" },
  { cube = "body", face = "east", x = 1, y = 0, colour = "spot" },
  { cube = "body", face = "east", x = 0, y = 2, colour = "spot" },
  { cube = "head", face = "up", x = 0, y = 0, colour = "spot" },
]

[proportions]
body = [2.5, 2.5, 3]
head = [2, 2, 1]
legs = 0
move = "swim"
cycle = 0.6

# Body pivot: its centre; the body spans y -1.25..1.25, z -1.5..1.5.
# The tail bone sits at the body's rear; the head's pivot is the body's front
# (the head spans y -1.25..0.75, z -1..0).
[[bones]]
name = "tail"
parent = "body"
pivot = [0, 0, 1.5]

[[cubes]]
name = "tail_fin"
bone = "tail"
part = "fins"
from = [-0.25, -0.75, 0]
to = [0.25, 0.75, 1]

[[cubes]]
name = "dorsal"
bone = "body"
part = "fins"
from = [-0.25, 1.25, 0.5]
to = [0.25, 1.75, 1.25]

[[cubes]]
name = "fin_l"
bone = "body"
part = "fins"
from = [-2, -1, -1.25]
to = [-1.25, -0.75, -0.25]
mirror = true

[palette]
eye = "#101010"
body = "#6e6458"
body_down = "#ece8dc"
head = "#665c50"
head_down = "#ece8dc"
fins = "#5a5248"
spot = "#f4f2ea"

# The tail fin wags harder than the body's swim yaw.
[clips.move]
merge = true
mode = "loop"
length = 0.6
keys = [
  { bone = "tail", channel = "rotation", time = 0, value = [0, 0, 0] },
  { bone = "tail", channel = "rotation", time = 0.15, value = [0, 25, 0] },
  { bone = "tail", channel = "rotation", time = 0.3, value = [0, 0, 0] },
  { bone = "tail", channel = "rotation", time = 0.45, value = [0, -25, 0] },
  { bone = "tail", channel = "rotation", time = 0.6, value = [0, 0, 0] },
]
