# DF POND_TURTLE (vermin, creature_riverlakepool_new): 0.5 kg, a tiny freshwater
# turtle. It has a giant, so the full quadruped rig at small size: a low dark-green
# shell over a low body on stubby splayed legs, a small head with a red stripe
# behind the eye (a slider), a short tail. Attack bite (the template's `attack`).
# AMPHIBIOUS: swim + swim_idle. Death rolls onto its side lifted by the shell's
# half-width (merged root position).
name = "pond turtle"
template = "quadruped"
status = "draft"
extras = ["swim", "swim_idle"]

decals = [
  { cube = "head", face = "west", x = 0, y = 0, colour = "eye" },
  { cube = "head", face = "east", x = 1, y = 0, colour = "eye" },
  { cube = "head", face = "west", x = 1, y = 0, colour = "red" },
  { cube = "head", face = "east", x = 0, y = 0, colour = "red" },
  { cube = "dome", face = "up", x = 1, y = 1, h = 2, colour = "scute" },
]

[proportions]
body = [3, 1, 4]
leg = [1, 1]
leg_inset = -0.5
leg_ends = 0
head = [1.5, 1, 1.5]
head_up = 0
head_overlap = 0
tail = [0.5, 1.5]
tail_raise = -15
walk = { cycle = 0.7, swing = 22, bob = 0.05 }
run = { cycle = 0.45, swing = 30, bob = 0.1, pitch = 2 }
idle = { length = 5.0, look = 25, breath = 0.04, wag = 0 }
attack = { length = 0.35, lunge = 0.6 }
eat = { length = 1.4, reach = 20, forward = 0.4 }

# Body pivot: its centre (y 1.5); the body spans y -0.5..0.5, z -2..2.
[[cubes]]
name = "shell"
bone = "body"
part = "shell"
from = [-2, -0.25, -2.75]
to = [2, 1, 2.75]

[[cubes]]
name = "dome"
bone = "body"
part = "shell"
from = [-1.5, 1, -2]
to = [1.5, 1.5, 2]

[palette]
fur = "#4a6a3a"
fur_down = "#c8c070"
legs = "#4a6a3a"
head = "#4e703c"
head_down = "#c8c070"
tail = "#4a6a3a"
shell = "#3e5230"
shell_up = "#465c36"
shell_down = "#d4c470"
scute = "#c8b850"
red = "#c8302a"
eye = "#141410"

[clips.death]
merge = true
keys = [
  { bone = "root", channel = "position", time = 0.0, value = [0, 0, 0] },
  { bone = "root", channel = "position", time = 0.6, value = [0, 2, 0] },
  { bone = "root", channel = "position", time = 1.0, value = [0, 2, 0] },
]
