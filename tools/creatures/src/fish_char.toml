# DF FISH_CHAR (vermin, temperate lakes/rivers): 0.2 kg, "a medium-sized spotted fish".
# Vermin form: `move` + `death` only (vermin have no attack clip). Arctic char: olive back, orange-red belly, pale cream spots on the
# flanks, orange fins.
name = "char"
template = "vermin"
status = "draft"

decals = [
  { cube = "head", face = "west", x = 0, y = 0, colour = "eye" },
  { cube = "head", face = "east", x = 1, y = 0, colour = "eye" },
  { cube = "body", face = "west", x = 1, y = 0, colour = "spot" },
  { cube = "body", face = "west", x = 3, y = 0, colour = "spot" },
  { cube = "body", face = "east", x = 1, y = 0, colour = "spot" },
  { cube = "body", face = "east", x = 3, y = 0, colour = "spot" },
  { cube = "body", face = "up", x = 0, y = 1, colour = "spot" },
  { cube = "body", face = "up", x = 1, y = 3, colour = "spot" },
]

[proportions]
body = [1.5, 2, 4.5]
head = [1.25, 1.75, 1.25]
legs = 0
move = "swim"
cycle = 0.5

# Body pivot: its centre; the body spans y -1..1, z -2.25..2.25.
# The tail bone sits at the body's rear; the head's pivot is the body's front
# (the head spans y -1..0.75, z -1.25..0).
[[bones]]
name = "tail"
parent = "body"
pivot = [0, 0, 2.25]

[[cubes]]
name = "tail_fin"
bone = "tail"
part = "fins"
from = [-0.25, -1, 0]
to = [0.25, 1, 1.25]

[[cubes]]
name = "dorsal"
bone = "body"
part = "fins"
from = [-0.25, 1, -1]
to = [0.25, 1.75, 0.5]

[[cubes]]
name = "fin_l"
bone = "body"
part = "fins"
from = [-1.5, -0.75, -2]
to = [-0.75, -0.5, -1]
mirror = true

[palette]
eye = "#101010"
body = "#6e7a5e"
body_up = "#4b5843"
body_down = "#d9653a"
head = "#66724f"
head_down = "#d9653a"
fins = "#cf6a3c"
spot = "#ecdcb4"

# The tail fin wags harder than the body's swim yaw.
[clips.move]
merge = true
mode = "loop"
length = 0.5
keys = [
  { bone = "tail", channel = "rotation", time = 0, value = [0, 0, 0] },
  { bone = "tail", channel = "rotation", time = 0.125, value = [0, 25, 0] },
  { bone = "tail", channel = "rotation", time = 0.25, value = [0, 0, 0] },
  { bone = "tail", channel = "rotation", time = 0.375, value = [0, -25, 0] },
  { bone = "tail", channel = "rotation", time = 0.5, value = [0, 0, 0] },
]
