# DF LION_TAMARIN (vermin, creature_tropical_new): 0.62 kg, a small orange monkey
# with a long tail. It has a giant, so the full quadruped rig at small size (it
# runs along branches on all fours): golden-orange body, a lion-like mane framing a
# dark bare face, a long hanging tail. Attack bite (the template's `attack`).
name = "lion tamarin"
template = "quadruped"
status = "draft"

decals = [
  { cube = "head", face = "north", x = 0, y = 1, colour = "eye" },
  { cube = "head", face = "north", x = 2, y = 1, colour = "eye" },
]

[proportions]
body = [3, 3, 5]
leg = [1, 3]
leg_ends = 0
head = [3, 3, 2]
head_up = 1.5
head_overlap = 0
tail = [1, 9]
tail_raise = -35
walk = { cycle = 0.4, swing = 32, bob = 0.2 }
run = { cycle = 0.26, swing = 48, bob = 0.5, pitch = 6 }
idle = { length = 3.5, look = 35, breath = 0.06, wag = 6 }
attack = { length = 0.35, lunge = 1 }
eat = { length = 1.1, reach = 40, forward = 0.6 }

# Head pivot: the neck joint; the head cube spans y -0.5..2.5, z -2..0 around it.
# The mane is a wider ring just behind the face.
[[cubes]]
name = "mane"
bone = "head"
part = "mane"
from = [-2, -1, -1.5]
to = [2, 3, 0.5]

[palette]
fur = "#e88a26"
fur_down = "#d47a1c"
legs = "#d87e20"
head = "#e88a26"
head_north = "#4a3228"
mane = "#f0a038"
mane_north = "#f0a038"
tail = "#e08424"
eye = "#120c08"
