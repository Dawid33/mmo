# DF MOLE_DOG_NAKED (underground): 60 kg, "a large, pale rodent with loose, hanging,
# hairless skin. It has long teeth and an incredibly powerful bite"; pink with black
# (raws). A naked mole rat the size of a big dog: wrinkled pink skin (fold decals and
# a sagging dewlap and belly flap), huge protruding incisors top and bottom, tiny
# dark eyes, a short thin tail. Attack bite (the template's `attack`); scratch
# optional, not made. CURIOUSBEAST_EATER/GUZZLER: pick_up + carry.
name = "naked mole dog"
template = "quadruped"
status = "draft"
extras = ["pick_up", "carry"]

[proportions]
body = [8, 7, 17]
leg = [2, 4]
leg_inset = -0.5
leg_ends = 2
head = [6, 5, 5]
head_up = -1
head_overlap = 1
tail = [1, 5]
tail_raise = -10
walk = { cycle = 0.8, swing = 30, bob = 0.3 }
run = { cycle = 0.45, swing = 44, bob = 0.6, pitch = 4 }
idle = { length = 4.5, look = 16, breath = 0.25, wag = 6 }
attack = { length = 0.55, lunge = 3.5 }
eat = { length = 1.6, reach = 30, forward = 2 }

# Head pivot: the neck joint; the head cube spans y -5..0, z -4..1 around it.
[[cubes]]
name = "snout"
bone = "head"
part = "head"
from = [-2, -5, -6]
to = [2, -2, -4]

[[cubes]]
name = "incisors_top"
bone = "head"
part = "teeth"
from = [-1, -6.5, -6.5]
to = [1, -3.5, -5.5]

[[cubes]]
name = "incisors_bottom"
bone = "head"
part = "teeth"
from = [-1, -7, -5.5]
to = [1, -5, -4.5]

[[cubes]]
name = "dewlap"
bone = "head"
part = "skin"
from = [-2.5, -6.5, -3]
to = [2.5, -5, 1]

# Loose skin sagging under the belly (body pivot: its centre; body y -3.5..3.5).
[[cubes]]
name = "belly"
bone = "body"
part = "skin"
from = [-3.5, -4.5, -6]
to = [3.5, -3.5, 6]

[palette]
fur = "#e8b0a4"
fur_up = "#e2a698"
fur_down = "#d8988c"
skin = "#dc9c90"
legs = "#e0a69a"
head = "#e8b0a4"
tail = "#dc9c90"
teeth = "#f0e2b0"
fold = "#c88478"
eye = "#141010"

[[decals]]
cube = "head"
face = "west"
x = 1
y = 1
colour = "eye"

[[decals]]
cube = "head"
face = "east"
x = 3
y = 1
colour = "eye"

# Wrinkles: skin folds across the back (8 wide × 17 long; row 0 at the front) and
# down the flanks.
[[decals]]
cube = "body"
face = "up"
x = 0
y = 3
w = 8
colour = "fold"

[[decals]]
cube = "body"
face = "up"
x = 0
y = 7
w = 8
colour = "fold"

[[decals]]
cube = "body"
face = "up"
x = 0
y = 11
w = 8
colour = "fold"

[[decals]]
cube = "body"
face = "west"
x = 4
y = 1
h = 4
colour = "fold"

[[decals]]
cube = "body"
face = "west"
x = 9
y = 2
h = 4
colour = "fold"

[[decals]]
cube = "body"
face = "east"
x = 12
y = 1
h = 4
colour = "fold"

[[decals]]
cube = "body"
face = "east"
x = 7
y = 2
h = 4
colour = "fold"
