# DF BLOOD_MAN (underground, near the underworld): 70 kg, "a man-shaped abomination
# made entirely of blood". Biped, human-sized (30 units) and leaner than the
# elemental men: dark clotted red, brighter where it runs, drips off the arms and
# chin, black eyes. NOT_LIVING / NO_EAT: eat comes with the template, never played.
# LARGE_PREDATOR: alert + roar. Attacks punch (the template's `attack`), kick
# optional (not made).
name = "blood man"
template = "biped"
status = "draft"
extras = ["alert", "roar"]

[proportions]
leg = [4, 12]
foot = 0
body = [10, 11, 6]
arm = [3, 13]
hand = 2
head = [7, 7, 7]
walk = { cycle = 1.0, swing = 26, bob = 0.5 }
run = { cycle = 0.6, swing = 44, bob = 1.0 }

# Head pivot: the neck; the head spans y 0..7, z -3.5..3.5.
[[cubes]]
name = "chin_drip"
bone = "head"
part = "fresh"
from = [-1, -2, -4]
to = [1, 1, -3]

[[cubes]]
name = "crown"
bone = "head"
part = "fresh"
from = [-3.5, 6, -3.5]
to = [3.5, 7.5, 3.5]

# Arm pivots: the shoulders; a long drip off each hand.
[[cubes]]
name = "drip_l"
bone = "arm_l"
part = "fresh"
mirror = true
from = [-0.5, -14.5, -0.5]
to = [0.5, -11, 0.5]

# Torso pivot: the hips; a puddle-like spill down the chest.
[[cubes]]
name = "spill"
bone = "torso"
part = "fresh"
from = [-2, 3, -3.5]
to = [3, 10, -3]

[palette]
head = "#7a0c10"
head_up = "#94141a"
hands = "#6a0a0e"
torso = "#7a0c10"
torso_up = "#94141a"
arms = "#7a0c10"
legs = "#640a0c"
fresh = "#b01a1e"
fresh_up = "#c82428"
eye = "#0e0404"
mouth = "#2a0406"

# The head's front face is 7×7 (row 0 at the top).
[[decals]]
cube = "head"
face = "north"
x = 1
y = 3
w = 2
colour = "eye"

[[decals]]
cube = "head"
face = "north"
x = 4
y = 3
w = 2
colour = "eye"

[[decals]]
cube = "head"
face = "north"
x = 2
y = 5
w = 3
colour = "mouth"
