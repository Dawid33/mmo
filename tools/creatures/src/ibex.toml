# DF IBEX (creature_large_temperate): 80 kg, mountain wild goat.
# Attack kick (the template's `attack`: its lunge reads as a head-butt); bite
# optional, not made. A billy: huge ridged horns sweeping back in three cubes a
# side, beard, dark-legged grey-brown coat.
name = "ibex"
template = "quadruped"
status = "draft"

[proportions]
body = [7, 8, 15]
leg = [3, 7]
head = [4, 5, 5]
head_up = 4
tail = [2, 2]
tail_raise = 40
walk = { cycle = 0.85, swing = 26, bob = 0.3 }
run = { cycle = 0.46, swing = 46, bob = 1.1, pitch = 6 }
idle = { length = 4.5, look = 20, breath = 0.16, wag = 8 }
attack = { length = 0.65, lunge = 4 }
eat = { length = 1.8, reach = 60, forward = 3 }

# Head pivot: the neck joint; the head cube spans y 0..5, z -4..1 around it.

[[cubes]]
name = "horn_l"
bone = "head"
part = "horns"
mirror = true
from = [-2, 5, -1]
to = [-0.5, 9, 1]

[[cubes]]
name = "horn_mid_l"
bone = "head"
part = "horns"
mirror = true
from = [-2, 8, 1]
to = [-0.5, 10, 5]

[[cubes]]
name = "horn_end_l"
bone = "head"
part = "horns"
mirror = true
from = [-2, 5.5, 5]
to = [-0.5, 9, 6.5]

[[cubes]]
name = "beard"
bone = "head"
part = "beard"
from = [-1, -2.5, -4]
to = [1, 0.5, -3]

[[cubes]]
name = "ear_l"
bone = "head"
part = "ears"
mirror = true
from = [-4, 3, -0.5]
to = [-2, 4, 0.5]

[palette]
fur = "#8f7a60"
fur_up = "#9a856a"
fur_down = "#d8cdb8"
legs = "#4a3c30"
head = "#8a755c"
horns = "#4e4234"
horns_up = "#5a4e3e"
beard = "#3a3028"
ears = "#7a6650"
tail = "#3a3028"
ridge = "#2e261e"
eye = "#b08a3a"
nose = "#2a221c"

[[decals]]
cube = "head"
face = "north"
x = 0
y = 1
w = 1
h = 1
colour = "eye"

[[decals]]
cube = "head"
face = "north"
x = 3
y = 1
w = 1
h = 1
colour = "eye"

[[decals]]
cube = "head"
face = "north"
x = 1
y = 4
w = 2
h = 1
colour = "nose"

[[decals]]
cube = "horn_mid_l"
face = "up"
x = 0
y = 1
w = 2
h = 1
colour = "ridge"

[[decals]]
cube = "horn_mid_l"
face = "up"
x = 0
y = 3
w = 2
h = 1
colour = "ridge"

[[decals]]
cube = "horn_mid_r"
face = "up"
x = 0
y = 1
w = 2
h = 1
colour = "ridge"

[[decals]]
cube = "horn_mid_r"
face = "up"
