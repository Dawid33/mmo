# DF ALLIGATOR (creature_large_temperate): 400 kg, the river/marsh ambush reptile.
# Low body on splayed legs (negative leg_inset), a broad rounded snout (shorter and
# wider than the crocodile's), a long drooping tail with a scute ridge; near-black
# olive back, cream belly. Attack bite (the template's `attack`).
# LARGE_PREDATOR: alert + roar (a hiss); AMPHIBIOUS: swim + swim_idle; MOUNT_EXOTIC: ridden.
name = "alligator"
template = "quadruped"
status = "draft"
extras = ["alert", "roar", "swim", "swim_idle", "ridden"]

[proportions]
body = [11, 6, 22]
leg = [3, 4]
leg_inset = -1.5
leg_ends = 2
head = [8, 4, 6]
head_up = -2
head_overlap = 1
tail = [5, 22]
tail_raise = -6
walk = { cycle = 1.25, swing = 26, bob = 0.3 }
run = { cycle = 0.7, swing = 38, bob = 0.6, pitch = 3 }
idle = { length = 6.0, look = 10, breath = 0.2, wag = 4 }
attack = { length = 0.6, lunge = 5 }
eat = { length = 2.0, reach = 8, forward = 3 }

# Head pivot: the neck joint at the body's front, one below its top; the head cube
# spans y -5..-1, z -5..1 around it.
[[cubes]]
name = "snout"
bone = "head"
part = "snout"
from = [-3, -5, -12]
to = [3, -2.5, -5]

[[cubes]]
name = "brow_l"
bone = "head"
part = "head"
mirror = true
from = [-3.5, -1, -4]
to = [-1.5, 0, -2]

[[cubes]]
name = "nostrils"
bone = "head"
part = "snout"
from = [-1.5, -2.5, -12]
to = [1.5, -2, -10]

# Scutes down the back (body pivot: its centre, top at y 3) and the tail.
[[cubes]]
name = "scutes"
bone = "body"
part = "scutes"
from = [-3.5, 3, -9]
to = [3.5, 4, 10]

[[cubes]]
name = "tail_ridge"
bone = "tail"
part = "scutes"
from = [-1, 2.5, 0]
to = [1, 3.5, 19]

[palette]
fur = "#363a30"
fur_up = "#2c3027"
fur_down = "#d9d2b4"
legs = "#31352b"
head = "#363a30"
snout = "#33372d"
snout_down = "#d9d2b4"
tail = "#31352b"
tail_down = "#c9c2a4"
scutes = "#2a2f22"
eye = "#c8a030"
teeth = "#f1eedf"
nose = "#1d2018"

[[decals]]
cube = "brow_l"
face = "west"
x = 0
y = 0
colour = "eye"

[[decals]]
cube = "brow_r"
face = "east"
x = 1
y = 0
colour = "eye"

[[decals]]
cube = "snout"
face = "west"
x = 0
y = 1
w = 6
colour = "teeth"

[[decals]]
cube = "snout"
face = "east"
x = 1
y = 1
w = 6
colour = "teeth"

[[decals]]
cube = "nostrils"
face = "up"
x = 0
y = 0
w = 3
colour = "nose"
