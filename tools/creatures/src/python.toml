# DF PYTHON (wild): 200 kg, a big constrictor of the trees. Serpent; about 3.5 m
# here, the heaviest snake body in the set (a bit thicker than the anaconda's),
# Burmese colours: tan with big dark-brown blotches outlined in black and a dark
# arrowhead on the crown. Attack: bite (it constricts in life).
name = "python"
template = "serpent"
status = "draft"

decals = [
  { cube = "seg0", face = "up", x = 1, y = 1, w = 5, h = 3, colour = "outline" },
  { cube = "seg0", face = "up", x = 2, y = 2, w = 3, h = 1, colour = "blotch" },
  { cube = "seg0", face = "up", x = 0, y = 5, w = 3, h = 3, colour = "outline" },
  { cube = "seg0", face = "up", x = 1, y = 6, w = 1, h = 1, colour = "blotch" },
  { cube = "seg1", face = "up", x = 2, y = 0, w = 4, h = 3, colour = "outline" },
  { cube = "seg1", face = "up", x = 3, y = 1, w = 2, h = 1, colour = "blotch" },
  { cube = "seg1", face = "up", x = 0, y = 5, w = 4, h = 3, colour = "outline" },
  { cube = "seg1", face = "up", x = 1, y = 6, w = 2, h = 1, colour = "blotch" },
  { cube = "seg2", face = "up", x = 1, y = 1, w = 4, h = 3, colour = "outline" },
  { cube = "seg2", face = "up", x = 2, y = 2, w = 2, h = 1, colour = "blotch" },
  { cube = "seg2", face = "up", x = 0, y = 5, w = 3, h = 2, colour = "outline" },
  { cube = "seg3", face = "up", x = 1, y = 1, w = 3, h = 3, colour = "outline" },
  { cube = "seg3", face = "up", x = 2, y = 2, w = 1, h = 1, colour = "blotch" },
  { cube = "seg4", face = "up", x = 0, y = 2, w = 3, h = 2, colour = "outline" },
  { cube = "seg5", face = "up", x = 1, y = 3, w = 1, h = 2, colour = "outline" },
  { cube = "seg0", face = "west", x = 3, y = 0, w = 3, h = 2, colour = "outline" },
  { cube = "seg0", face = "east", x = 2, y = 0, w = 3, h = 2, colour = "outline" },
  { cube = "seg1", face = "west", x = 1, y = 1, w = 3, h = 2, colour = "outline" },
  { cube = "seg1", face = "east", x = 4, y = 1, w = 3, h = 2, colour = "outline" },
  { cube = "seg2", face = "west", x = 3, y = 0, w = 3, h = 2, colour = "outline" },
  { cube = "seg2", face = "east", x = 2, y = 0, w = 3, h = 2, colour = "outline" },
  # The crown arrowhead and eye stripes.
  { cube = "head", face = "up", x = 2, y = 1, w = 1, h = 1, colour = "blotch" },
  { cube = "head", face = "up", x = 1, y = 2, w = 3, h = 2, colour = "blotch" },
  { cube = "head", face = "up", x = 0, y = 4, w = 5, h = 2, colour = "blotch" },
  { cube = "head", face = "west", x = 0, y = 1, w = 6, h = 1, colour = "blotch" },
  { cube = "head", face = "east", x = 0, y = 1, w = 6, h = 1, colour = "blotch" },
  { cube = "head", face = "west", x = 1, y = 0, colour = "eye" },
  { cube = "head", face = "east", x = 4, y = 0, colour = "eye" },
]

[proportions]
segments = 6
seg = [7, 4.5, 8]
taper = 0.4
head = [5, 3, 6]
walk = { cycle = 2.4, amp = 16 }
run = { cycle = 1.3, amp = 22 }

# Head pivot: the neck, mid-height of seg0 (y = 2.25).
[[cubes]]
name = "snout"
bone = "head"
part = "head"
from = [-2, -2.25, -8]
to = [2, 0.25, -6]

[palette]
body = "#b39461"
body_up = "#bd9d68"
body_down = "#e3d6b0"
head = "#a98a58"
blotch = "#5a3d22"
outline = "#2b1d10"
eye = "#2b1d10"
