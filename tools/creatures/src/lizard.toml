# DF LIZARD (vermin, creature_reptiles): 0.2 kg, a generic small lizard. It has a
# giant, so the full quadruped rig at small size: a brown body low on splayed legs
# (negative leg_inset) with a darker back stripe, a pointed head, a long thin tail
# held low. Attack bite (the template's `attack`).
name = "lizard"
template = "quadruped"
status = "draft"

decals = [
  { cube = "head", face = "west", x = 0, y = 0, colour = "eye" },
  { cube = "head", face = "east", x = 1, y = 0, colour = "eye" },
]

[proportions]
body = [2, 1, 3.5]
leg = [0.5, 1]
leg_inset = -0.5
leg_ends = 0
head = [1.5, 1, 1.5]
head_up = 0
head_overlap = 0
tail = [0.5, 5]
tail_raise = -5
walk = { cycle = 0.32, swing = 35, bob = 0.05 }
run = { cycle = 0.2, swing = 50, bob = 0.12, pitch = 3 }
idle = { length = 3.5, look = 28, breath = 0.04, wag = 8 }
attack = { length = 0.3, lunge = 1 }
eat = { length = 1.0, reach = 15, forward = 0.5 }

# Head pivot: the neck joint; the head cube spans y 0..1, z -1.5..0 around it.
[[cubes]]
name = "snout"
bone = "head"
part = "head"
from = [-0.5, 0, -2.5]
to = [0.5, 0.75, -1.5]

# The back stripe (body pivot: its centre, top at y 0.5).
[[cubes]]
name = "stripe"
bone = "body"
part = "stripe"
from = [-0.5, 0.5, -1.75]
to = [0.5, 0.75, 1.75]

[palette]
fur = "#8a7a52"
fur_down = "#cfc49c"
legs = "#7e6e48"
head = "#8e7e56"
head_down = "#cfc49c"
tail = "#7e6e48"
stripe = "#5a4c30"
eye = "#141008"
