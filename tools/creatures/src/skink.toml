# DF SKINK (vermin, creature_reptiles): 0.5 kg, a relatively large smooth lizard.
# It has a giant, so the full quadruped rig at small size: a long glossy dark body
# with cream side stripes on short splayed legs (negative leg_inset), a thick tail
# (blue, as a five-lined skink's) held low. Attack bite (the template's `attack`).
name = "skink"
template = "quadruped"
status = "draft"

decals = [
  { cube = "head", face = "west", x = 0, y = 0, colour = "eye" },
  { cube = "head", face = "east", x = 1, y = 0, colour = "eye" },
  { cube = "body", face = "west", x = 0, y = 0, w = 5, colour = "stripe" },
  { cube = "body", face = "east", x = 0, y = 0, w = 5, colour = "stripe" },
  { cube = "head", face = "up", x = 0, y = 0, w = 1, h = 2, colour = "stripe" },
]

[proportions]
body = [2, 1, 4.5]
leg = [0.5, 1]
leg_inset = -0.5
leg_ends = 0.5
head = [1.5, 1, 1.5]
head_up = 0
head_overlap = 0
tail = [1, 5]
tail_raise = -5
walk = { cycle = 0.35, swing = 32, bob = 0.04 }
run = { cycle = 0.22, swing = 45, bob = 0.1, pitch = 2 }
idle = { length = 4.0, look = 25, breath = 0.04, wag = 8 }
attack = { length = 0.3, lunge = 1 }
eat = { length = 1.0, reach = 15, forward = 0.5 }

# Head pivot: the neck joint; the head cube spans y 0..1, z -1.5..0 around it.
[[cubes]]
name = "snout"
bone = "head"
part = "head"
from = [-0.5, 0, -2.25]
to = [0.5, 0.75, -1.5]

[palette]
fur = "#3a2e24"
fur_down = "#cfc6b0"
legs = "#3e3228"
head = "#3e3228"
tail = "#3a70c0"
tail_down = "#5a8ad0"
stripe = "#e8dcb4"
eye = "#0e0c0a"
