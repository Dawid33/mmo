# DF AYE-AYE (creature_tropical_new): 2.5 kg, a nocturnal tree-dwelling lemur that
# fishes grubs out of wood. Shaggy dark body, pale face, huge leathery ears, big
# amber eyes, a long bushy tail. The long middle finger is not modelled (too thin).
# Attacks bite (the template's `attack`); scratch optional, not made.
name = "aye-aye"
template = "quadruped"
status = "draft"

decals = [
  { cube = "head", face = "north", x = 0, y = 1, colour = "eye" },
  { cube = "head", face = "north", x = 2, y = 1, colour = "eye" },
  { cube = "snout", face = "north", x = 0, y = 0, colour = "nose" },
]

[proportions]
body = [4, 4, 7]
leg = [2, 3]
leg_ends = 0
head = [3, 3, 3]
head_up = 1
head_overlap = 1
tail = [3, 10]
tail_raise = 15
walk = { cycle = 0.5, swing = 30, bob = 0.2 }
run = { cycle = 0.3, swing = 48, bob = 0.6, pitch = 6 }
idle = { length = 4.0, look = 30, breath = 0.1, wag = 6 }
attack = { length = 0.45, lunge = 1.5 }
eat = { length = 1.2, reach = 40, forward = 1 }

# Head pivot: the neck joint; the head cube spans y -1..2, z -2..1 around it.
[[cubes]]
name = "snout"
bone = "head"
part = "head"
from = [-0.5, -1, -3]
to = [0.5, 0, -2]

[[cubes]]
name = "ear_l"
bone = "head"
part = "ears"
mirror = true
from = [-3, 1.5, -0.5]
to = [-1, 4.5, 0.5]

# Shaggy guard hair down the back (body pivot: its centre, top at y 2).
[[cubes]]
name = "mane"
bone = "body"
part = "shag"
from = [-1.5, 2, -2]
to = [1.5, 2.5, 3.5]

[palette]
fur = "#3d3833"
fur_down = "#5e564d"
legs = "#2b2724"
head = "#8a8073"
ears = "#25211e"
tail = "#2e2a26"
shag = "#4d4740"
eye = "#e0a030"
nose = "#d9b0a0"
