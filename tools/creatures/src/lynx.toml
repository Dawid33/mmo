# DF LYNX (creature_temperate_new): 20 kg, medium wild cat.
# Attacks bite (the template's `attack`) and scratch (optional, not made).
# Long legs, stub tail with a black tip, tufted ears, cheek ruff; faint spots.
name = "lynx"
template = "quadruped"
status = "draft"

[proportions]
body = [6, 6, 11]
leg = [2, 6]
leg_ends = 0
head = [5, 5, 4]
head_up = 2
tail = [2, 2]
tail_raise = 25
walk = { cycle = 0.8, swing = 28, bob = 0.25 }
run = { cycle = 0.42, swing = 50, bob = 0.8, pitch = 7 }
idle = { length = 4.0, look = 22, breath = 0.12, wag = 6 }
attack = { length = 0.55, lunge = 3.5 }
eat = { length = 1.5, reach = 45, forward = 2 }

# Head pivot: the neck joint; the head cube spans y -2..3, z -3..1 around it.
[[cubes]]
name = "snout"
bone = "head"
part = "snout"
from = [-1.5, -2, -4.5]
to = [1.5, 0, -3]

[[cubes]]
name = "ear_l"
bone = "head"
part = "ears"
mirror = true
from = [-2.5, 3, -0.5]
to = [-1, 4.5, 0.5]

[[cubes]]
name = "tuft_l"
bone = "head"
part = "tufts"
mirror = true
from = [-2, 4.5, -0.25]
to = [-1.5, 5.5, 0.25]

# The cheek ruff flares from the sides of the head.
[[cubes]]
name = "ruff_l"
bone = "head"
part = "ruff"
mirror = true
from = [-3, -2.5, -1.5]
to = [-2.5, 0.5, 0.5]

[palette]
fur = "#a8927a"
fur_up = "#9c8670"
fur_down = "#e8ddcd"
legs = "#ad9880"
head = "#a8927a"
snout = "#ece4d8"
ears = "#a8927a"
ears_south = "#3a3028"
tufts = "#1a1614"
ruff = "#c8b8a2"
tail = "#a8927a"
tip = "#1a1614"
spot = "#6e5c4a"
eye = "#b89a3a"
nose = "#a07068"

[[decals]]
cube = "tail"
face = "south"
x = 0
y = 0
w = 2
h = 2
colour = "tip"

