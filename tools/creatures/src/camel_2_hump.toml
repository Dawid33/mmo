# DF CAMEL_2_HUMP (creature_large_tropical): 500 kg, the Bactrian camel; mount and
# pack animal. Attack kick (the template's `attack` lunge); bite optional, not made.
# MOUNT: ridden. Shorter-legged and shaggier than the dromedary: two humps, a
# darker woolly coat with a mane under the neck, a neck bone carrying the head.
name = "two-humped camel"
template = "quadruped"
status = "draft"
extras = ["ridden"]

[proportions]
body = [11, 10, 20]
leg = [4, 13]
head = [4, 4, 8]
head_up = 1
neck = [4, 12, 40]
tail = [2, 7]
tail_raise = -65
walk = { cycle = 1.35, swing = 20, bob = 0.5 }
run = { cycle = 0.7, swing = 36, bob = 1.2, pitch = 4 }
idle = { length = 5.0, look = 18, breath = 0.25, wag = 6 }
attack = { length = 0.8, lunge = 4 }
eat = { length = 2.0, reach = 45, forward = 2 }

# Body pivot: the body's centre (top at y 5).
[[cubes]]
name = "hump_front"
bone = "body"
part = "hump"
from = [-3.5, 5, -7]
to = [3.5, 8, -1.5]

[[cubes]]
name = "hump_front_top"
bone = "body"
part = "hump"
from = [-2.5, 8, -6]
to = [2.5, 9.5, -2.5]

[[cubes]]
name = "hump_back"
bone = "body"
part = "hump"
from = [-3.5, 5, 2]
to = [3.5, 8, 7.5]

[[cubes]]
name = "hump_back_top"
bone = "body"
part = "hump"
from = [-2.5, 8, 3]
to = [2.5, 9.5, 6.5]

# Neck pivot: the body's front top; the woolly mane hangs under the neck's front
# half (the neck runs z -12..1 before its rest raise).
[[cubes]]
name = "mane"
bone = "neck"
part = "mane"
from = [-2.5, -4, -11]
to = [2.5, -1.5, -2]

# Head pivot: the end of the neck; the head cube spans y -1..3, z -7..1.
[[cubes]]
name = "muzzle"
bone = "head"
part = "muzzle"
from = [-1.5, -1, -8.5]
to = [1.5, 2, -7]

[[cubes]]
name = "ear_l"
bone = "head"
part = "ears"
mirror = true
from = [-2.5, 3, 0]
to = [-1.5, 4, 1]

[[cubes]]
name = "tuft"
bone = "tail"
part = "tuft"
from = [-1.5, -1.5, 6]
to = [1.5, 1.5, 8]

[palette]
fur = "#9a7448"
fur_up = "#a47e50"
fur_down = "#86643e"
legs = "#8e6a42"
head = "#9a7448"
neck = "#9a7448"
neck_down = "#6e5032"
mane = "#5e4428"
muzzle = "#8a6840"
hump = "#8e6a42"
hump_up = "#7e5c38"
ears = "#86643e"
tail = "#86643e"
tuft = "#4a3420"
eye = "#120e0b"
nostril = "#3a2a1c"

[[decals]]
cube = "head"
face = "west"
x = 2
y = 0
colour = "eye"

[[decals]]
cube = "head"
face = "east"
x = 5
y = 0
colour = "eye"

[[decals]]
cube = "muzzle"
face = "north"
x = 0
y = 0
colour = "nostril"

[[decals]]
cube = "muzzle"
face = "north"
x = 2
y = 0
colour = "nostril"
