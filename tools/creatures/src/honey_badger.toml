# DF HONEY BADGER (creature_tropical_new): 10 kg, fearless mustelid.
# Attacks bite (the template's `attack`) and scratch (optional, not made).
# CURIOUSBEAST_EATER: pick_up + carry. Low and broad, black below with the
# grey-white mantle from the crown down the back to the tail.
name = "honey badger"
template = "quadruped"
status = "draft"
extras = ["pick_up", "carry"]

[proportions]
body = [6, 5, 11]
leg = [2, 3]
leg_ends = 0
head = [4, 4, 3]
head_up = 0
tail = [2, 3]
tail_raise = 20
walk = { cycle = 0.6, swing = 30, bob = 0.2 }
run = { cycle = 0.36, swing = 48, bob = 0.6, pitch = 5 }
idle = { length = 4.0, look = 20, breath = 0.12, wag = 4 }
attack = { length = 0.45, lunge = 2.5 }
eat = { length = 1.4, reach = 30, forward = 1.5 }

# Head pivot: the neck joint; the head cube spans y -3..1, z -2..1 around it.

[[cubes]]
name = "snout"
bone = "head"
part = "snout"
from = [-1.5, -3, -4]
to = [1.5, -1, -2]

[[cubes]]
name = "ear_l"
bone = "head"
part = "ears"
mirror = true
from = [-2.5, 0, 0]
to = [-2, 1, 1]

[palette]
fur = "#1c1a18"
fur_up = "#cfcbc2"
legs = "#141210"
head = "#1c1a18"
head_up = "#cfcbc2"
snout = "#1c1a18"
ears = "#1c1a18"
tail = "#1c1a18"
tail_up = "#cfcbc2"
mantle = "#cfcbc2"
eye = "#3a3634"
nose = "#0a0908"

[[decals]]
cube = "body"
face = "west"
x = 0
y = 0
w = 11
h = 2
colour = "mantle"

[[decals]]
cube = "body"
face = "east"
x = 0
y = 0
w = 11
h = 2
colour = "mantle"

[[decals]]
