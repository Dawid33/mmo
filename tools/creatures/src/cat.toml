# DF CAT (creature_domestic): 5 kg, domestic pet and vermin hunter.
# Attacks bite (the template's `attack`) and scratch (optional, not made).
# An orange tabby: stripes are decals on the back and flanks.
name = "cat"
template = "quadruped"
status = "draft"

[proportions]
body = [4, 4, 8]
leg = [2, 4]
leg_ends = 0
head = [4, 4, 3]
head_up = 1
tail = [1, 8]
tail_raise = 55
walk = { cycle = 0.6, swing = 30, bob = 0.2 }
run = { cycle = 0.34, swing = 50, bob = 0.6, pitch = 7 }
idle = { length = 4.0, look = 22, breath = 0.1, wag = 14 }
attack = { length = 0.5, lunge = 2.5 }
eat = { length = 1.4, reach = 45, forward = 1.5 }

# Head pivot: the neck joint; the head cube spans y -2..2, z -2..1 around it.
[[cubes]]
name = "snout"
bone = "head"
part = "snout"
from = [-1, -2, -3]
to = [1, -0.5, -2]

[[cubes]]
name = "ear_l"
bone = "head"
part = "ears"
mirror = true
from = [-2, 2, -0.5]
to = [-1, 3.5, 0.5]

[palette]
fur = "#c9813f"
fur_down = "#ead2ad"
legs = "#c07a3b"
head = "#c9813f"
tail = "#c07a3b"
snout = "#ead2ad"
ears = "#a9652d"
eye = "#7fae2e"
nose = "#d98c8c"
stripe = "#8e5223"

[[decals]]
cube = "head"
face = "north"
x = 0
y = 1
colour = "eye"

[[decals]]
cube = "head"
face = "north"
x = 3
y = 1
colour = "eye"

[[decals]]
cube = "snout"
face = "north"
x = 0
y = 0
w = 2
colour = "nose"

# Tabby stripes across the back (up face: 4 wide, 8 long, row 0 at the front)
# and down the flanks (8 wide, 4 tall).
[[decals]]
cube = "body"
face = "up"
x = 0
y = 2
w = 4
colour = "stripe"

[[decals]]
cube = "body"
face = "up"
x = 0
y = 5
w = 4
colour = "stripe"

[[decals]]
cube = "body"
face = "west"
x = 2
y = 0
h = 2
colour = "stripe"

[[decals]]
cube = "body"
face = "west"
x = 5
y = 0
h = 2
colour = "stripe"

[[decals]]
cube = "body"
face = "east"
x = 2
y = 0
h = 2
colour = "stripe"

[[decals]]
cube = "body"
face = "east"
x = 5
y = 0
h = 2
colour = "stripe"

[[decals]]
cube = "head"
face = "up"
x = 1
y = 1
w = 2
colour = "stripe"
