# DF OLM_GIANT (underground): 200 kg, a giant pale cave salamander that hunts near
# underground water. Long eel-like body on small splayed legs, a flat head with
# red feathery gills, near-blind eyes under the skin, a paddle tail with a fin.
# Attack bite (the template's `attack`). LARGE_PREDATOR: alert + roar (a gape);
# AMPHIBIOUS: swim + swim_idle; MOUNT_EXOTIC: ridden.
name = "giant olm"
template = "quadruped"
status = "draft"
extras = ["alert", "roar", "swim", "swim_idle", "ridden"]

[proportions]
body = [8, 6, 22]
leg = [2, 3]
leg_inset = -1
leg_ends = 3
head = [7, 4, 6]
head_up = -2
head_overlap = 1
tail = [4, 16]
tail_raise = -4
walk = { cycle = 0.9, swing = 30, bob = 0.2 }
run = { cycle = 0.55, swing = 42, bob = 0.4, pitch = 2 }
idle = { length = 5.0, look = 12, breath = 0.2, wag = 8 }
attack = { length = 0.55, lunge = 4 }
eat = { length = 1.8, reach = 12, forward = 2 }

# Head pivot: the neck joint at the body's front, one below its top; the head cube
# spans y -5..-1, z -5..1 around it.
[[cubes]]
name = "snout"
bone = "head"
part = "head"
from = [-2.5, -5, -9]
to = [2.5, -2, -5]

# Three red gill plumes each side behind the head.
[[cubes]]
name = "gill_a_l"
bone = "head"
part = "gills"
mirror = true
from = [-6, -2, -1]
to = [-3.5, -1, 0]

[[cubes]]
name = "gill_b_l"
bone = "head"
part = "gills"
mirror = true
from = [-6.5, -3.5, -0.5]
to = [-3.5, -2.5, 0.5]

[[cubes]]
name = "gill_c_l"
bone = "head"
part = "gills"
mirror = true
from = [-6, -5, 0]
to = [-3.5, -4, 1]

# A soft fin along the tail (tail pivot: its root; the tail spans y -2..2).
[[cubes]]
name = "tail_fin"
bone = "tail"
part = "fin"
from = [-0.5, -3.5, 3]
to = [0.5, 3.5, 15]

[palette]
fur = "#ecc9bd"
fur_up = "#e4bcae"
fur_down = "#f4dcd2"
legs = "#e8c2b5"
head = "#ecc9bd"
tail = "#e8c2b5"
gills = "#d9505e"
fin = "#f0d4ca"
eye = "#2a2222"
mouth = "#b98a80"

[[decals]]
cube = "head"
face = "west"
x = 1
y = 1
colour = "eye"

[[decals]]
cube = "head"
face = "east"
x = 4
y = 1
colour = "eye"

[[decals]]
cube = "snout"
face = "north"
x = 1
y = 2
w = 3
colour = "mouth"
