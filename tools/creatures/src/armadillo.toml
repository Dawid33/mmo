# DF ARMADILLO (creature_large_tropical): 7.5 kg, a small armoured mammal.
# A banded domed shell (the body cube plus a shell over it, bands as decals), a
# narrow pointed head with upright ears, a plated tapering tail held low.
# Attacks bite (the template's `attack`) and scratch (optional, not made).
name = "armadillo"
template = "quadruped"
status = "draft"

[proportions]
body = [5, 4, 9]
leg = [2, 3]
leg_ends = 1
head = [3, 3, 3]
head_up = -1
head_overlap = 0
tail = [2, 6]
tail_raise = -8
walk = { cycle = 0.55, swing = 28, bob = 0.15 }
run = { cycle = 0.32, swing = 42, bob = 0.4, pitch = 4 }
idle = { length = 4.0, look = 18, breath = 0.08, wag = 4 }
attack = { length = 0.45, lunge = 1.5 }
eat = { length = 1.2, reach = 40, forward = 1 }

# Body pivot: its centre (y 5); the body spans y -2..2, z -4.5..4.5.
[[cubes]]
name = "shell"
bone = "body"
part = "shell"
from = [-3, -1, -5]
to = [3, 3, 5]

# Head pivot: the neck joint; the head cube spans y -3..0, z -3..0 around it.
[[cubes]]
name = "snout"
bone = "head"
part = "snout"
from = [-1, -3, -5]
to = [1, -1.5, -3]

[[cubes]]
name = "ear_l"
bone = "head"
part = "ears"
mirror = true
from = [-1.5, 0, -1]
to = [-0.5, 1.5, 0]

[palette]
fur = "#b8a48c"
legs = "#8a7864"
head = "#b4a084"
snout = "#b4a084"
ears = "#a08a70"
tail = "#a89276"
shell = "#a8957c"
shell_up = "#b5a289"
band = "#7e6d58"
eye = "#18120e"
nose = "#3a2e26"

[[decals]]
cube = "head"
face = "west"
x = 1
y = 1
colour = "eye"

[[decals]]
cube = "head"
face = "east"
x = 1
y = 1
colour = "eye"

[[decals]]
cube = "snout"
face = "north"
x = 0
y = 0
colour = "nose"

# Bands across the shell (top 6 wide × 10 long, row 0 at the front; flanks 10 × 4).
[[decals]]
cube = "shell"
face = "up"
x = 0
y = 3
w = 6
colour = "band"

[[decals]]
cube = "shell"
face = "up"
x = 0
y = 5
w = 6
colour = "band"

[[decals]]
cube = "shell"
