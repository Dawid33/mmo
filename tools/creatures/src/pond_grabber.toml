# DF POND_GRABBER (underground, cave water): 30 kg, "a small creature that lives
# in watery ditches deep underground. It has a sharp beak and four tentacles
# with claws at the end." Arthropod, picked by hand like the octopus: four legs
# are the tentacles, splayed wide, each with a hooked claw cube at its tip; the
# head carries the hooked beak, the raised abdomen is the bulbous body. No eyes
# in the body plan (EXTRAVISION). LARGE_PREDATOR: alert, roar; AQUATIC on a
# non-fish: swim, swim_idle (the walk slowed). Attack bite (the beak; the
# template's lunge); stab optional, not made.
name = "pond grabber"
template = "arthropod"
status = "draft"
extras = ["alert", "roar", "swim", "swim_idle"]

decals = [
  # Mottled, slimy back (abdomen 8 wide × 8 long, row 0 at the front).
  { cube = "abdomen", face = "up", x = 1, y = 1, w = 2, h = 2, colour = "mottle" },
  { cube = "abdomen", face = "up", x = 5, y = 3, w = 2, h = 1, colour = "mottle" },
  { cube = "abdomen", face = "up", x = 2, y = 5, w = 1, h = 2, colour = "mottle" },
  { cube = "abdomen", face = "up", x = 5, y = 6, w = 2, h = 1, colour = "mottle" },
  { cube = "abdomen", face = "west", x = 2, y = 2, w = 2, h = 1, colour = "mottle" },
  { cube = "abdomen", face = "east", x = 4, y = 3, w = 2, h = 1, colour = "mottle" },
  # Sucker dots under the tentacles' tops.
  { cube = "head", face = "north", x = 1, y = 0, w = 3, h = 1, colour = "mottle" },
]

[proportions]
body = [6, 4, 6]
head = [5, 4, 4]
abdomen = [8, 7, 8]
abdomen_raise = 20
legs = 4
leg = [1.5, 8, 2]
splay = 50
walk = { cycle = 0.8, swing = 22, lift = 16 }
run = { cycle = 0.45, swing = 26, lift = 20 }

# Head pivot: the thorax front at mid-height (y = 4); the head spans y -2..2, z -4..0.
[[cubes]]
name = "beak"
bone = "head"
part = "beak"
from = [-1.5, -2, -6]
to = [1.5, 1, -4]

[[cubes]]
name = "beak_tip"
bone = "head"
part = "beak"
from = [-1, -2, -7]
to = [1, -0.5, -6]

# Leg pivots: the thorax side at y = 3; a tentacle reaches 8 out (x = -8) and its
# tip stands on the ground (y = -3). A hooked claw at each tip.
[[cubes]]
name = "claw_l1"
bone = "leg_l1"
part = "claws"
mirror = true
from = [-9.5, -3, -2]
to = [-6.5, -1, 1.5]

[[cubes]]
name = "claw_l2"
bone = "leg_l2"
part = "claws"
mirror = true
from = [-9.5, -3, -2]
to = [-6.5, -1, 1.5]

[palette]
body = "#4e5a48"
body_up = "#56644e"
head = "#4a5644"
abdomen = "#52604a"
abdomen_up = "#5c6a52"
abdomen_down = "#8a947a"
legs = "#56624c"
legs_down = "#a8b090"
beak = "#1e1c18"
claws = "#d8d0b0"
mottle = "#36402e"
