# DF MONITOR_LIZARD (creature_tropical_new): 25 kg, big clever lizard.
# Attack bite (the template's `attack`). Low and long: legs splayed past the
# body (negative leg_inset), a long head on a long neck (neck cube on the head
# bone), a very long tail; dark brown with yellow spots.
name = "monitor lizard"
template = "quadruped"
status = "draft"

[proportions]
body = [6, 4, 15]
leg = [2, 4]
leg_inset = -1.5
leg_ends = 1
head = [4, 3, 5]
head_up = 0
head_overlap = -1
tail = [3, 20]
tail_raise = -5
walk = { cycle = 0.85, swing = 28, bob = 0.15 }
run = { cycle = 0.48, swing = 42, bob = 0.3, pitch = 2 }
idle = { length = 5.0, look = 26, breath = 0.12, wag = 6 }
attack = { length = 0.55, lunge = 3 }
eat = { length = 1.6, reach = 25, forward = 1.5 }

# Head pivot: the neck joint; the head cube spans y -2..1, z -6..-1 around it,
# the neck fills the gap back to the body.

[[cubes]]
name = "neck"
bone = "head"
part = "head"
from = [-1.5, -2.5, -2]
to = [1.5, 0.5, 1]

[[cubes]]
name = "snout"
bone = "head"
part = "head"
from = [-1, -2, -8]
to = [1, 0, -6]

[palette]
fur = "#4a4232"
fur_down = "#8a7e5a"
legs = "#433b2c"
head = "#504836"
tail = "#4a4232"
spot = "#c9b45a"
band = "#c9b45a"
eye = "#c08a30"

[[decals]]
cube = "head"
face = "west"
x = 1
y = 0
w = 1
h = 1
colour = "eye"

