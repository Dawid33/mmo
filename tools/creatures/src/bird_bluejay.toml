# DF BIRD_BLUEJAY (wild): 0.1 kg, "a small blue-crested bird" of temperate woodland:
# blue crest, back, wings and tail, white face and underside, a black necklace, black
# and white bars on the wings and tail. Vermin in DF, but it has a giant, so it uses
# the full bird rig, small. FLIER; no brood. Attack: peck (the template's `attack`);
# scratch optional.
name = "blue jay"
template = "bird"
status = "draft"

[proportions]
body = [3, 3, 4]
leg = [1, 1]
foot = [2, 0.5, 1.5]
head = [2, 2, 2]
neck = 1
head_back = 1
beak = [1, 0.5, 1]
tail = [2, 0.5, 4]
tail_raise = 10
wing = [5, 2]
walk = { cycle = 0.35, swing = 30 }
run = { cycle = 0.22 }
fly = { cycle = 0.2, flap = 45 }

# Head pivot: the neck; a 2×2×2 head spans y 1..3, z -1..1 above it.
[[cubes]]
name = "crest"
bone = "head"
part = "crest"
from = [-0.5, 3, -0.5]
to = [0.5, 4, 1.5]

[palette]
body = "#4a7cc4"
body_down = "#e8ecef"
body_north = "#e8ecef"
head = "#4a7cc4"
head_north = "#eef0f2"
crest = "#5a8ad2"
wings = "#3a6cb8"
tail = "#3a6cb8"
legs = "#2a2a30"
beak = "#1c1c20"
eye = "#101012"
necklace = "#141418"
bar = "#f2f2f2"
face = "#eef0f2"

# The head's side faces are 2×2 (row 0 at the top); the front is on
# the left of west and the right of east. Body `up`: row 0 is the front.

[[decals]]
cube = "head"
face = "west"
x = 0
y = 0
colour = "eye"

[[decals]]
cube = "head"
face = "east"
x = 1
y = 0
colour = "eye"

[[decals]]
cube = "head"
face = "west"
x = 0
y = 1
colour = "face"
w = 2

[[decals]]
cube = "head"
face = "east"
x = 0
y = 1
colour = "face"
w = 2

[[decals]]
cube = "body"
face = "north"
x = 0
y = 0
w = 3
colour = "necklace"

[[decals]]
cube = "tail"
face = "up"
x = 0
y = 3
w = 2
colour = "bar"

[[decals]]
cube = "wing_l"
face = "down"
x = 1
y = 0
colour = "bar"

[[decals]]
cube = "wing_r"
face = "down"
x = 3
y = 0
colour = "bar"
