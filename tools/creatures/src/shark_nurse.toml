# DF SHARK_NURSE (wild, large ocean): 150 kg, a sluggish brown bottom-dweller:
# a broad low body, a blunt head with barbels, two dorsals set far back and a
# long low tail lobe. Slow swim.
# Built like the other sharks: the fish template plus a swept two-cube
# dorsal, an upper tail lobe, gill slits and a white lower flank (decals).
# Attacks bite (the template's `attack`) and slap (optional, not made).
name = "nurse shark"
template = "fish"
status = "draft"

[proportions]
body = [8, 6, 16]
head = [7, 5, 5]
tail = [3, 3, 5]
fin = [1, 5, 2]
pectoral = [2, 4]
dorsal = [1, 0, 0]
swim = { cycle = 1.4, amp = 10 }

# Body pivot: its centre; the body spans y -3..3, z -8..8. The dorsal is a three-step swept triangle.
[[cubes]]
name = "dorsal"
bone = "body"
part = "fins"
from = [-0.5, 3, 2]
to = [0.5, 5, 5]

[[cubes]]
name = "dorsal_mid"
bone = "body"
part = "fins"
from = [-0.5, 5, 3]
to = [0.5, 6, 5.5]

[[cubes]]
name = "dorsal_tip"
bone = "body"
part = "fins"
from = [-0.5, 6, 4]
to = [0.5, 7, 6]

# Tail fin pivot: the stalk's end; the fin spans y -2.5..2.5, z 0..2. The upper lobe is a two-step sweep up and back.
[[cubes]]
name = "lobe_up"
bone = "tail_fin"
part = "fins"
from = [-0.5, 0, 0.5]
to = [0.5, 3.5, 3.5]

[[cubes]]
name = "lobe_tip"
bone = "tail_fin"
part = "fins"
from = [-0.5, 3.5, 3]
to = [0.5, 4.5, 6.5]

# Tail pivot: the body's back at mid-height; the stalk spans y -1.5..1.5, z 0..5.
[[cubes]]
name = "dorsal_2"
bone = "tail"
part = "fins"
from = [-0.5, 1.5, 0.5]
to = [0.5, 3.5, 3]

# Head pivot: the body's front at mid-height; the head spans y -2.5..2.5, z -5..0.
[[cubes]]
name = "barbels"
bone = "head"
part = "barbel"
from = [-1.5, -2, -6]
to = [1.5, -1, -5]

[palette]
body = "#8c6c47"
body_up = "#73583a"
body_down = "#c4a682"
head = "#8c6c47"
head_up = "#73583a"
head_down = "#c4a682"
fins = "#7a5e3e"
barbel = "#5a4630"
eye = "#0b0c0d"
gill = "#2e3336"
mouth = "#2a1c1c"
teeth = "#f4f1ea"

[[decals]]
cube = "body"
face = "west"
x = 1
y = 1
w = 1
h = 2
colour = "gill"

[[decals]]
cube = "body"
face = "east"
x = 14
y = 1
w = 1
h = 2
colour = "gill"

[[decals]]
cube = "body"
face = "west"
x = 3
y = 1
w = 1
h = 2
colour = "gill"

[[decals]]
cube = "body"
face = "east"
x = 12
y = 1
w = 1
h = 2
colour = "gill"

[[decals]]
cube = "head"
face = "west"
x = 1
y = 1
colour = "eye"

[[decals]]
cube = "head"
face = "east"
x = 3
y = 1
colour = "eye"
