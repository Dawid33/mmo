# DF FISH_GLASSEYE (vermin, coral reefs): 0.2 kg, "a small, nocturnal, marine fish".
# Vermin form: `move` + `death` only (vermin have no attack clip). A deep red body, spiny dorsal, and the big glassy eyes it is named
# for (a silver ring around a black pupil).
name = "glasseye"
template = "vermin"
status = "draft"

decals = [
  { cube = "head", face = "west", x = 0, y = 0, colour = "eye" },
  { cube = "head", face = "east", x = 1, y = 0, colour = "eye" },
]

[proportions]
body = [1.5, 2.5, 3.5]
head = [1.5, 2.25, 1.5]
legs = 0
move = "swim"
cycle = 0.6

# Body pivot: its centre; the body spans y -1.25..1.25, z -1.75..1.75.
# The tail bone sits at the body's rear; the head's pivot is the body's front
# (the head spans y -1.25..1, z -1.5..0).
[[bones]]
name = "tail"
parent = "body"
pivot = [0, 0, 1.75]

[[cubes]]
name = "tail_fin"
bone = "tail"
part = "fins"
from = [-0.25, -1, 0]
to = [0.25, 1, 1.25]

[[cubes]]
name = "dorsal"
bone = "body"
part = "fins"
from = [-0.25, 1.25, -1.5]
to = [0.25, 2.25, 1]

[[cubes]]
name = "fin_l"
bone = "body"
part = "fins"
from = [-1.5, -1, -1.5]
to = [-0.75, -0.75, -0.5]
mirror = true

[palette]
eye = "#0e0e10"
body = "#c4302a"
body_down = "#e0605a"
head = "#bc2c26"
fins = "#a82822"
ring = "#d8dde0"

# The tail fin wags harder than the body's swim yaw.
[clips.move]
merge = true
mode = "loop"
length = 0.6
keys = [
  { bone = "tail", channel = "rotation", time = 0, value = [0, 0, 0] },
  { bone = "tail", channel = "rotation", time = 0.15, value = [0, 25, 0] },
  { bone = "tail", channel = "rotation", time = 0.3, value = [0, 0, 0] },
  { bone = "tail", channel = "rotation", time = 0.45, value = [0, -25, 0] },
  { bone = "tail", channel = "rotation", time = 0.6, value = [0, 0, 0] },
]
