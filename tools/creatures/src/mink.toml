# DF MINK (creature_temperate_new): 1 kg, small semi-aquatic weasel.
# Attacks bite (the template's `attack`) and scratch (optional, not made).
# (Semi-aquatic in the description only, no AMPHIBIOUS flag: no swim clips.)
# Long, low, glossy dark brown with a white chin, a bushy tail.
name = "mink"
template = "quadruped"
status = "draft"

[proportions]
body = [3, 3, 8]
leg = [1, 2]
leg_ends = 0
head = [3, 3, 2]
head_up = 0
tail = [2, 4]
tail_raise = 5
walk = { cycle = 0.5, swing = 32, bob = 0.15 }
run = { cycle = 0.3, swing = 48, bob = 0.4, pitch = 6 }
idle = { length = 3.5, look = 26, breath = 0.08, wag = 6 }
attack = { length = 0.4, lunge = 2 }
eat = { length = 1.2, reach = 40, forward = 1 }

# Head pivot: the neck joint; the head cube spans y -2..1, z -1..1 around it.

[[cubes]]
name = "snout"
bone = "head"
part = "snout"
from = [-1, -2, -2]
to = [1, -0.5, -1]

[[cubes]]
name = "ear_l"
bone = "head"
part = "ears"
mirror = true
from = [-1.5, 1, 0]
to = [-1, 1.5, 0.5]

[palette]
fur = "#3a2418"
fur_up = "#331f14"
legs = "#2a1a10"
head = "#3a2418"
snout = "#3a2418"
ears = "#2a1a10"
tail = "#2a1a10"
chin = "#ece4d8"
eye = "#0a0706"

[[decals]]
cube = "head"
face = "north"
x = 0
y = 1
w = 1
h = 1
colour = "eye"

[[decals]]
cube = "head"
face = "north"
x = 2
y = 1
w = 1
h = 1
colour = "eye"

[[decals]]
cube = "snout"
face = "down"
x = 0
y = 0
w = 2
h = 1
colour = "chin"
