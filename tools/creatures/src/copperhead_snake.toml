# DF COPPERHEAD_SNAKE (wild): 0.5 kg, a small pit viper of woods and swamps.
# Serpent; a little over 1 m here (the adder is 1 m), copper-tan with chestnut
# hourglass crossbands (wide on the flanks, narrow over the spine) and a plain
# copper head. Attack: bite.
name = "copperhead snake"
template = "serpent"
status = "draft"

decals = [
  # Hourglass bands: a thin bar over the spine...
  { cube = "seg0", face = "up", x = 0, y = 1, w = 3, h = 1, colour = "band" },
  { cube = "seg1", face = "up", x = 0, y = 1, w = 3, h = 1, colour = "band" },
  { cube = "seg2", face = "up", x = 0, y = 1, w = 3, h = 1, colour = "band" },
  { cube = "seg3", face = "up", x = 0, y = 1, w = 2, h = 1, colour = "band" },
  { cube = "seg4", face = "up", x = 0, y = 1, w = 2, h = 1, colour = "band" },
  # ...widening down the flanks.
  { cube = "seg0", face = "west", x = 0, y = 0, w = 3, h = 2, colour = "band" },
  { cube = "seg0", face = "east", x = 1, y = 0, w = 3, h = 2, colour = "band" },
  { cube = "seg1", face = "west", x = 0, y = 0, w = 3, h = 2, colour = "band" },
  { cube = "seg1", face = "east", x = 1, y = 0, w = 3, h = 2, colour = "band" },
  { cube = "seg2", face = "west", x = 0, y = 0, w = 3, h = 2, colour = "band" },
  { cube = "seg2", face = "east", x = 1, y = 0, w = 3, h = 2, colour = "band" },
  { cube = "seg3", face = "west", x = 0, y = 0, w = 2, h = 2, colour = "band" },
  { cube = "seg3", face = "east", x = 2, y = 0, w = 2, h = 2, colour = "band" },
  { cube = "head", face = "west", x = 1, y = 0, colour = "eye" },
  { cube = "head", face = "east", x = 2, y = 0, colour = "eye" },
]

[proportions]
segments = 5
seg = [3, 2, 4]
taper = 0.45
head = [3.5, 2, 3]
walk = { cycle = 1.3, amp = 22 }
run = { cycle = 0.7, amp = 28 }

# Head pivot: the neck, mid-height of seg0 (y = 1).
[[cubes]]
name = "snout"
bone = "head"
part = "head"
from = [-1, -1, -4]
to = [1, 0.5, -3]

[palette]
body = "#c98a5a"
body_up = "#d29463"
body_down = "#e3c4a0"
head = "#c27a42"
band = "#7a3e1f"
eye = "#2a1a10"
