# DF DWARF (civ): 60 kg, "short, sturdy, fond of drink and industry". The biped
# pilot. Fortress UI decision: dwarves are 2 levels tall, so 28 units (1.75 m)
# with the helmet — under 32. Attacks punch (the template's `attack`), kick,
# scratch, bite, spit (optional, not made). The worker set comes with the biped.
name = "dwarf"
template = "biped"
status = "draft"

# The template defaults are the dwarf: legs 4×9, torso 10×10×6, arms 3×10, head 8×8×7.

# Head pivot: the neck, at the torso top; the head spans y 0..8, z -3.5..3.5.
[[cubes]]
name = "beard"
bone = "head"
part = "beard"
from = [-3.5, -4, -4.5]
to = [3.5, 3, -3.5]

[[cubes]]
name = "nose"
bone = "head"
part = "nose"
from = [-1, 3, -5]
to = [1, 5, -3.5]

[[cubes]]
name = "helmet"
bone = "head"
part = "helmet"
from = [-4.5, 6, -4]
to = [4.5, 9, 4]

# Torso pivot: the hips.
[[cubes]]
name = "belt"
bone = "torso"
part = "belt"
from = [-5.5, 0, -3.5]
to = [5.5, 1.5, 3.5]

[palette]
skin = "#d9a27c"
head = "#d9a27c"
hands = "#d9a27c"
nose = "#c98d6a"
torso = "#5f7a3c"
arms = "#5f7a3c"
legs = "#5d4936"
feet = "#3a281b"
beard = "#9a4a22"
helmet = "#8d939b"
helmet_up = "#a6acb3"
belt = "#3a281b"
buckle = "#d8b23a"
eye = "#1a120c"

# The head's front face is 8×8 (row 0 at the top): the helmet covers rows 0-1,
# the nose rows 3-4, the beard from row 4 down.
[[decals]]
cube = "head"
face = "north"
x = 1
y = 3
w = 2
colour = "eye"

[[decals]]
cube = "head"
face = "north"
x = 5
y = 3
w = 2
colour = "eye"

[[decals]]
cube = "belt"
face = "north"
x = 4
y = 0
w = 3
h = 2
colour = "buckle"
