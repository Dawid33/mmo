# DF MINOTAUR (semi-megabeast): 220 kg, "a giant humanoid monster with the head of a
# bull". Biped, 40 units: a bull's head (muzzle, wide horns, ears) on a heavy
# furred man's body, a hide loincloth. LARGE_PREDATOR: alert + roar. Attack punch
# (the template's `attack`); gore, kick, scratch, bite, spit optional (not made).
name = "minotaur"
template = "biped"
status = "draft"
extras = ["alert", "roar"]

[proportions]
leg = [6, 14]
foot = 2
leg_inset = 1
body = [15, 14, 8]
arm = [5, 16]
hand = 4
head = [9, 9, 9]
walk = { cycle = 1.1, swing = 25, bob = 0.6 }
run = { cycle = 0.7, swing = 42, bob = 1.4 }

# Head pivot: the neck; the head spans y 0..9, z -4.5..4.5.
[[cubes]]
name = "muzzle"
bone = "head"
part = "muzzle"
from = [-3.5, 0, -8]
to = [3.5, 5, -4.5]

[[cubes]]
name = "horn_l"
bone = "head"
part = "horn"
mirror = true
from = [-9, 7, -2]
to = [-4.5, 9, 0]

[[cubes]]
name = "horn_tip_l"
bone = "head"
part = "horn"
mirror = true
from = [-10, 9, -3]
to = [-8, 13, -1]

[[cubes]]
name = "ear_l"
bone = "head"
part = "head"
mirror = true
from = [-7, 5, 0]
to = [-4.5, 6.5, 2]

[[cubes]]
name = "hump"
bone = "torso"
part = "torso"
from = [-6, 11, -1]
to = [6, 16, 4.5]

[[cubes]]
name = "loincloth"
bone = "torso"
part = "hide"
from = [-8, -4, -4.5]
to = [8, 2, 4.5]

[palette]
head = "#4e3324"
head_up = "#5e3f2c"
muzzle = "#6e4a36"
torso = "#7a5238"
torso_up = "#8a6046"
hands = "#7a5238"
arms = "#7a5238"
legs = "#4e3324"
feet = "#2a1c14"
hide = "#3a2c22"
horn = "#e0d6bc"
eye = "#b8261c"
nostril = "#1a100a"
ring = "#c9a640"

# The head's front face is 9×9 (row 0 at the top); the muzzle's 7×5.
[[decals]]
cube = "head"
face = "north"
x = 1
y = 2
w = 2
colour = "eye"

[[decals]]
cube = "head"
face = "north"
x = 6
y = 2
w = 2
colour = "eye"

[[decals]]
cube = "muzzle"
face = "north"
x = 1
y = 1
w = 2
colour = "nostril"

[[decals]]
cube = "muzzle"
face = "north"
x = 4
y = 1
w = 2
colour = "nostril"

[[decals]]
cube = "muzzle"
face = "north"
x = 2
y = 3
w = 3
colour = "ring"
