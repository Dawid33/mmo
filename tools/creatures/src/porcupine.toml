# DF PORCUPINE (creature_temperate_new): 9 kg, quilled rodent.
# Attack bite (the template's `attack`); scratch optional, not made.
# A dark round body under a big shell of pale-tipped quills (a cube over the
# back and one over the short tail), small blunt head.
name = "porcupine"
template = "quadruped"
status = "draft"

[proportions]
body = [6, 5, 9]
leg = [2, 2]
leg_ends = 0
head = [4, 4, 3]
head_up = 0
tail = [3, 3]
tail_raise = -10
walk = { cycle = 0.75, swing = 26, bob = 0.15 }
run = { cycle = 0.45, swing = 38, bob = 0.4, pitch = 4 }
idle = { length = 4.5, look = 16, breath = 0.12, wag = 4 }
attack = { length = 0.5, lunge = 2 }
eat = { length = 1.6, reach = 35, forward = 1.5 }

# Head pivot: the neck joint; the head cube spans y -3..1, z -2..1 around it.
[[cubes]]
name = "snout"
bone = "head"
part = "snout"
from = [-1, -3, -3.5]
to = [1, -1, -2]

# Body pivot: its centre (top at y 2.5). The quill coat.
[[cubes]]
name = "quills"
bone = "body"
part = "quills"
from = [-4, -0.5, -2.5]
to = [4, 4.5, 5.5]

[[cubes]]
name = "tail_quills"
bone = "tail"
part = "quills"
from = [-2, -0.5, 0]
to = [2, 2.5, 3.5]

[palette]
fur = "#3a2e24"
fur_down = "#2c231b"
legs = "#2a211a"
head = "#3a2e24"
snout = "#2a211a"
tail = "#3a2e24"
quills = "#6e6050"
quills_up = "#b4a68a"
tip = "#e6dcc4"
eye = "#0a0807"

[[decals]]
cube = "quills"
face = "west"
x = 1
y = 0
w = 7
colour = "tip"

[[decals]]
cube = "quills"
face = "east"
x = 1
y = 0
w = 7
colour = "tip"

[[decals]]
cube = "head"
face = "north"
x = 0
y = 0
colour = "eye"

[[decals]]
cube = "head"
face = "north"
x = 3
y = 0
colour = "eye"
