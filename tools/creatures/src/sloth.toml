# DF SLOTH (creature_tropical_new): 6 kg, slow tree-dwelling mammal.
# Attack bite (the template's `attack`); scratch optional, not made. Shaggy grey-
# brown on long limbs with hooked claws on the front feet (cubes on the front leg
# bones), a round cream face with the dark eye streaks; very slow gaits. Hanging
# from branches is not modelled (no climbing in the sim).
name = "sloth"
template = "quadruped"
status = "draft"

[proportions]
body = [6, 5, 8]
leg = [2, 4]
leg_inset = -1
leg_ends = 0
head = [4, 4, 3]
head_up = 1
tail = [2, 1]
tail_raise = -30
walk = { cycle = 2.2, swing = 22, bob = 0.15 }
run = { cycle = 1.4, swing = 30, bob = 0.3, pitch = 2 }
idle = { length = 7.0, look = 14, breath = 0.1, wag = 2 }
attack = { length = 1.0, lunge = 1.5 }
eat = { length = 2.6, reach = 35, forward = 1.5 }

# Head pivot: the neck joint; the head cube spans y -2..2, z -2..1 around it.
[[cubes]]
name = "snout"
bone = "head"
part = "face"
from = [-1, -2, -3]
to = [1, -0.5, -2]

# Leg pivots: the hip (the leg cube hangs y -4..1); a claw hooks forward at the foot.
[[cubes]]
name = "claw_fl"
bone = "leg_fl"
part = "claws"
from = [-1, -4, -2]
to = [1, -3.5, -1]

[[cubes]]
name = "claw_fr"
bone = "leg_fr"
part = "claws"
from = [-1, -4, -2]
to = [1, -3.5, -1]

[palette]
fur = "#8a7a62"
fur_up = "#7e6e56"
fur_down = "#9a8a70"
legs = "#7a6a52"
head = "#d8ccb0"
face = "#d8ccb0"
tail = "#7a6a52"
claws = "#3a3026"
streak = "#3a2e22"
eye = "#0a0807"
nose = "#2a221a"

# The dark streaks through the eyes (face 4 × 4, the snout over the bottom row).
[[decals]]
cube = "head"
face = "north"
x = 0
y = 1
w = 2
colour = "streak"

[[decals]]
cube = "head"
face = "north"
x = 2
y = 1
w = 2
colour = "streak"

[[decals]]
cube = "head"
face = "north"
x = 1
y = 1
colour = "eye"

[[decals]]
cube = "head"
face = "north"
x = 2
y = 1
colour = "eye"

[[decals]]
cube = "snout"
face = "north"
x = 0
y = 0
w = 2
colour = "nose"
