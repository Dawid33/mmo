# DF FOX (creature_temperate): 6 kg, red fox.
# Attacks bite (the template's `attack`) and scratch (optional, not made).
# Pointed muzzle, black legs, bushy white-tipped tail.
name = "fox"
template = "quadruped"
status = "draft"

[proportions]
body = [4, 4, 8]
leg = [2, 4]
leg_ends = 0
head = [4, 4, 3]
head_up = 1
tail = [3, 7]
tail_raise = 10
walk = { cycle = 0.6, swing = 30, bob = 0.2 }
run = { cycle = 0.35, swing = 52, bob = 0.7, pitch = 7 }
idle = { length = 4.0, look = 24, breath = 0.1, wag = 10 }
attack = { length = 0.5, lunge = 2.5 }
eat = { length = 1.4, reach = 45, forward = 1.5 }

# Head pivot: the neck joint; the head cube spans y -2..2, z -2..1 around it.
[[cubes]]
name = "snout"
bone = "head"
part = "snout"
from = [-1, -2, -5]
to = [1, -0.5, -2]

[[cubes]]
name = "ear_l"
bone = "head"
part = "ears"
mirror = true
from = [-2, 2, -0.5]
to = [-0.5, 4, 0.5]

# The tail runs z -1..6 from its root; the white tip continues it.
[[cubes]]
name = "tail_tip"
bone = "tail"
part = "tail_tip"
from = [-1.5, -1.5, 6]
to = [1.5, 1.5, 8]

[palette]
fur = "#c8622a"
fur_up = "#bd5a25"
fur_down = "#efe6d8"
legs = "#2a1e18"
head = "#c8622a"
snout = "#efe6d8"
snout_up = "#c8622a"
ears = "#2a1e18"
tail = "#c8622a"
tail_tip = "#f2ede4"
eye = "#d0a030"
nose = "#1a1210"

[[decals]]
cube = "head"
face = "north"
x = 0
y = 1
colour = "eye"

[[decals]]
cube = "head"
face = "north"
x = 3
y = 1
colour = "eye"

[[decals]]
cube = "snout"
face = "north"
x = 0
y = 0
w = 2
colour = "nose"
