# DF CAVE_DRAGON (underground): 15000 kg, a gigantic dragon gone feral in the deep
# chasms: wings fallen limp at its sides, a face full of very long teeth, big eyes.
# White scales, green eyes (raws). Quadruped with a neck; its 2WINGS hang limp
# per the description, so they are flat cubes along the flanks (no fly set: no
# FLIER flag, it does not fly). Attack bite (the template's `attack`); claw
# optional, not made. LARGE_PREDATOR: alert + roar. No breath weapon.
name = "cave dragon"
template = "quadruped"
status = "draft"
extras = ["alert", "roar"]

[proportions]
body = [24, 18, 46]
leg = [7, 14]
leg_inset = -1
leg_ends = 3
head = [12, 9, 12]
head_up = 0
head_overlap = 2
neck = [10, 16, 38]
tail = [8, 40]
tail_raise = -12
walk = { cycle = 1.9, swing = 20, bob = 0.8 }
run = { cycle = 1.05, swing = 32, bob = 1.6, pitch = 3 }
idle = { length = 7.0, look = 16, breath = 0.5, wag = 3 }
attack = { length = 0.9, lunge = 6 }
eat = { length = 2.4, reach = 12, forward = 2 }

# Head pivot: the neck's end; the head cube spans y -4.5..4.5, z -11..1 around it.
[[cubes]]
name = "snout"
bone = "head"
part = "snout"
from = [-4, -4, -20]
to = [4, 1, -10]

[[cubes]]
name = "jaw"
bone = "head"
part = "jaw"
from = [-3.5, -6, -17]
to = [3.5, -4, -4]

# Very long eye teeth hanging past the lower jaw.
[[cubes]]
name = "fang_l"
bone = "head"
part = "teeth"
mirror = true
from = [-3.5, -9, -18]
to = [-2.5, -4, -17]

[[cubes]]
name = "tooth_l"
bone = "head"
part = "teeth"
mirror = true
from = [-3.6, -7, -13]
to = [-2.6, -4, -12]

[[cubes]]
name = "brow_l"
bone = "head"
part = "head"
mirror = true
from = [-6, 2, -8]
to = [-3, 5, -3]

# Limp wings: a bony arm along the top of each flank and the membrane sagging
# down the side (body pivot: its centre; the flank at x ±12, top at y 9).
[[cubes]]
name = "wingarm_l"
bone = "body"
part = "wingbone"
mirror = true
from = [-14, 6, -16]
to = [-11, 9, 14]

[[cubes]]
name = "wing_l"
bone = "body"
part = "wings"
mirror = true
from = [-13, -8, -14]
to = [-12, 6, 12]

# Ragged spines down the back.
[[cubes]]
name = "spines"
bone = "body"
part = "spines"
from = [-1.5, 9, -20]
to = [1.5, 12, 20]

[[cubes]]
name = "tail_spines"
bone = "tail"
part = "spines"
from = [-1, 4, 0]
to = [1, 6, 34]

[palette]
fur = "#d9d6cc"
fur_up = "#c9c6bb"
fur_down = "#ebe8df"
legs = "#cdcabf"
neck = "#d9d6cc"
neck_down = "#ebe8df"
head = "#d9d6cc"
snout = "#cfccc1"
jaw = "#e3e0d6"
teeth = "#f6efd8"
tail = "#cdcabf"
tail_down = "#e3e0d6"
wingbone = "#b9b5aa"
wings = "#8e877c"
spines = "#a7a397"
eye = "#7fc25a"
pupil = "#141410"

# Big eyes on the brow sides (5 long × 3 tall; front on the left of west).
[[decals]]
cube = "brow_l"
face = "west"
x = 0
y = 0
w = 3
h = 2
colour = "eye"

[[decals]]
cube = "brow_l"
face = "west"
x = 1
y = 1
colour = "pupil"

[[decals]]
cube = "brow_r"
face = "east"
x = 2
y = 0
w = 3
h = 2
colour = "eye"

[[decals]]
cube = "brow_r"
face = "east"
x = 3
y = 1
colour = "pupil"

# Asleep the long neck lies forward and low with the head level on it, instead of
# the template's nose-down droop (the head anim undoes the neck's net rotation).
[clips.sleep]
merge = true
keys = [
  { bone = "neck", channel = "rotation", time = 0.0, value = [-50, 0, 0] },
  { bone = "neck", channel = "rotation", time = 6.0, value = [-50, 0, 0] },
  { bone = "head", channel = "rotation", time = 0.0, value = [46, 0, 0] },
  { bone = "head", channel = "rotation", time = 3.0, value = [49, 0, 0] },
  { bone = "head", channel = "rotation", time = 6.0, value = [46, 0, 0] },
]
