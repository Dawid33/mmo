# DF BIRD_TURKEY (domestic): 5 kg, a big ground fowl that lays eggs (nest boxes: the
# brood clip). Not a FLIER in the raws, but turkeys flap up onto roosts, so like the
# chicken it keeps the fly set. Attack: peck (the template's `attack`). The display
# fan is the tail cube held high; the snood and wattle are cubes on the head.
name = "turkey"
template = "bird"
status = "draft"

[proportions]
body = [7, 7, 9]
leg = [1, 5]
foot = [3, 1, 3]
head = [3, 3, 3]
neck = 3
head_back = 2
beak = [1, 1, 1]
tail = [9, 1, 7]
tail_raise = 70
wing = [8, 5]
brood = true
walk = { cycle = 0.8, swing = 26 }
run = { cycle = 0.45 }

# Head pivot: the neck, at the body's top front.
[[cubes]]
name = "snood"
bone = "head"
part = "wattle"
from = [-0.5, 2.5, -2.75]
to = [0.5, 5.5, -2.25]

[[cubes]]
name = "wattle"
bone = "head"
part = "wattle"
from = [-0.5, 1.5, -1.75]
to = [0.5, 4, -0.75]

[[cubes]]
name = "beard"
bone = "body"
part = "beard"
from = [-0.5, -1, -4.75]
to = [0.5, 2, -4.5]

[palette]
body = "#4b3a2b"
body_down = "#3a2c21"
body_north = "#5a4734"
head = "#b9c8d8"
wings = "#6b5640"
tail = "#5c4632"
tail_south = "#7a5f42"
legs = "#c4887a"
beak = "#d8c9a6"
wattle = "#c4302b"
beard = "#1e1814"
eye = "#121010"

[[decals]]
cube = "head"
face = "west"
x = 0
y = 1
colour = "eye"

[[decals]]
cube = "head"
face = "east"
x = 2
y = 1
colour = "eye"
