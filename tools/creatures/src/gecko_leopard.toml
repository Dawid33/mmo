# DF GECKO_LEOPARD (vermin, creature_desert_new): 0.05 kg, a tiny brightly coloured
# desert gecko. It has a giant, so the full quadruped rig at small size: a yellow,
# black-spotted body low on splayed legs (negative leg_inset), a broad head, a fat
# banded tail held low. Attack bite (the template's `attack`).
name = "leopard gecko"
template = "quadruped"
status = "draft"

decals = [
  { cube = "head", face = "west", x = 0, y = 0, colour = "eye" },
  { cube = "head", face = "east", x = 1, y = 0, colour = "eye" },
  { cube = "body", face = "up", x = 0, y = 0, colour = "spot" },
  { cube = "body", face = "up", x = 1, y = 2, colour = "spot" },
  { cube = "head", face = "up", x = 1, y = 1, colour = "spot" },
  { cube = "tail", face = "up", x = 0, y = 1, w = 2, colour = "band" },
  { cube = "tail", face = "west", x = 1, y = 0, h = 2, colour = "band" },
  { cube = "tail", face = "east", x = 1, y = 0, h = 2, colour = "band" },
]

[proportions]
body = [2, 1, 3]
leg = [0.5, 1]
leg_inset = -0.5
leg_ends = 0
head = [2, 1, 1.5]
head_up = 0
head_overlap = 0
tail = [1.5, 3]
tail_raise = -5
walk = { cycle = 0.4, swing = 32, bob = 0.05 }
run = { cycle = 0.24, swing = 45, bob = 0.12, pitch = 2 }
idle = { length = 4.0, look = 25, breath = 0.04, wag = 10 }
attack = { length = 0.3, lunge = 0.8 }
eat = { length = 1.0, reach = 15, forward = 0.4 }

# Head pivot: the neck joint; the head cube spans y 0..1, z -1.5..0 around it.
[[cubes]]
name = "snout"
bone = "head"
part = "head"
from = [-0.75, 0, -2]
to = [0.75, 0.75, -1.5]

[palette]
fur = "#e8c050"
fur_down = "#f2e8d0"
legs = "#e0b848"
head = "#e8c050"
head_down = "#f2e8d0"
tail = "#e4bc58"
spot = "#2a2018"
band = "#f4eee0"
eye = "#1a1610"
