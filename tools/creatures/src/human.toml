# DF HUMAN (civ): 70 kg, "prone to great ambition". Biped, a head taller than the
# dwarf: 31 units (under the 32-unit two-level limit). Attacks punch (the template's
# `attack`), kick, scratch, bite, spit (optional, not made). Worker set from the biped.
name = "human"
template = "biped"
status = "draft"

[proportions]
leg = [4, 12]
body = [10, 11, 6]
arm = [3, 12]
head = [7, 8, 7]

# Head pivot: the neck, at the torso top; the head spans y 0..8, z -3.5..3.5.
[[cubes]]
name = "hair"
bone = "head"
part = "hair"
from = [-4, 6, -4]
to = [4, 9, 4]

[[cubes]]
name = "hair_back"
bone = "head"
part = "hair"
from = [-4, 2, 2.5]
to = [4, 6, 4]

[[cubes]]
name = "nose"
bone = "head"
part = "head"
from = [-0.5, 3, -4.5]
to = [0.5, 5, -3.5]

# Torso pivot: the hips.
[[cubes]]
name = "belt"
bone = "torso"
part = "belt"
from = [-5.5, 0, -3.5]
to = [5.5, 1.5, 3.5]

[palette]
head = "#e2b28e"
hands = "#e2b28e"
torso = "#3f5f8f"
torso_up = "#4c6d9c"
arms = "#3f5f8f"
legs = "#6b5a44"
feet = "#3a2a1c"
hair = "#5a3a1e"
belt = "#3a2a1c"
buckle = "#c9a640"
eye = "#1c1410"
mouth = "#9a5a48"

# The head's front face is 7×8 (row 0 at the top).
[[decals]]
cube = "head"
face = "north"
x = 1
y = 3
w = 2
colour = "eye"

[[decals]]
cube = "head"
face = "north"
x = 4
y = 3
w = 2
colour = "eye"

[[decals]]
cube = "head"
face = "north"
x = 2
y = 6
w = 3
colour = "mouth"

[[decals]]
cube = "belt"
face = "north"
x = 4
y = 0
w = 3
h = 2
colour = "buckle"
