# DF MACAQUE_RHESUS (wild, temperate grassland): 5 kg, a medium monkey that
# roams in large groups and begs or steals in towns. Quadruped template with a
# medium tail carried low: grey-brown fur, a bare pink face with a short muzzle,
# small ears. Attacks bite (the template's `attack`) and scratch (optional,
# not made). CURIOUSBEAST_ITEM / _EATER: pick_up + carry.
name = "rhesus macaque"
template = "quadruped"
status = "draft"
extras = ["pick_up", "carry"]

[proportions]
body = [4, 4, 9]
leg = [2, 5]
head = [4, 4, 3]
head_up = 2
tail = [1, 7]
tail_raise = 15
walk = { cycle = 0.6, swing = 32, bob = 0.25 }
run = { cycle = 0.36, swing = 50, bob = 0.6, pitch = 7 }
idle = { length = 4.0, look = 28, breath = 0.1, wag = 8 }
attack = { length = 0.5, lunge = 2 }
eat = { length = 1.4, reach = 40, forward = 1.5 }

# Head pivot: the neck joint; the head cube spans y -1..3, z -2..1 around it.
[[cubes]]
name = "muzzle"
bone = "head"
part = "face"
from = [-1, -1, -2.5]
to = [1, 0.5, -2]

[[cubes]]
name = "ear_l"
bone = "head"
part = "face"
mirror = true
from = [-2.5, 1, -1]
to = [-2, 2, 0]

[palette]
fur = "#7a6a52"
fur_up = "#8a6c48"
fur_down = "#a89a80"
legs = "#6e604c"
head = "#7a6a52"
tail = "#6e604c"
face = "#d8a090"
eye = "#2a1a10"
nose = "#a86a60"

# The head's front face is 4×4 (row 0 at the top): a pink face, eyes on row 1.
[[decals]]
cube = "head"
face = "north"
x = 0
y = 1
w = 4
h = 3
colour = "face"

[[decals]]
cube = "head"
face = "north"
x = 0
y = 1
colour = "eye"

[[decals]]
cube = "head"
face = "north"
x = 3
y = 1
colour = "eye"

[[decals]]
cube = "muzzle"
face = "north"
x = 0
y = 1
w = 2
colour = "nose"
