# DF OCELOT (creature_tropical_new): 12 kg, small spotted jungle cat.
# Attacks bite (the template's `attack`) and scratch (optional, not made).
# Tawny with dark spots (decals), white belly, a long ringless tail with a dark tip.
name = "ocelot"
template = "quadruped"
status = "draft"

[proportions]
body = [5, 5, 11]
leg = [2, 4]
leg_ends = 0
head = [4, 4, 3]
head_up = 1
tail = [2, 9]
tail_raise = -10
walk = { cycle = 0.7, swing = 30, bob = 0.2 }
run = { cycle = 0.38, swing = 52, bob = 0.6, pitch = 7 }
idle = { length = 4.0, look = 22, breath = 0.1, wag = 10 }
attack = { length = 0.5, lunge = 3 }
eat = { length = 1.4, reach = 45, forward = 1.5 }

# Head pivot: the neck joint; the head cube spans y -2..2, z -2..1 around it.
[[cubes]]
name = "snout"
bone = "head"
part = "snout"
from = [-1, -2, -3]
to = [1, -0.5, -2]

[[cubes]]
name = "ear_l"
bone = "head"
part = "ears"
mirror = true
from = [-2, 2, -0.5]
to = [-1, 3.5, 0.5]

# The tail cube runs z -1..8 from its root; the dark tip continues it.
[[cubes]]
name = "tail_tip"
bone = "tail"
part = "tail_tip"
from = [-1, -1, 8]
to = [1, 1, 9.5]

[palette]
fur = "#c9a067"
fur_down = "#efe4d0"
legs = "#c29a63"
head = "#c9a067"
snout = "#efe4d0"
ears = "#3a2c22"
tail = "#c29a63"
tail_tip = "#2a1f18"
spot = "#2e2219"
eye = "#7a8a3a"
nose = "#b07a6a"

[[decals]]
cube = "head"
face = "north"
x = 0
y = 1
colour = "eye"

[[decals]]
cube = "head"
face = "north"
x = 3
y = 1
colour = "eye"

[[decals]]
cube = "snout"
face = "north"
x = 0
y = 0
w = 2
colour = "nose"

