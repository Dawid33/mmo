# DF LION (creature_large_tropical): 190 kg, maned big cat, large predator.
# Attacks bite (the template's `attack`) and scratch (optional, not made).
# LARGE_PREDATOR: alert + roar; MOUNT_EXOTIC: ridden. A male: the mane is a
# cube around the head's back and a chest ruff on the body; tufted tail.
name = "lion"
template = "quadruped"
status = "draft"
extras = ["alert", "roar", "ridden"]

[proportions]
body = [8, 8, 19]
leg = [4, 7]
head = [6, 6, 5]
head_up = 2
tail = [2, 14]
tail_raise = -25
walk = { cycle = 1.05, swing = 25, bob = 0.4 }
run = { cycle = 0.52, swing = 48, bob = 1.2, pitch = 6 }
idle = { length = 5.0, look = 18, breath = 0.22, wag = 6 }
attack = { length = 0.7, lunge = 5 }
eat = { length = 1.8, reach = 45, forward = 3 }

# Head pivot: the neck joint; the head cube spans y -3..3, z -4..1 around it.
[[cubes]]
name = "snout"
bone = "head"
part = "snout"
from = [-2, -3, -6.5]
to = [2, 0, -4]

[[cubes]]
name = "mane"
bone = "head"
part = "mane"
from = [-5, -5, -2]
to = [5, 5.5, 3]

[[cubes]]
name = "ear_l"
bone = "head"
part = "ears"
mirror = true
from = [-3, 3, -2]
to = [-1.5, 4.5, -1]

# Body pivot: the body's centre (8 wide, 8 tall, 19 long). The chest ruff hangs
# under the neck.
[[cubes]]
name = "ruff"
bone = "body"
part = "mane"
from = [-3.5, -6, -10]
to = [3.5, 3, -7]

# The tail cube runs z -1..13 from its root; the tuft ends it.
[[cubes]]
name = "tuft"
bone = "tail"
part = "tuft"
from = [-1.5, -1.5, 13]
to = [1.5, 1.5, 16]

[palette]
fur = "#c79a5a"
fur_up = "#bd9052"
fur_down = "#e6d2ae"
legs = "#c49656"
head = "#c99c5c"
snout = "#e9dcc2"
mane = "#6e4626"
mane_up = "#7a5030"
ears = "#8a6440"
tail = "#c49656"
tuft = "#3a2618"
eye = "#9a7a2a"
nose = "#6a3e34"

[[decals]]
cube = "head"
face = "north"
x = 1
y = 1
colour = "eye"

[[decals]]
cube = "head"
face = "north"
x = 4
y = 1
colour = "eye"

[[decals]]
cube = "snout"
face = "north"
x = 1
y = 0
w = 2
colour = "nose"
