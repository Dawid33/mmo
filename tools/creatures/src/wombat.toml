# DF WOMBAT (creature_temperate_new): 25 kg, stocky burrowing marsupial.
# Attack bite (the template's `attack`); scratch optional, not made. A barrel
# body on very short legs, a broad blunt head with the wide bare nose pad, small
# rounded ears, no visible tail (template tail off).
name = "wombat"
template = "quadruped"
status = "draft"

[proportions]
body = [9, 7, 13]
leg = [3, 2]
leg_ends = 0
head = [6, 5, 4]
head_up = -1
tail = [1, 0]
tail_raise = -30
walk = { cycle = 0.75, swing = 28, bob = 0.25 }
run = { cycle = 0.45, swing = 42, bob = 0.6, pitch = 4 }
idle = { length = 4.5, look = 16, breath = 0.18, wag = 0 }
attack = { length = 0.55, lunge = 2.5 }
eat = { length = 1.6, reach = 30, forward = 1.5 }

# Head pivot: the neck joint; the head cube spans y -5..0, z -3..1 around it.
[[cubes]]
name = "nose"
bone = "head"
part = "nose"
from = [-2, -4.5, -5]
to = [2, -1.5, -3]

[[cubes]]
name = "ear_l"
bone = "head"
part = "ears"
mirror = true
from = [-3, 0, -0.5]
to = [-1.5, 1.5, 0.5]

[palette]
fur = "#7a6a58"
fur_up = "#6e5e4e"
fur_down = "#8a7a66"
legs = "#5e5042"
head = "#7a6a58"
nose = "#3a3230"
ears = "#6e5e4e"
tail = "#7a6a58"
eye = "#0a0807"
nostril = "#1a1615"

[[decals]]
cube = "head"
face = "north"
x = 1
y = 1
colour = "eye"

[[decals]]
cube = "head"
face = "north"
x = 4
y = 1
colour = "eye"

[[decals]]
cube = "nose"
face = "north"
x = 1
y = 1
colour = "nostril"

[[decals]]
cube = "nose"
face = "north"
x = 2
y = 1
colour = "nostril"
