# DF RUTHERER (underground): 3000 kg, "a huge monster with an enormous tail, covered
# with thick fur. They run on four legs"; grey-blue fur, green eyes (raws). A heavy
# shaggy body, a blunt head with small ears, and an enormous fur-covered club of a
# tail nearly as long as the body, carried low. Attack kick (the hind-leg kick, as
# the horse's); bite optional, not made. MOUNT_EXOTIC: ridden.
name = "rutherer"
template = "quadruped"
status = "draft"
extras = ["ridden"]

[proportions]
body = [20, 17, 36]
leg = [6, 12]
leg_ends = 2
head = [12, 10, 10]
head_up = 1
head_overlap = 2
tail = [12, 38]
tail_raise = -8
walk = { cycle = 1.7, swing = 20, bob = 0.8 }
run = { cycle = 0.9, swing = 34, bob = 1.8, pitch = 3 }
idle = { length = 6.0, look = 14, breath = 0.5, wag = 4 }
eat = { length = 2.2, reach = 40, forward = 3 }

# Head pivot: the neck joint; the head cube spans y -8..2, z -8..2 around it.
[[cubes]]
name = "muzzle"
bone = "head"
part = "muzzle"
from = [-4, -8, -11]
to = [4, -3, -8]

[[cubes]]
name = "ear_l"
bone = "head"
part = "ears"
mirror = true
from = [-6.5, 1, -2]
to = [-4, 4, 0]

# Thick fur: a shaggy hump over the shoulders and fringes hanging along the flanks
# (body pivot: its centre; body x ±10, y -8.5..8.5, z -18..18).
[[cubes]]
name = "hump"
bone = "body"
part = "shag"
from = [-9, 8.5, -16]
to = [9, 11.5, 2]

[[cubes]]
name = "fringe_l"
bone = "body"
part = "shag"
mirror = true
from = [-11, -11, -14]
to = [-9, -4, 14]

# The enormous tail: a fat furry club at its end (tail pivot: its root; the tail
# spans y -6..6, z -1..37).
[[cubes]]
name = "tail_club"
bone = "tail"
part = "shag"
from = [-8, -8, 18]
to = [8, 8, 38]

[palette]
fur = "#6f7a88"
fur_up = "#606b79"
fur_down = "#8a94a0"
legs = "#5a6370"
head = "#6f7a88"
muzzle = "#58616d"
ears = "#5a6370"
tail = "#6a7584"
shag = "#7e8a99"
shag_up = "#6f7a88"
eye = "#5ab04a"
nose = "#22262c"

[[decals]]
cube = "head"
face = "north"
x = 2
y = 3
w = 2
colour = "eye"

[[decals]]
cube = "head"
face = "north"
x = 8
y = 3
w = 2
colour = "eye"

[[decals]]
cube = "muzzle"
face = "north"
x = 2
y = 0
w = 4
colour = "nose"

# The kick: weight onto the forehand (nose down, rump up), hind legs cocked and
# lashed out backwards.
[clips.attack]
mode = "once"
length = 0.8
keys = [
  { bone = "body", channel = "rotation", time = 0.0, value = [0, 0, 0] },
  { bone = "body", channel = "rotation", time = 0.25, value = [-8, 0, 0] },
  { bone = "body", channel = "rotation", time = 0.5, value = [-8, 0, 0] },
  { bone = "body", channel = "rotation", time = 0.8, value = [0, 0, 0] },
  { bone = "body", channel = "position", time = 0.0, value = [0, 0, 0] },
  { bone = "body", channel = "position", time = 0.25, value = [0, 1, 0] },
  { bone = "body", channel = "position", time = 0.5, value = [0, 1, 0] },
  { bone = "body", channel = "position", time = 0.8, value = [0, 0, 0] },
  { bone = "leg_bl", channel = "rotation", time = 0.0, value = [0, 0, 0] },
  { bone = "leg_bl", channel = "rotation", time = 0.2, value = [25, 0, 0] },
  { bone = "leg_bl", channel = "rotation", time = 0.38, value = [-70, 0, 0] },
  { bone = "leg_bl", channel = "rotation", time = 0.8, value = [0, 0, 0] },
  { bone = "leg_br", channel = "rotation", time = 0.0, value = [0, 0, 0] },
  { bone = "leg_br", channel = "rotation", time = 0.2, value = [25, 0, 0] },
  { bone = "leg_br", channel = "rotation", time = 0.38, value = [-70, 0, 0] },
  { bone = "leg_br", channel = "rotation", time = 0.8, value = [0, 0, 0] },
  { bone = "leg_fl", channel = "rotation", time = 0.0, value = [0, 0, 0] },
  { bone = "leg_fl", channel = "rotation", time = 0.3, value = [-6, 0, 0] },
  { bone = "leg_fl", channel = "rotation", time = 0.8, value = [0, 0, 0] },
  { bone = "leg_fr", channel = "rotation", time = 0.0, value = [0, 0, 0] },
  { bone = "leg_fr", channel = "rotation", time = 0.3, value = [-6, 0, 0] },
  { bone = "leg_fr", channel = "rotation", time = 0.8, value = [0, 0, 0] },
  { bone = "head", channel = "rotation", time = 0.0, value = [0, 0, 0] },
  { bone = "head", channel = "rotation", time = 0.3, value = [-12, 0, 0] },
  { bone = "head", channel = "rotation", time = 0.8, value = [0, 0, 0] },
  { bone = "tail", channel = "rotation", time = 0.0, value = [0, 0, 0] },
  { bone = "tail", channel = "rotation", time = 0.38, value = [-35, 0, 0] },
  { bone = "tail", channel = "rotation", time = 0.8, value = [0, 0, 0] },
]

