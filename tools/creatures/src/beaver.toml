# DF BEAVER (creature_riverlakepool_new): 20 kg, the dam-building river rodent.
# Stocky brown body, blunt head with orange incisors, small ears, a flat scaly paddle
# tail (a wide flat cube on the tail bone; the template's tail is length 0).
# Attacks bite (the template's `attack`); scratch optional, not made.
name = "beaver"
template = "quadruped"
status = "draft"

decals = [
  { cube = "head", face = "west", x = 1, y = 1, colour = "eye" },
  { cube = "head", face = "east", x = 2, y = 1, colour = "eye" },
  { cube = "snout", face = "north", x = 1, y = 0, colour = "nose" },
  { cube = "snout", face = "north", x = 1, y = 1, colour = "teeth" },
]

[proportions]
body = [7, 6, 12]
leg = [2, 3]
leg_ends = 1
head = [5, 4, 4]
head_up = 0
head_overlap = 1
tail = [1, 0]
tail_raise = -5
walk = { cycle = 0.7, swing = 26, bob = 0.25 }
run = { cycle = 0.42, swing = 40, bob = 0.6, pitch = 5 }
idle = { length = 4.5, look = 18, breath = 0.12, wag = 3 }
attack = { length = 0.5, lunge = 2 }
eat = { length = 1.4, reach = 35, forward = 1.5 }

# Head pivot: the neck joint; the head cube spans y -3..1, z -3..1 around it.
[[cubes]]
name = "snout"
bone = "head"
part = "snout"
from = [-1.5, -3, -4.5]
to = [1.5, -1, -3]

[[cubes]]
name = "ear_l"
bone = "head"
part = "ears"
mirror = true
from = [-2.5, 1, -0.5]
to = [-1.5, 2, 0.5]

# The paddle (tail pivot: the rump's top edge, one below the body top).
[[cubes]]
name = "paddle"
bone = "tail"
part = "paddle"
from = [-2.5, -2, -0.5]
to = [2.5, -1, 7]

[palette]
fur = "#6e4a2c"
fur_up = "#634226"
fur_down = "#8a6644"
legs = "#4f3520"
head = "#6e4a2c"
snout = "#5e3f26"
ears = "#4f3520"
tail = "#3c3431"
paddle = "#3c3431"
paddle_up = "#463d39"
eye = "#120c08"
nose = "#1e1612"
teeth = "#d98a2b"
