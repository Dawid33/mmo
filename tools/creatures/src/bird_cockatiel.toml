# DF BIRD_COCKATIEL (wild): 90 g, "a tiny crested parrot": grey body, yellow face and
# tall swept-back crest, orange cheek patch, white wing patch, long grey tail hanging
# parrot-fashion, grey hooked bill. Vermin in DF, but it has a giant, so it uses the
# full bird rig, small. FLIER; no brood. Attack: bite (the template's peck).
name = "cockatiel"
template = "bird"
status = "draft"

[proportions]
body = [3, 3, 4]
leg = [1, 1]
foot = [2, 0.5, 1.5]
head = [2, 2, 2]
neck = 1
head_back = 1
beak = [1, 1, 0.5]
tail = [2, 0.5, 5]
tail_raise = -25
wing = [5, 2]
walk = { cycle = 0.35, swing = 30 }
run = { cycle = 0.22 }
fly = { cycle = 0.2, flap = 45 }

# Head pivot: the neck; a 2×2×2 head spans y 1..3, z -1..1 above it.
[[cubes]]
name = "crest"
bone = "head"
part = "crest"
from = [-0.5, 3, -0.5]
to = [0.5, 4.5, 0.5]

[[cubes]]
name = "crest_tip"
bone = "head"
part = "crest"
from = [-0.5, 4, 0.5]
to = [0.5, 5, 1.5]

[palette]
body = "#8e9094"
body_down = "#9ea0a4"
head = "#e8d870"
crest = "#e2cf5a"
wings = "#7e8084"
tail = "#6e7074"
legs = "#9a8a88"
beak = "#8a8a8c"
cheek = "#e8782a"
patch = "#f0f0ee"
eye = "#141414"

# The head's side faces are 2×2 (row 0 at the top); the front is on
# the left of west and the right of east. Body `up`: row 0 is the front.

[[decals]]
cube = "head"
face = "west"
x = 0
y = 0
colour = "eye"

[[decals]]
cube = "head"
face = "east"
x = 1
y = 0
colour = "eye"

[[decals]]
cube = "head"
face = "west"
x = 0
y = 1
colour = "cheek"

[[decals]]
cube = "head"
face = "east"
x = 1
y = 1
colour = "cheek"

[[decals]]
cube = "wing_l"
face = "down"
x = 3
y = 0
w = 2
colour = "patch"

[[decals]]
cube = "wing_r"
face = "down"
x = 0
y = 0
w = 2
colour = "patch"
