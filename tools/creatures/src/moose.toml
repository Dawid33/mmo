# DF MOOSE (creature_large_temperate): 500 kg, the largest deer.
# Attack hgore (the template's `attack` lunge, antlers first); kick and bite
# optional, not made. MOUNT_EXOTIC: ridden. A bull: broad palmate antlers, long
# drooping muzzle, a bell under the throat, a shoulder hump; very long legs.
name = "moose"
template = "quadruped"
status = "draft"
extras = ["ridden"]

[proportions]
body = [11, 12, 24]
leg = [3, 15]
head = [5, 6, 9]
head_up = 5
tail = [2, 2]
tail_raise = -30
walk = { cycle = 1.3, swing = 22, bob = 0.5 }
run = { cycle = 0.7, swing = 40, bob = 1.4, pitch = 4 }
idle = { length = 5.0, look = 16, breath = 0.25, wag = 4 }
attack = { length = 0.85, lunge = 5 }
eat = { length = 2.2, reach = 60, forward = 4 }

# Body pivot: the body's centre (top at y 6). The hump over the shoulders.

[[cubes]]
name = "hump"
bone = "body"
part = "fur"
from = [-4.5, 6, -11]
to = [4.5, 8, -3]

# Head pivot: the neck joint at the body's front top; the head cube spans
# y 0..6, z -8..1 around it.

[[cubes]]
name = "neck"
bone = "head"
part = "neck"
from = [-3, -4, -4]
to = [3, 4, 1]

[[cubes]]
name = "muzzle"
bone = "head"
part = "muzzle"
from = [-3, -1, -11]
to = [3, 4, -8]

[[cubes]]
name = "bell"
bone = "head"
part = "bell"
from = [-1, -4, -6]
to = [1, 0, -4]

[[cubes]]
name = "ear_l"
bone = "head"
part = "ears"
mirror = true
from = [-5, 5, -0.5]
to = [-2.5, 6, 0.5]

[[cubes]]
name = "antler_l"
bone = "head"
part = "antlers"
mirror = true
from = [-4, 6, -1]
to = [-2.5, 8, 1]

[[cubes]]
name = "palm_l"
bone = "head"
part = "antlers"
mirror = true
from = [-11, 7.5, -2.5]
to = [-4, 9, 2.5]

[[cubes]]
name = "prong_l"
bone = "head"
part = "antlers"
mirror = true
from = [-11, 9, -2.5]
to = [-9.5, 11, 2.5]

[palette]
fur = "#3e2c20"
fur_up = "#463226"
fur_down = "#2e2018"
legs = "#8a7a66"
head = "#4a3628"
neck = "#3a2a1e"
muzzle = "#4e3a2c"
bell = "#2e2018"
ears = "#4a3628"
antlers = "#c9b892"
antlers_up = "#d6c7a2"
tail = "#3e2c20"
eye = "#0e0b09"
nostril = "#16100c"

[[decals]]
cube = "head"
face = "west"
x = 2
y = 1
w = 1
h = 1
colour = "eye"

[[decals]]
cube = "head"
face = "east"
x = 6
y = 1
w = 1
h = 1
colour = "eye"

[[decals]]
cube = "muzzle"
face = "north"
x = 1
y = 1
w = 1
h = 1
colour = "nostril"

[[decals]]
cube = "muzzle"
face = "north"
x = 4
y = 1
w = 1
h = 1
colour = "nostril"
