# DF OPOSSUM (creature_temperate_new): 3 kg, "a large, white rat": the Virginia
# opossum, grizzled grey-white with a white face, pointed snout, black ears and a
# long naked pink tail. Attack bite (the template's `attack`); scratch optional, not made.
name = "opossum"
template = "quadruped"
status = "draft"

[proportions]
body = [4, 4, 7]
leg = [2, 3]
leg_ends = 0
head = [3, 3, 3]
head_up = 0
tail = [1, 8]
tail_raise = -10
walk = { cycle = 0.6, swing = 30, bob = 0.15 }
run = { cycle = 0.36, swing = 46, bob = 0.5, pitch = 5 }
idle = { length = 4.0, look = 20, breath = 0.1, wag = 6 }
attack = { length = 0.45, lunge = 2 }
eat = { length = 1.4, reach = 35, forward = 1.5 }

# Head pivot: the neck joint; the head cube spans y -2..1, z -2..1 around it.
[[cubes]]
name = "snout"
bone = "head"
part = "snout"
from = [-1, -2, -4.5]
to = [1, -0.5, -2]

[[cubes]]
name = "ear_l"
bone = "head"
part = "ears"
mirror = true
from = [-1.5, 1, -0.5]
to = [-0.5, 2, 0.5]

[palette]
fur = "#bdb9b1"
fur_up = "#8f8b84"
fur_down = "#d6d2ca"
legs = "#2c2826"
head = "#ece8e0"
snout = "#ece8e0"
ears = "#1e1c1b"
tail = "#d9b2a8"
eye = "#0c0a0a"
nose = "#e08a92"

[[decals]]
cube = "head"
face = "north"
x = 0
y = 0
colour = "eye"

[[decals]]
cube = "head"
face = "north"
x = 2
y = 0
colour = "eye"

[[decals]]
cube = "snout"
face = "north"
x = 0
y = 0
w = 2
colour = "nose"
