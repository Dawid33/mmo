# DF IMPALA (creature_large_tropical): 50 kg, slender reddish antelope.
# Attack kick (the template's `attack` lunge); bite optional, not made.
# A ram: tall lyre horns (two cubes a side), reddish back, fawn flanks, white
# belly, black stripes on the rump; neck as a cube on the head bone.
name = "impala"
template = "quadruped"
status = "draft"

[proportions]
body = [6, 7, 14]
leg = [2, 9]
head = [4, 4, 6]
head_up = 6
tail = [2, 4]
tail_raise = -30
walk = { cycle = 0.8, swing = 25, bob = 0.3 }
run = { cycle = 0.42, swing = 55, bob = 1.5, pitch = 7 }
idle = { length = 4.5, look = 24, breath = 0.15, wag = 12 }
attack = { length = 0.6, lunge = 3.5 }
eat = { length = 2.0, reach = 60, forward = 3 }

# Head pivot: the neck joint at the body's front top; the head cube spans
# y 3..7, z -5..1 around it.

[[cubes]]
name = "neck"
bone = "head"
part = "neck"
from = [-2, -2, -2]
to = [2, 5, 1]

[[cubes]]
name = "muzzle"
bone = "head"
part = "muzzle"
from = [-1.5, 3, -6.5]
to = [1.5, 5.5, -5]

[[cubes]]
name = "ear_l"
bone = "head"
part = "ears"
mirror = true
from = [-3.5, 6, -0.5]
to = [-2, 7, 0.5]

[[cubes]]
name = "horn_l"
bone = "head"
part = "horns"
mirror = true
from = [-2, 7, -0.5]
to = [-1, 11, 0.5]

[[cubes]]
name = "horn_top_l"
bone = "head"
part = "horns"
mirror = true
from = [-3, 10.5, 0]
to = [-2, 14, 1]

[palette]
fur = "#c48a52"
fur_up = "#a8663a"
fur_down = "#f2ebe0"
legs = "#c99560"
head = "#b57a46"
neck = "#c48a52"
neck_down = "#f2ebe0"
muzzle = "#c9956a"
ears = "#9a6a40"
horns = "#3a3028"
tail = "#f2ebe0"
tail_up = "#2a201a"
stripe = "#1e1814"
white = "#f2ebe0"
eye = "#120e0b"

[[decals]]
cube = "head"
face = "west"
x = 2
y = 1
w = 1
h = 1
colour = "eye"

[[decals]]
cube = "head"
face = "east"
x = 3
y = 1
w = 1
h = 1
colour = "eye"

[[decals]]
cube = "body"
face = "south"
x = 1
y = 0
w = 4
h = 6
colour = "white"

[[decals]]
cube = "body"
face = "south"
x = 0
y = 0
w = 1
h = 6
colour = "stripe"

[[decals]]
cube = "body"
face = "south"
x = 5
y = 0
w = 1
h = 6
colour = "stripe"

