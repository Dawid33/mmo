# DF FISH_GUPPY (vermin, tropical lakes/rivers): 0.2 kg, "a tiny colorful fish".
# Vermin form: `move` + `death` only (vermin have no attack clip). A small olive-silver body with a big fan tail in orange with a blue
# spot (taller than the body, so it rises from the belly line), and a coloured dorsal.
name = "guppy"
template = "vermin"
status = "draft"

decals = [
  { cube = "head", face = "west", x = 0, y = 0, colour = "eye" },
  { cube = "head", face = "east", x = 0, y = 0, colour = "eye" },
  { cube = "tail_fin", face = "west", x = 1, y = 1, colour = "blue" },
  { cube = "tail_fin", face = "east", x = 1, y = 1, colour = "blue" },
]

[proportions]
body = [0.75, 1, 2.5]
head = [0.75, 1, 0.75]
legs = 0
move = "swim"
cycle = 0.35

# Body pivot: its centre; the body spans y -0.5..0.5, z -1.25..1.25.
# The tail bone sits at the body's rear; the head's pivot is the body's front
# (the head spans y -0.5..0.5, z -0.75..0).
[[bones]]
name = "tail"
parent = "body"
pivot = [0, 0, 1.25]

[[cubes]]
name = "tail_fin"
bone = "tail"
part = "tail"
from = [-0.25, -0.5, 0]
to = [0.25, 1.25, 1.75]

[[cubes]]
name = "dorsal"
bone = "body"
part = "fins"
from = [-0.25, 0.5, 0]
to = [0.25, 1.25, 1.25]

[palette]
eye = "#101010"
body = "#a8ad90"
body_up = "#7c8466"
body_down = "#d6d8c8"
head = "#9ea486"
fins = "#e87a2a"
tail = "#ec6a2a"
blue = "#2a6ad8"

# The tail fin wags harder than the body's swim yaw.
[clips.move]
merge = true
mode = "loop"
length = 0.35
keys = [
  { bone = "tail", channel = "rotation", time = 0, value = [0, 0, 0] },
  { bone = "tail", channel = "rotation", time = 0.0875, value = [0, 25, 0] },
  { bone = "tail", channel = "rotation", time = 0.175, value = [0, 0, 0] },
  { bone = "tail", channel = "rotation", time = 0.2625, value = [0, -25, 0] },
  { bone = "tail", channel = "rotation", time = 0.35, value = [0, 0, 0] },
]
