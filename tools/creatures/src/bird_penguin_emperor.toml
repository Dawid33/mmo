# DF BIRD_PENGUIN_EMPEROR (wild, glacier): 30 kg, "the largest of the natural
# penguins". Bird template, flier = false, the body stood upright (taller than
# long): 21 units tall, black back and head, white front, yellow-orange ear
# patches and upper chest, a black bill with an orange stripe. Not AMPHIBIOUS in
# the raws, but a penguin swims: swim + swim_idle. LAYS_EGGS but wild: no brood.
# Attack bite (the template's peck).
name = "emperor penguin"
template = "bird"
status = "draft"
extras = ["swim", "swim_idle"]

[proportions]
body = [8, 15, 7]
leg = [2, 2]
foot = [3, 1, 3]
head = [5, 5, 5]
neck = 0
head_back = 4
beak = [1, 1, 3]
tail = [0, 0, 0]
wing = [1, 1]
flier = false
walk = { cycle = 0.7, swing = 22, bob = 0.2, nod = 0.3 }
run = { cycle = 0.45, swing = 34, lean = 8 }

# Body pivot: its centre. Flippers hang down the sides (static cubes: the bird
# template's wings fold along the back, so they are kept as stubs); the short tail
# sits at the bottom of the back.
[[cubes]]
name = "flipper_l"
bone = "body"
part = "wings"
mirror = true
from = [-5, -5, -2]
to = [-4, 5, 1]

[[cubes]]
name = "tail_stub"
bone = "body"
part = "wings"
from = [-1.5, -7.5, 3.5]
to = [1.5, -6.5, 5.5]

# A side-to-side waddle on the walk (keys at 0, half and full cycle).
[clips.walk]
merge = true
keys = [
  { bone = "body", channel = "rotation", time = 0, value = [0, 0, 7] },
  { bone = "body", channel = "rotation", time = 0.35, value = [0, 0, -7] },
  { bone = "body", channel = "rotation", time = 0.7, value = [0, 0, 7] },
]

[palette]
body = "#1c2028"
body_north = "#f4f2ea"
body_down = "#e8e6de"
head = "#14161c"
wings = "#1c2028"
tail = "#1c2028"
legs = "#2a2a2a"
beak = "#1a1a1a"
patch = "#f0a020"
chest = "#f6d870"
eye = "#0a0a0a"
stripe = "#e8742a"

# The body front is 8×15 (row 0 at the top): a pale yellow upper chest.
[[decals]]
cube = "body"
face = "north"
x = 1
y = 0
w = 6
h = 2
colour = "chest"

# The head sides are 5×5: ear patches below and behind the eye.
[[decals]]
cube = "head"
face = "west"
x = 2
y = 2
w = 3
h = 3
colour = "patch"

[[decals]]
cube = "head"
face = "east"
x = 0
y = 2
w = 3
h = 3
colour = "patch"

[[decals]]
cube = "head"
face = "west"
x = 1
y = 1
colour = "eye"

[[decals]]
cube = "head"
face = "east"
x = 3
y = 1
colour = "eye"

[[decals]]
cube = "beak"
face = "west"
x = 1
y = 0
w = 2
colour = "stripe"

[[decals]]
cube = "beak"
face = "east"
x = 0
y = 0
w = 2
colour = "stripe"
