# DF BIRD_CARDINAL (wild): 50 g, "a small bright red bird with a distinctive crest"
# (the male northern cardinal): red all over, darker wings, a black mask around a
# thick orange-red seed bill, a tall crest. Vermin in DF, but it has a giant, so it
# uses the full bird rig, small. FLIER; no brood. Attack: peck (the template's
# `attack`); scratch optional.
name = "cardinal"
template = "bird"
status = "draft"

[proportions]
body = [3, 3, 4]
leg = [1, 1]
foot = [2, 0.5, 1.5]
head = [2, 2, 2]
neck = 1
head_back = 1
beak = [1, 1, 1]
tail = [2, 0.5, 4]
tail_raise = 10
wing = [5, 2]
walk = { cycle = 0.35, swing = 30 }
run = { cycle = 0.22 }
fly = { cycle = 0.2, flap = 45 }

# Head pivot: the neck; a 2×2×2 head spans y 1..3, z -1..1 above it.
[[cubes]]
name = "crest"
bone = "head"
part = "crest"
from = [-0.5, 3, -0.5]
to = [0.5, 4, 1]

[[cubes]]
name = "crest_tip"
bone = "head"
part = "crest"
from = [-0.5, 3.5, 0.5]
to = [0.5, 4.5, 1.5]

[palette]
body = "#c8202a"
body_down = "#d43a3a"
head = "#d02428"
crest = "#d02428"
wings = "#a81c24"
tail = "#a01c22"
legs = "#8a5a52"
beak = "#e8603a"
mask = "#141012"
eye = "#3a0a0a"

# The head's side faces are 2×2 (row 0 at the top); the front is on
# the left of west and the right of east. Body `up`: row 0 is the front.

[[decals]]
cube = "head"
face = "west"
x = 0
y = 0
colour = "mask"
h = 2

[[decals]]
cube = "head"
face = "east"
x = 1
y = 0
colour = "mask"
h = 2

[[decals]]
cube = "head"
face = "north"
x = 0
y = 1
w = 2
colour = "mask"

[[decals]]
cube = "head"
face = "west"
x = 0
y = 0
colour = "eye"

[[decals]]
cube = "head"
face = "east"
x = 1
y = 0
colour = "eye"
