# DF BIRD_MAGPIE (wild): 0.2 kg, "a tiny black and white bird", the Eurasian magpie:
# black head, breast and back, white belly and shoulder patches, blue-glossed wings, a
# very long green-glossed black tail. Vermin in DF, but it has a giant, so it uses the
# full bird rig, small. FLIER; no brood. Attack: peck (the template's `attack`);
# scratch optional.
name = "magpie"
template = "bird"
status = "draft"

[proportions]
body = [3, 3, 5]
leg = [1, 1]
foot = [2, 0.5, 1.5]
head = [2, 2, 2]
neck = 1
head_back = 1
beak = [1, 0.5, 1.5]
tail = [2, 0.5, 7]
tail_raise = 15
wing = [5, 2]
walk = { cycle = 0.4, swing = 30 }
run = { cycle = 0.22 }
fly = { cycle = 0.2, flap = 45 }

[palette]
body = "#f0f0ee"
body_up = "#16161a"
body_north = "#16161a"
head = "#141418"
wings = "#1c2a52"
tail = "#16241e"
legs = "#16161a"
beak = "#121214"
eye = "#3a3438"
patch = "#f4f4f2"

# The head's side faces are 2×2 (row 0 at the top); the front is on
# the left of west and the right of east. Body `up`: row 0 is the front.

[[decals]]
cube = "head"
face = "west"
x = 0
y = 0
colour = "eye"

[[decals]]
cube = "head"
face = "east"
x = 1
y = 0
colour = "eye"

[[decals]]
cube = "wing_l"
face = "down"
x = 2
y = 0
w = 3
colour = "patch"

[[decals]]
cube = "wing_r"
face = "down"
x = 0
y = 0
w = 3
colour = "patch"
