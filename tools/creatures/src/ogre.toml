# DF OGRE (wild, evil plains): 6000 kg, "a giant humanoid monster found stomping
# about in the evil plains". Biped, 56 units: a pot belly, a small head on broad
# shoulders, heavy limbs, a hide loincloth. LARGE_PREDATOR: alert + roar. Attack
# punch (the template's `attack`); kick, scratch, bite optional (not made).
name = "ogre"
template = "biped"
status = "draft"
extras = ["alert", "roar"]

[proportions]
leg = [9, 18]
foot = 3
leg_inset = 1
body = [22, 21, 13]
arm = [7, 24]
hand = 5
head = [12, 12, 11]
walk = { cycle = 1.5, swing = 22, bob = 1.0 }
run = { cycle = 0.95, swing = 36, bob = 2.0 }

# Torso pivot: the hips; the torso spans y 0..21, z -6.5..6.5.
[[cubes]]
name = "belly"
bone = "torso"
part = "belly"
from = [-9, 2, -9]
to = [9, 14, -6.5]

[[cubes]]
name = "loincloth"
bone = "torso"
part = "hide"
from = [-11.5, -5, -7]
to = [11.5, 2.5, 7]

# Head pivot: the neck; the head spans y 0..12, z -5.5..5.5.
[[cubes]]
name = "brow"
bone = "head"
part = "head"
from = [-6, 7, -6.5]
to = [6, 9, -5.5]

[[cubes]]
name = "nose"
bone = "head"
part = "head"
from = [-1.5, 4, -7]
to = [1.5, 7, -5.5]

[[cubes]]
name = "hair"
bone = "head"
part = "hair"
from = [-6.5, 10, -4]
to = [6.5, 13, 6]

[palette]
head = "#9a8a5e"
hands = "#8c7c52"
torso = "#9a8a5e"
torso_up = "#a89a6c"
belly = "#a89a6c"
arms = "#9a8a5e"
legs = "#8c7c52"
feet = "#6a5c3a"
hide = "#5a4430"
hair = "#2e2418"
eye = "#e8d040"
mouth = "#3a2018"
tooth = "#e6dcc0"

# The head's front face is 12×12 (row 0 at the top): the brow covers rows 3-4.
[[decals]]
cube = "head"
face = "north"
x = 2
y = 5
w = 2
colour = "eye"

[[decals]]
cube = "head"
face = "north"
x = 8
y = 5
w = 2
colour = "eye"

[[decals]]
cube = "head"
face = "north"
x = 3
y = 9
w = 6
h = 2
colour = "mouth"

[[decals]]
cube = "head"
face = "north"
x = 3
y = 10
colour = "tooth"

[[decals]]
cube = "head"
face = "north"
x = 8
y = 10
colour = "tooth"
