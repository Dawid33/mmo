y = 1
w = 2
colour = "mask"

[[decals]]
cube = "head"
face = "east"
x = 1
y = 1
w = 2
colour = "mask"

[[decals]]
cube = "head"
face = "north"
x = 1
y = 1
colour = "eye"

[[decals]]
cube = "head"
face = "north"
x = 3
y = 1
colour = "eye"

[[decals]]
cube = "snout"
face = "north"
x = 0
y = 0
w = 2
colour = "nose"

# Rings round the tail (faces 3 × 8; the root at row 0 / west's left / east's right).

[[decals]]
cube = "tail"
face = "up"
x = 0
y = 1
w = 3
colour = "ring"

