# DF BIRD_CROW (wild): 0.5 kg, "a small black bird that feeds on carrion": the carrion
# crow, all black with a faint blue gloss, stout black bill, square tail; a little
# smaller than the raven. Vermin in DF, but it has a giant, so it uses the full bird
# rig, small. FLIER; no brood. Attack: peck (the template's `attack`); scratch
# optional.
name = "crow"
template = "bird"
status = "draft"

[proportions]
body = [4, 4, 6]
leg = [1, 2]
foot = [2, 1, 2]
head = [3, 3, 3]
neck = 1
head_back = 2
beak = [1, 1, 2]
tail = [3, 1, 3]
tail_raise = 10
wing = [7, 3]
walk = { cycle = 0.5, swing = 28 }
run = { cycle = 0.3 }
fly = { cycle = 0.45, flap = 40 }

[palette]
body = "#1a1a1e"
body_up = "#20232c"
head = "#1c1c21"
wings = "#1d1e26"
wings_up = "#232738"
tail = "#1a1a1f"
legs = "#141416"
beak = "#121214"
eye = "#4a4250"

# The head's side faces are 3×3 (row 0 at the top); the front is on
# the left of west and the right of east. Body `up`: row 0 is the front.

[[decals]]
cube = "head"
face = "west"
x = 1
y = 1
colour = "eye"

[[decals]]
cube = "head"
face = "east"
x = 1
y = 1
colour = "eye"
