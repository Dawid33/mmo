# DF DESERT TORTOISE (creature_desert_new): 5.5 kg, a small desert land tortoise.
# A high-domed shell with darker scute marks over a low body, thick stumpy legs,
# a small blunt head, a stub tail. Attack bite (the template's `attack`). Death
# rolls onto its side lifted by the shell's half-width (merged root position).
name = "desert tortoise"
template = "quadruped"
status = "draft"

decals = [
  { cube = "head", face = "west", x = 0, y = 1, colour = "eye" },
  { cube = "head", face = "east", x = 2, y = 1, colour = "eye" },
  { cube = "head", face = "north", x = 0, y = 2, w = 3, colour = "mouth" },
  { cube = "dome", face = "up", x = 1, y = 1, w = 2, h = 2, colour = "scute" },
  { cube = "dome", face = "up", x = 3, y = 1, w = 2, h = 2, colour = "scute" },
  { cube = "dome", face = "up", x = 1, y = 4, w = 2, h = 2, colour = "scute" },
  { cube = "dome", face = "up", x = 3, y = 4, w = 2, h = 2, colour = "scute" },
  { cube = "shell", face = "west", x = 1, y = 0, w = 2, h = 2, colour = "scute" },
  { cube = "shell", face = "west", x = 4, y = 0, w = 2, h = 2, colour = "scute" },
  { cube = "shell", face = "west", x = 7, y = 0, w = 2, h = 2, colour = "scute" },
  { cube = "shell", face = "east", x = 1, y = 0, w = 2, h = 2, colour = "scute" },
  { cube = "shell", face = "east", x = 4, y = 0, w = 2, h = 2, colour = "scute" },
  { cube = "shell", face = "east", x = 7, y = 0, w = 2, h = 2, colour = "scute" },
]

[proportions]
body = [6, 3, 8]
leg = [2, 2]
leg_inset = -0.5
leg_ends = 1
head = [3, 3, 3]
head_up = 0
head_overlap = 0
tail = [1, 2]
tail_raise = -20
walk = { cycle = 1.2, swing = 20, bob = 0.1 }
run = { cycle = 0.8, swing = 26, bob = 0.2, pitch = 2 }
idle = { length = 6.0, look = 20, breath = 0.06, wag = 0 }
attack = { length = 0.5, lunge = 1 }
eat = { length = 1.8, reach = 25, forward = 1 }

# Body pivot: its centre (y 3.5); the body spans y -1.5..1.5, z -4..4.
[[cubes]]
name = "shell"
bone = "body"
part = "shell"
from = [-4, -0.5, -5]
to = [4, 2.5, 5]

[[cubes]]
name = "dome"
bone = "body"
part = "shell"
from = [-3, 2.5, -3.5]
to = [3, 4, 3.5]

[palette]
fur = "#9a8a6a"
legs = "#8c7c5c"
head = "#9a8a6a"
tail = "#8c7c5c"
shell = "#8a7048"
shell_up = "#957a50"
shell_down = "#c0a878"
scute = "#5e4a2e"
eye = "#16100c"
mouth = "#4a3e2c"

[clips.death]
merge = true
keys = [
  { bone = "root", channel = "position", time = 0.0, value = [0, 0, 0] },
  { bone = "root", channel = "position", time = 0.6, value = [0, 4, 0] },
  { bone = "root", channel = "position", time = 1.0, value = [0, 4, 0] },
]
