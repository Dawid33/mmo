# DF AXOLOTL (vermin, creature_riverlakepool_new): 0.2 kg, a lake salamander that regrows
# limbs. It has a giant, so the full quadruped rig at small size: a pink body on
# little splayed legs, a wide flat head with three feathery gill stalks on each
# side, a long tail with a tall fin. Attack bite (the template's `attack`).
# AMPHIBIOUS: swim + swim_idle.
name = "axolotl"
template = "quadruped"
status = "draft"
extras = ["swim", "swim_idle"]

decals = [
  { cube = "head", face = "west", x = 0, y = 0, colour = "eye" },
  { cube = "head", face = "east", x = 1, y = 0, colour = "eye" },
  { cube = "head", face = "north", x = 1, y = 1, colour = "mouth" },
]

[proportions]
body = [2, 1.5, 3]
leg = [0.5, 1]
leg_inset = -0.5
leg_ends = 0
head = [3, 1.5, 2]
head_up = 0
head_overlap = 0
tail = [1, 4]
tail_raise = 0
walk = { cycle = 0.45, swing = 30, bob = 0.05 }
run = { cycle = 0.28, swing = 42, bob = 0.1, pitch = 2 }
idle = { length = 4.0, look = 15, breath = 0.05, wag = 8 }
attack = { length = 0.35, lunge = 1 }
eat = { length = 1.2, reach = 15, forward = 0.5 }

# Head pivot: the neck joint; the head cube spans y -0.5..1, z -2..0 around it.
[[cubes]]
name = "gill_a_l"
bone = "head"
part = "gills"
mirror = true
from = [-2.25, 1, -0.5]
to = [-1.25, 1.75, 0]

[[cubes]]
name = "gill_b_l"
bone = "head"
part = "gills"
mirror = true
from = [-2.5, 0.25, -0.5]
to = [-1.5, 1, 0]

[[cubes]]
name = "gill_c_l"
bone = "head"
part = "gills"
mirror = true
from = [-2.25, -0.5, -0.5]
to = [-1.5, 0.25, 0]

# The tail fin (tail pivot: the rump's top, one below the body top).
[[cubes]]
name = "fin"
bone = "tail"
part = "fin"
from = [-0.25, -1, 0]
to = [0.25, 1, 4]

[palette]
fur = "#eeb0b8"
fur_down = "#f6cfd3"
legs = "#e8a2ac"
head = "#f0b6be"
tail = "#eeb0b8"
fin = "#f4c6cc"
gills = "#d6566e"
eye = "#1a1012"
mouth = "#c87a86"
