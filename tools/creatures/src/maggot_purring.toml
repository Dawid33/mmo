# DF MAGGOT_PURRING (vermin, subterranean): 1 kg, "a tiny larva which is prized
# for its milk". No giant, so the vermin form: a fat creamy-white grub (DF colour
# 7:0:1) with segment furrows and dark mouth hooks; `move` is the crawl stretch.
name = "purring maggot"
template = "vermin"
status = "draft"

decals = [
  { cube = "body", face = "up", x = 0, y = 1, w = 3, h = 1, colour = "furrow" },
  { cube = "body", face = "up", x = 0, y = 3, w = 3, h = 1, colour = "furrow" },
  { cube = "body", face = "up", x = 0, y = 5, w = 3, h = 1, colour = "furrow" },
  { cube = "body", face = "west", x = 1, y = 0, w = 1, h = 3, colour = "furrow" },
  { cube = "body", face = "west", x = 3, y = 0, w = 1, h = 3, colour = "furrow" },
  { cube = "body", face = "west", x = 5, y = 0, w = 1, h = 3, colour = "furrow" },
  { cube = "body", face = "east", x = 0, y = 0, w = 1, h = 3, colour = "furrow" },
  { cube = "body", face = "east", x = 2, y = 0, w = 1, h = 3, colour = "furrow" },
  { cube = "body", face = "east", x = 4, y = 0, w = 1, h = 3, colour = "furrow" },
  { cube = "head", face = "north", x = 0, y = 1, w = 2, h = 1, colour = "hooks" },
]

[proportions]
body = [3, 2.5, 6]
head = [2, 2, 1.5]
legs = 0
move = "crawl"
cycle = 1.2

[palette]
body = "#e9e2c9"
body_up = "#f0ead4"
body_down = "#d6cdb0"
head = "#ddd3b4"
furrow = "#c9bf9f"
hooks = "#3a2e22"
