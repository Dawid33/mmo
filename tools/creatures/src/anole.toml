# DF ANOLE (vermin, creature_reptiles): 0.09 kg, a small climbing lizard that turns
# brown to green. It has a giant, so the full quadruped rig at small size: low body
# on splayed legs (negative leg_inset), pointed snout, pink dewlap, long thin tail
# held low. Attack bite (the template's `attack`). Colour change not modelled
# (green phase).
name = "anole"
template = "quadruped"
status = "draft"

decals = [
  { cube = "head", face = "west", x = 0, y = 0, colour = "eye" },
  { cube = "head", face = "east", x = 1, y = 0, colour = "eye" },
]

[proportions]
body = [2, 1, 3]
leg = [0.5, 1]
leg_inset = -0.5
leg_ends = 0
head = [1.5, 1, 1.5]
head_up = 0
head_overlap = 0
tail = [0.5, 5]
tail_raise = -5
walk = { cycle = 0.3, swing = 35, bob = 0.05 }
run = { cycle = 0.18, swing = 50, bob = 0.15, pitch = 3 }
idle = { length = 3.0, look = 30, breath = 0.04, wag = 6 }
attack = { length = 0.3, lunge = 1 }
eat = { length = 1.0, reach = 15, forward = 0.5 }

# Head pivot: the neck joint; the head cube spans y 0..1, z -1.5..0 around it.
[[cubes]]
name = "snout"
bone = "head"
part = "head"
from = [-0.5, 0, -2.5]
to = [0.5, 0.75, -1.5]

[[cubes]]
name = "dewlap"
bone = "head"
part = "dewlap"
from = [-0.25, -0.5, -1.25]
to = [0.25, 0, -0.25]

[palette]
fur = "#5ea83e"
fur_down = "#b6d68e"
legs = "#549a36"
head = "#62ac42"
tail = "#549a36"
dewlap = "#e86a7a"
eye = "#1a1a10"
