# DF MARMOT_HOARY (creature_mountain_new): 7 kg, big mountain rodent.
# Attacks bite (the template's `attack`) and scratch (optional, not made).
# Silver-grey shoulders and head, brown rump and bushy tail, black feet and a
# black cap with a white muzzle band.
name = "hoary marmot"
template = "quadruped"
status = "draft"

[proportions]
body = [7, 6, 10]
leg = [2, 3]
leg_ends = 0
head = [5, 4, 4]
head_up = 1
tail = [3, 5]
tail_raise = 10
walk = { cycle = 0.65, swing = 30, bob = 0.2 }
run = { cycle = 0.38, swing = 45, bob = 0.5, pitch = 5 }
idle = { length = 4.0, look = 24, breath = 0.14, wag = 4 }
attack = { length = 0.5, lunge = 2 }
eat = { length = 1.3, reach = 40, forward = 1.5 }

# Head pivot: the neck joint; the head cube spans y -2..2, z -3..1 around it.

[[cubes]]
name = "snout"
bone = "head"
part = "snout"
from = [-1.5, -2, -4]
to = [1.5, 0, -3]

[[cubes]]
name = "ear_l"
bone = "head"
part = "ears"
mirror = true
from = [-2.5, 2, -0.5]
to = [-1.5, 3, 0.5]

[palette]
fur = "#a6a29a"
fur_up = "#b8b4ac"
fur_down = "#8a857c"
legs = "#1e1c1a"
head = "#c4c0b8"
snout = "#f0ece4"
ears = "#5a5650"
tail = "#7a5a3a"
rump = "#8a6844"
cap = "#2a2826"
eye = "#0e0b09"
nose = "#1e1c1a"

[[decals]]
cube = "head"
face = "north"
x = 1
y = 1
w = 1
h = 1
colour = "eye"

[[decals]]
cube = "head"
face = "north"
x = 3
y = 1
w = 1
h = 1
colour = "eye"

[[decals]]
