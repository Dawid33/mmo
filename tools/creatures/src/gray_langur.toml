# DF GRAY_LANGUR (wild): 15 kg, a slender monkey of forests and town streets.
# Quadruped template on long legs with a long tail carried low behind:
# buff-grey fur, black face, hands and feet, the face under a pale fringe.
# Attacks bite (the template's `attack`) and scratch (optional, not made).
# CURIOUSBEAST_ITEM / _EATER: pick_up + carry.
name = "gray langur"
template = "quadruped"
status = "draft"
extras = ["pick_up", "carry"]

[proportions]
body = [5, 5, 10]
leg = [2, 7]
leg_ends = 0
head = [4, 4, 3]
head_up = 2
tail = [1, 12]
tail_raise = 25
walk = { cycle = 0.75, swing = 26, bob = 0.3 }
run = { cycle = 0.42, swing = 44, bob = 0.7, pitch = 6 }
idle = { length = 4.0, look = 28, breath = 0.12, wag = 8 }
attack = { length = 0.5, lunge = 2 }
eat = { length = 1.5, reach = 48, forward = 2 }

# Head pivot: the neck joint; the head cube spans y -1..3, z -2..1 around it.
[[cubes]]
name = "muzzle"
bone = "head"
part = "face"
from = [-1, -1, -2.5]
to = [1, 0.5, -2]

[[cubes]]
name = "brow"
bone = "head"
part = "fringe"
from = [-2.5, 2, -2.5]
to = [2.5, 3, -2]

# Black hands and feet: a sock at the bottom of each leg (leg pivot: the hip
# or shoulder; the leg hangs 7 below it). Front pair here, back pair below.
[[cubes]]
name = "hand_l"
bone = "leg_fl"
part = "paws"
mirror = true
from = [-1.1, -7, -1.1]
to = [1.1, -5.5, 1.1]

[[cubes]]
name = "foot_l"
bone = "leg_bl"
part = "paws"
mirror = true
from = [-1.1, -7, -1.1]
to = [1.1, -5.5, 1.1]

[palette]
fur = "#a8a294"
fur_up = "#9a9282"
fur_down = "#ccc6b8"
legs = "#a09a8c"
head = "#d0ccc0"
tail = "#9a9282"
face = "#1a1816"
fringe = "#e0dcd0"
paws = "#2a2826"
eye = "#5a3a1e"
nose = "#0a0908"

# The head's front face is 4×4 (row 0 at the top): a black face under the fringe.
[[decals]]
cube = "head"
face = "north"
x = 0
y = 1
w = 4
h = 3
colour = "face"

[[decals]]
cube = "head"
face = "north"
x = 0
y = 1
colour = "eye"

[[decals]]
cube = "head"
face = "north"
x = 3
y = 1
colour = "eye"
