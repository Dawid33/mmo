# DF FISH_PERCH (vermin, fresh water): 0.2 kg, "a small striped fish". Vermin form: `move` + `death` only (vermin have no attack clip).
# Yellow-green with dark vertical bars, a spiny dorsal, orange-red lower fins.
name = "perch"
template = "vermin"
status = "draft"

decals = [
  { cube = "head", face = "west", x = 0, y = 0, colour = "eye" },
  { cube = "head", face = "east", x = 1, y = 0, colour = "eye" },
  { cube = "body", face = "west", x = 0, y = 0, colour = "bar" },
  { cube = "body", face = "west", x = 2, y = 0, colour = "bar" },
  { cube = "body", face = "west", x = 4, y = 0, colour = "bar" },
  { cube = "body", face = "east", x = 0, y = 0, colour = "bar" },
  { cube = "body", face = "east", x = 2, y = 0, colour = "bar" },
  { cube = "body", face = "east", x = 4, y = 0, colour = "bar" },
  { cube = "body", face = "up", x = 0, y = 0, w = 2, h = 1, colour = "bar" },
  { cube = "body", face = "up", x = 0, y = 2, w = 2, h = 1, colour = "bar" },
  { cube = "body", face = "up", x = 0, y = 4, w = 2, h = 1, colour = "bar" },
]

[proportions]
body = [1.5, 2, 4.5]
head = [1.5, 1.75, 1.25]
legs = 0
move = "swim"
cycle = 0.5

# Body pivot: its centre; the body spans y -1..1, z -2.25..2.25.
# The tail bone sits at the body's rear; the head's pivot is the body's front
# (the head spans y -1..0.75, z -1.25..0).
[[bones]]
name = "tail"
parent = "body"
pivot = [0, 0, 2.25]

[[cubes]]
name = "tail_fin"
bone = "tail"
part = "fins"
from = [-0.25, -0.875, 0]
to = [0.25, 0.875, 1.25]

[[cubes]]
name = "dorsal"
bone = "body"
part = "fins"
from = [-0.25, 1, -1.5]
to = [0.25, 2, 1]

[[cubes]]
name = "fin_l"
bone = "body"
part = "red"
from = [-1.5, -0.75, -2]
to = [-0.75, -0.5, -1]
mirror = true

[palette]
eye = "#101010"
body = "#a8a83e"
body_up = "#5e6a2e"
body_down = "#e8e2b0"
head = "#9c9c3a"
head_up = "#566228"
fins = "#6e7438"
red = "#d8582a"
bar = "#3a3e1e"

# The tail fin wags harder than the body's swim yaw.
[clips.move]
merge = true
mode = "loop"
length = 0.5
keys = [
  { bone = "tail", channel = "rotation", time = 0, value = [0, 0, 0] },
  { bone = "tail", channel = "rotation", time = 0.125, value = [0, 25, 0] },
  { bone = "tail", channel = "rotation", time = 0.25, value = [0, 0, 0] },
  { bone = "tail", channel = "rotation", time = 0.375, value = [0, -25, 0] },
  { bone = "tail", channel = "rotation", time = 0.5, value = [0, 0, 0] },
]
