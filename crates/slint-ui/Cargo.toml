[package]
name = "slint-ui"
version = "0.1.0"
edition = "2024"

# Engine-free like `game`: no Bevy. The client composites the pixels.
# Integration tests are declared below: tests/it.rs is one binary for most
# files, the rest need a process of their own (see tests/it.rs).
autotests = false

[dependencies]
slint = { workspace = true }
# The screens, generated in their own crates (crates/slint-ui/build_common.rs)
# and re-exported from src/lib.rs. Leaves of the graph, so they build in
# parallel and a .slint edit recompiles only the half it touches.
slint-ui-game = { workspace = true }
slint-ui-frontend = { workspace = true }

# `tests/wasm_images.rs` under node (`just slint-wasm`); same version as game's.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[dev-dependencies]
# The asset viewer + controls harness the tests drive (not in the game build).
slint-ui-tools = { workspace = true }

[[test]]
name = "it"
path = "tests/it.rs"

# wasm32 only: the embedded sprites draw in the browser build (`just slint-wasm`).
[[test]]
name = "wasm_images"
path = "tests/wasm_images.rs"
