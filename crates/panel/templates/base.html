<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}World panel{% endblock %}</title>
<script src="/assets/htmx.min.js"></script>
<style>
:root {
  --bg: #f6f5f2; --surface: #ffffff; --ink: #1d1f22; --muted: #63676d; --line: #dedbd4;
  --accent: #3a5f8f; --good: #2f7a46; --warn: #a86a12; --bad: #b0352b; --idle: #6b7078;
  --good-bg: #e5f2e8; --warn-bg: #fbefdc; --bad-bg: #f8e3e0; --idle-bg: #ecedef;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15171a; --surface: #1d2024; --ink: #e6e4df; --muted: #9a9ea5; --line: #30343a;
    --accent: #8fb0dc; --good: #79c48f; --warn: #e2a65a; --bad: #ee8a7f; --idle: #a2a7ae;
    --good-bg: #1e3326; --warn-bg: #3a2c17; --bad-bg: #3c201d; --idle-bg: #2a2d32;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); }
header { display: flex; align-items: baseline; gap: 1rem; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--surface); }
header a.home { font-weight: 650; color: var(--ink); text-decoration: none; letter-spacing: .01em; }
header .crumb { color: var(--muted); font-family: var(--mono); }
main { max-width: 1180px; margin: 0 auto; padding: 20px 24px 60px; }
h1 { font-size: 20px; margin: 0 0 4px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 8px; font-weight: 600; }
a { color: var(--accent); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--bg); }
tr:last-child td { border-bottom: 0; }
td.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 13px; }
.muted { color: var(--muted); }
.pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.pill.good { color: var(--good); background: var(--good-bg); }
.pill.warn { color: var(--warn); background: var(--warn-bg); }
.pill.bad { color: var(--bad); background: var(--bad-bg); }
.pill.idle { color: var(--idle); background: var(--idle-bg); }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.fact .k { font-size: 12px; color: var(--muted); }
.fact .v { font-size: 16px; font-variant-numeric: tabular-nums; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
button.danger { color: var(--bad); border-color: var(--bad); }
button:disabled { opacity: .5; cursor: progress; }
form.forge { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; align-items: end; }
label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
input, select { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
.notice { margin-top: 10px; padding: 8px 12px; border-radius: 6px; }
.notice.ok { background: var(--good-bg); color: var(--good); }
.notice.bad { background: var(--bad-bg); color: var(--bad); }
pre.log { margin: 8px 0 0; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; font: 12.5px/1.5 var(--mono); white-space: pre-wrap; max-height: 320px; overflow: auto; }
.problems { color: var(--bad); }
.scroll { overflow-x: auto; }
@media (max-width: 640px) { main, header { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body>
<header><a class="home" href="/">World panel</a>{% block crumb %}{% endblock %}</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
