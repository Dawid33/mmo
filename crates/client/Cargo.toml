[package]
name = "client"
version = "0.1.0"
edition = "2021"

[dependencies]
game = { path = "../game" }
simplelog = "0.12.2"
log = { version = "0.4.22", features = [
  "max_level_debug",
  "release_max_level_warn",
] }
rand = "0.9.2"
iyes_perf_ui = "0.5.0"
block-mesh = "0.2.0"
ndshape = "0.3.0"
crossbeam = "0.8.4"
bincode = "1.3.3"
crc32fast = "1.5.0"
derive_more = { version = "2.0.1", features = ["full"] }
weak-table = { version = "0.3.2", features = ["ahash"] }
bytemuck = "1.23.2"
slotmapd = { path = "../slotmapd", features = ["serde"] }
futures-lite = "2.6.1"
noise = { version = "0.9.0" }
pyroscope = "^0.5.8"
pyroscope_pprofrs = "^0.2.10"


[target.'cfg(target_arch = "x86_64")'.dependencies]
rapier3d = { version = "0.22.0", features = [
  "enhanced-determinism",
  "serde-serialize",
] }
quinn = "0.11.6"
tokio = { version = "1.42.0", features = ["rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rapier3d = { version = "0.22.0", features = [
  "enhanced-determinism",
  "wasm-bindgen",
  "serde-serialize",
] }
