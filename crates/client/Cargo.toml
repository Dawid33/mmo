[package]
name = "client"
version = "0.1.0"
edition = "2021"

[dependencies]
game = { path = "../game" }
simplelog = "0.12.2"
log = "0.4.22"
winit = "0.30.12"
wgpu = "26.0.1"
pollster = "0.4"
crossbeam = "0.8.4"
bincode = "1.3.3"
cosmic-text = "0.14.2"

[target.'cfg(target_arch = "x86_64")'.dependencies]
rapier3d = { version = "0.22.0", features = [ "enhanced-determinism", "serde-serialize" ] }
quinn = "0.11.6"
tokio = { version = "1.42.0", features=["rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rapier3d = { version = "0.22.0", features = [ "enhanced-determinism", "wasm-bindgen", "serde-serialize" ] }


