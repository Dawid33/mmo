[package]
name = "client"
version = "0.1.0"
edition = "2021"

[lib]
name = "client"
path = "src/lib.rs"

[[bin]]
name = "client"
path = "src/main.rs"

[dependencies]
game = { workspace = true }
worldgen = { workspace = true }
slotmapd = { workspace = true }
log = { workspace = true }
crossbeam = { workspace = true }
bincode = { workspace = true }
crc32fast = { workspace = true }
bevy = { workspace = true }
image = { workspace = true }
ordered-float = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
quinn = { workspace = true }
tokio = { workspace = true, features = ["time"] } # connect retry: timeout + sleep
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
pyroscope = { workspace = true, optional = true }
pyroscope_pprofrs = { workspace = true, optional = true }

[features]
# Continuous profiling (native only): the deps live in the non-wasm target
# table, so enabling this on a wasm build is a harmless no-op.
pyroscope = ["dep:pyroscope", "dep:pyroscope_pprofrs"]
# Tracy frame profiler: compiles bevy's tracing-tracy layer in (span + frame
# data streamed to a running Tracy GUI). Run via `just tracy-client`. Unlike
# `pyroscope` this forwards a bevy feature rather than gating a target-table
# dep, so do NOT enable it on wasm builds — tracy-client has no wasm32 port.
tracy = ["bevy/trace_tracy", "bevy/debug"]
# Tracy with bevy's extra-verbose internal spans (ECS/render hot paths).
# MUCH noisier captures and real overhead — reach for it when the normal
# tracy view isn't fine-grained enough. `just tracy-client detailed`.
tracy-detailed = ["tracy", "bevy/detailed_trace"]
# Chrome Trace Event capture: bevy's tracing spans (one per ECS system, plus
# extract/render-graph nodes) are written to a JSON file on clean exit —
# TRACE_CHROME=<path>, else ./trace-<nanos>.json. Unlike Tracy this needs no
# GUI, so `scripts/trace_summary.py` can reduce it to a pasteable per-system
# table. Run via `just trace-chrome`. Native only (tracing-chrome has no wasm
# port), and the file is only complete if the app exits cleanly — close the
# window, don't kill -9.
# `bevy/debug` keeps system/component names: without it every span in a release
# trace reads `system: name="<Enable the debug feature to see the name>"` and the
# per-system table is useless (measured 2026-09-19). Tracing builds only.
trace_chrome = ["bevy/trace_chrome", "bevy/debug"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Adds to (does not replace) the base [dependencies] bevy features — target tables merge additively.
bevy = { workspace = true, features = ["webgl2"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window", "Location", "Response", "Document",
  "WebTransport", "WebTransportOptions", "WebTransportHash",
  "WebTransportCloseInfo", "ReadableStream", "ReadableStreamDefaultReader",
  "WritableStream", "WritableStreamDefaultWriter",
  "WebTransportReceiveStream", "WebTransportSendStream",
] }

[dev-dependencies]
block-mesh = { workspace = true }
naga = { version = "27.0", features = ["wgsl-in"] }
