[package]
name = "client"
version = "0.1.0"
edition = "2021"

[dependencies]
game = { path = "../game" }
simplelog = "0.12.2"
log = "0.4.22"
winit = { version = "0.30.12", features = ["serde"] }
wgpu = "24.0.5"
pollster = "0.4"
crossbeam = "0.8.4"
bincode = "1.3.3"
parley = "0.5.0"
vello = "0.5.0"
bytemuck = "1.23.2"
slotmap = { version = "1.0.7", features = ["serde"] }

[target.'cfg(target_arch = "x86_64")'.dependencies]
rapier3d = { version = "0.22.0", features = [ "enhanced-determinism", "serde-serialize" ] }
quinn = "0.11.6"
tokio = { version = "1.42.0", features=["rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rapier3d = { version = "0.22.0", features = [ "enhanced-determinism", "wasm-bindgen", "serde-serialize" ] }


