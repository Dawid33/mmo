[package]
name = "client"
version = "0.1.0"
edition = "2021"

[dependencies]
game = { path = "../game" }
bevy = { version = "0.15.0", default-features = false, features = ["android-game-activity", 
"android_shared_stdcxx", "animation", "bevy_asset",
"bevy_color", "bevy_core_pipeline", "bevy_gilrs", "bevy_gizmos",
"bevy_gltf", "bevy_mesh_picking_backend", "bevy_pbr", "bevy_picking", "bevy_audio",
"bevy_render", "bevy_scene", "bevy_sprite", "bevy_sprite_picking_backend",
"bevy_state", "bevy_text", "bevy_ui", "bevy_ui_picking_backend", "bevy_window",
"bevy_winit", "custom_cursor", "default_font", "hdr", "png",
"smaa_luts", "sysinfo_plugin", "tonemapping_luts", "webgl2", "x11"]}

[target.'cfg(target_arch = "x86_64")'.dependencies]
rapier3d = { version = "0.22.0", features = [ "enhanced-determinism" ] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rapier3d = { version = "0.22.0", features = [ "enhanced-determinism", "wasm-bindgen" ] }


