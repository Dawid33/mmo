[package]
name = "client"
version = "0.1.0"
edition = "2021"
# Integration tests are declared below: tests/it.rs is one binary for most
# files, the rest need a process of their own (see tests/it.rs).
autotests = false

[lib]
name = "client"
path = "src/lib.rs"

[[bin]]
name = "client"
path = "src/main.rs"

[dependencies]
bbmodel = { workspace = true }
game = { workspace = true }
# The login service's HTTP DTOs (serde only) and its client: native rustls (ring), browser fetch.
login-api = { workspace = true }
reqwest = { workspace = true }
# The device sign-in's PKCE (`login/oidc.rs`): SHA-256 + base64url of a random verifier.
# Pure Rust; `getrandom`'s `js` feature (Web Crypto) only acts on wasm32, as rapier's does.
sha2 = { workspace = true }
base64 = { workspace = true }
getrandom = { version = "0.2", features = ["js"] }
# Player-facing game UI (Factorio-style Slint widgets, software-rendered):
# composited by `renderer/slint_overlay.rs`.
slint-ui = { workspace = true }
worldgen = { workspace = true }
slotmapd = { workspace = true }
log = { workspace = true }
crossbeam = { workspace = true }
crc32fast = { workspace = true }
bevy = { workspace = true }
image = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Serde + bincode: native session wire bits, and on wasm the messages to and
# from the Web Workers (`src/web_worker/`).
serde = { workspace = true, features = ["std"] }
bincode = { workspace = true }
# F3 developer panel (`renderer/dev_ui.rs`). Dev tooling only — player-facing
# UI is bevy_ui. The clipboard/open_url defaults are left out (extra deps).

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The device sign-in opens the identity provider's page in the system browser (`login/flow.rs`).
open = "5"
quinn = { workspace = true }
# The public web PKI roots for a host named by a public address (`quic_verify.rs`).
webpki-roots = { workspace = true }
tokio = { workspace = true, features = ["time", "rt", "sync"] } # connect retry: timeout + sleep; `rt`: the login-http thread's current-thread runtime; `sync`: netcode's outgoing bridge
pyroscope = { workspace = true, optional = true }
pyroscope_pprofrs = { workspace = true, optional = true }
# Only for the `gpu_error_panic` diagnostic feature; the version must be the one
# Bevy's wgpu already resolves to, so no second copy is built.
wgpu-hal = { version = "29.0.4", optional = true }
# Only to enumerate adapters before Bevy starts (`adapter_pick.rs`). Same version
# as Bevy's wgpu and no features of its own, so it adds no build.
wgpu = { version = "29.0.4", default-features = false }
# The world map's single-player source: the world's own store read beside its server (`renderer/map/`).
map-tiles = { path = "../map-tiles" }
world-store = { path = "../world-store" }

[features]
default = ["dev_ui"]
# F3 developer panel (a Slint layer, renderer/dev_ui.rs).
# `--no-default-features` builds without it.
dev_ui = []
# Hot reload: Bevy watches the asset files and reloads what changed. Not used
# by any recipe: it changes Bevy's feature set, so a build with it is a second
# copy of Bevy in target/. The model viewers poll the shown file instead, which
# keeps them the same build as `just run`.
file_watcher = ["bevy/file_watcher"]
# Continuous profiling (native only): the deps live in the non-wasm target
# table, so enabling this on a wasm build is a harmless no-op.
pyroscope = ["dep:pyroscope", "dep:pyroscope_pprofrs"]
# Diagnostic: make wgpu-hal PANIC at the Vulkan call that fails instead of
# reporting a lost device, naming the VkResult. A `DeviceLost` whose reason is
# "Unknown ... Unexpected error variant" is wgpu turning an unmapped VkResult
# into a lost device — this shows which call and which result (2026-09-25).
# Native only; `just probe_features=gpu_error_panic shuttle-probe`.
gpu_error_panic = ["dep:wgpu-hal", "wgpu-hal/internal_error_panic", "wgpu-hal/device_lost_panic"]
# Tracy frame profiler: compiles bevy's tracing-tracy layer in (span + frame
# data streamed to a running Tracy GUI). Run via `just tracy-client`. Unlike
# `pyroscope` this forwards a bevy feature rather than gating a target-table
# dep, so do NOT enable it on wasm builds — tracy-client has no wasm32 port.
tracy = ["bevy/trace_tracy", "bevy/debug"]
# Tracy with bevy's extra-verbose internal spans (ECS/render hot paths).
# MUCH noisier captures and real overhead — reach for it when the normal
# tracy view isn't fine-grained enough. `just tracy-client detailed`.
tracy-detailed = ["tracy", "bevy/detailed_trace"]
# Chrome Trace Event capture: bevy's tracing spans (one per ECS system, plus
# extract/render-graph nodes) are written to a JSON file on clean exit —
# TRACE_CHROME=<path>, else ./trace-<nanos>.json. Unlike Tracy this needs no
# GUI, so `scripts/trace_summary.py` can reduce it to a pasteable per-system
# table. Run via `just trace-chrome`. Native only (tracing-chrome has no wasm
# port), and the file is only complete if the app exits cleanly — close the
# window, don't kill -9.
# `bevy/debug` keeps system/component names: without it every span in a release
# trace reads `system: name="<Enable the debug feature to see the name>"` and the
# per-system table is useless (measured 2026-09-19). Tracing builds only.
trace_chrome = ["bevy/trace_chrome", "bevy/debug"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Adds to (does not replace) the base [dependencies] bevy features — target tables merge additively.
bevy = { workspace = true, features = ["webgl2"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window", "Location", "Response", "Document",
  "WebTransport", "WebTransportOptions", "WebTransportHash",
  "WebTransportCloseInfo", "ReadableStream", "ReadableStreamDefaultReader",
  "WritableStream", "WritableStreamDefaultWriter",
  "WebTransportReceiveStream", "WebTransportSendStream",
  # Web Workers (src/web_worker/): the sim worker and the compute pool.
  "Worker", "WorkerOptions", "WorkerType", "Blob", "BlobPropertyBag", "Url",
  "MessageEvent", "ErrorEvent", "DedicatedWorkerGlobalScope", "WorkerGlobalScope",
  "Navigator", "WorkerNavigator", "console",
  # Monotonic client timings in the page and sim worker (perf_clock.rs).
  "Performance",
  # The player name (src/player_name.rs): localStorage + Web Crypto.
  "Storage", "Crypto",
] }

[dev-dependencies]
# The asset viewer's screen (examples/asset_viewer.rs).
slint-ui-tools = { workspace = true }


