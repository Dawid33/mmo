[package]
name = "client"
version = "0.1.0"
edition = "2021"

[dependencies]
game = { path = "../game" }
log = "0.4.22"
simple-log = "2.1.1"
raylib = "5.0.2"
crossbeam = "0.8.4"
bincode = "1.3.3"


[target.'cfg(target_arch = "x86_64")'.dependencies]
rapier3d = { version = "0.22.0", features = [ "enhanced-determinism", "serde-serialize" ] }
quinn = "0.11.6"
tokio = "1.42.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
rapier3d = { version = "0.22.0", features = [ "enhanced-determinism", "wasm-bindgen", "serde-serialize" ] }


