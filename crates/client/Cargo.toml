[package]
name = "client"
version = "0.1.0"
edition = "2021"

[features]
pyroscope = ["dep:pyroscope", "dep:pyroscope_pprofrs"]

[dependencies]
game = { workspace = true }
slotmapd = { workspace = true }
log = { workspace = true }
block-mesh = { workspace = true }
crossbeam = { workspace = true }
bincode = { workspace = true }
pyroscope = { workspace = true, optional = true }
pyroscope_pprofrs = { workspace = true, optional = true }
bevy = { workspace = true }
image = { workspace = true }
ordered-float = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
quinn = { workspace = true }
tokio = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Adds to (does not replace) the base [dependencies] bevy features — target tables merge additively.
bevy = { workspace = true, features = ["webgl2"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window", "Location", "Response", "Document",
  "WebTransport", "WebTransportOptions", "WebTransportHash",
  "WebTransportCloseInfo", "ReadableStream", "ReadableStreamDefaultReader",
  "WritableStream", "WritableStreamDefaultWriter",
  "WebTransportReceiveStream", "WebTransportSendStream",
] }
