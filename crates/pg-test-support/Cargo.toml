[package]
name = "pg-test-support"
version = "0.1.0"
edition = "2024"
publish = false
description = "Throwaway Postgres databases for tests (dev-dependency only)."

[dependencies]
sqlx = { workspace = true }
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

[[test]]
name = "it"
path = "tests/it.rs"
