[package]
name = "worldgen"
version = "0.1.0"
edition = "2024"
# Integration tests are declared below: tests/it.rs is one binary for most
# files, the rest need a process of their own (see tests/it.rs).
autotests = false

[dependencies]
image = { workspace = true }
game = { workspace = true }
bincode = { workspace = true }
crc32fast = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
lz4_flex = { workspace = true }

# The world forge's erosion step runs on all cores natively; serial on wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1"
# World files: zstd over the quantised, row-delta rasters (native only; wasm never reads one).
zstd = "0.13"

[dev-dependencies]
crossbeam = { workspace = true }
# `profiler` is load-bearing for build times: under workspace feature unification every
# test build resolves rapier3d with it and bin builds without, so tests (region
# dial 64) and the play recipes (VOXEL_REGION_BLOCKS=512) keep separate copies
# of rapier -> game -> worldgen -> server/client. Cargo fingerprints that env
# var but doesn't key artifacts on it, so one shared copy would flip-flop and
# recompile the whole chain on every `just smoke` <-> `just run` switch.
rapier3d = { workspace = true, features = ["profiler"] }

[lib]
path = "src/lib.rs"

[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "forged_world"
path = "tests/forged_world.rs"

[[test]]
name = "client_region_load_cost"
path = "tests/client_region_load_cost.rs"
