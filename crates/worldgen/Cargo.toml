[package]
name = "worldgen"
version = "0.1.0"
edition = "2024"

[dependencies]
game = { workspace = true }
bincode = { workspace = true }
crc32fast = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
lz4_flex = { workspace = true }

[dev-dependencies]
crossbeam = { workspace = true }
rapier3d = { workspace = true, features = ["profiler"] }
slotmapd = { workspace = true }
