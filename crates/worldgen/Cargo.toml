[package]
name = "worldgen"
version = "0.1.0"
edition = "2024"
# Integration tests are declared below: tests/it.rs is one binary for most
# files, the rest need a process of their own (see tests/it.rs).
autotests = false

[dependencies]
image = { workspace = true }
game = { workspace = true }
bincode = { workspace = true }
crc32fast = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
lz4_flex = { workspace = true }

[dev-dependencies]
crossbeam = { workspace = true }
rapier3d = { workspace = true, features = ["profiler"] }
slotmapd = { workspace = true }
block-mesh = { workspace = true }

[[bin]]
path = "src/main.rs"
name = "worldgen"

[lib]
path = "src/lib.rs"

[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "forged_world"
path = "tests/forged_world.rs"

[[test]]
name = "client_region_load_cost"
path = "tests/client_region_load_cost.rs"

[[test]]
name = "region_load_cost"
path = "tests/region_load_cost.rs"
