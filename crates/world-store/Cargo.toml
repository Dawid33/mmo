[package]
name = "world-store"
version = "0.1.0"
edition = "2024"
# One integration-test binary: tests/it.rs.
autotests = false

[dependencies]
game = { workspace = true }
worldgen = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
crossbeam = { workspace = true }
zstd = "0.13"
bincode = { workspace = true }
serde = { workspace = true }
log = { workspace = true }
# worldctl's log output.
simplelog = { workspace = true }
crc32fast = { workspace = true }
rayon = "1"

[dev-dependencies]
pg-test-support = { path = "../pg-test-support" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[test]]
name = "it"
path = "tests/it.rs"
