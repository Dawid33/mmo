[package]
name = "physics-next"
version = "0.1.0"
edition = "2024"
publish = false
description = "Pinning tests for the vendored rapier 0.36 / parry 0.31 forks' patches (journal, StateHash, voxels cast, KCC). Nothing in game/client/server depends on it."

[dependencies]
# The vendored fork (upstream rapier 0.36.0 / parry 0.31.1 + `// mmo-fork:` patches).
rapier3d = { path = "../rapier/crates/rapier3d", features = ["enhanced-determinism", "serde-serialize"] }
bincode = { workspace = true }
crc32fast = { workspace = true, features = ["std"] }
serde = { workspace = true }
# Task 4.4: the forks' `StateHash` (PhysicsWorld::state_hashes).
state-hash = { path = "../state-hash" }

[features]
# Only for tests/journal_parallel.rs (H7 review I1): the game never enables
# rapier's `parallel`, and the step journal refuses to run under it.
parallel = ["rapier3d/parallel"]

[dev-dependencies]
# Constants and the pure movement code (player capsule, skin, speeds, plan /
# settle): the probes measure the fork against the game's real numbers without
# restating them. The direction matters: game never depends on this crate.
game = { workspace = true }

# `tests/state_hash_wasm.rs` on wasm32 (`just determinism-wasm-next`); the
# same wasm-bindgen-test as the game's `just determinism-wasm`.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
