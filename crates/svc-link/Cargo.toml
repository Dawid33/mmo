[package]
name = "svc-link"
version = "0.1.0"
edition = "2024"
description = "Authenticated QUIC service link between processes: pinned self-signed cert, token hello, framed packets, reconnect."
# Integration tests: tests/it.rs, plus dial_log (its own process-global logger).
autotests = false

[dependencies]
game = { workspace = true }
crossbeam = { workspace = true }
log = { workspace = true }
serde = { workspace = true, features = ["std"] }
quinn = { workspace = true }
tokio = { workspace = true, features = ["time", "sync", "macros"] }
rcgen = { workspace = true }
sha2 = { workspace = true }

[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "dial_log"
path = "tests/dial_log.rs"
