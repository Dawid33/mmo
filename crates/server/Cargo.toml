[package]
name = "server"
version = "0.1.0"
edition = "2021"
# Integration tests are listed below: `it` (tests/it.rs) holds the files that
# need no process of their own.
autotests = false

[lib]
name = "server"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
game = { workspace = true }
worldgen = { workspace = true }
crossbeam = { workspace = true }
simplelog = { workspace = true }
log = { workspace = true }
quinn = { workspace = true }
tokio = { workspace = true, features = ["macros", "time", "signal"] }
lz4_flex = { workspace = true }
rcgen = { workspace = true }
dashmap = { workspace = true }
wtransport = { workspace = true }
# The world store (regions, players, history, world tick): SQLite or Postgres.
world-store = { path = "../world-store" }
# The service link to the world coordinator (`VOXEL_ROLE=host|coordinator`).
svc-link = { path = "../svc-link" }
# Login JWTs at the edge (`VOXEL_AUTH=jwt`): the verifier and the JWKS fetch.
auth = { workspace = true }
login-api = { workspace = true }
reqwest = { workspace = true }
pyroscope = { workspace = true, optional = true }
pyroscope_pprofrs = { workspace = true, optional = true }

[features]
# Push CPU profiles to a local Pyroscope (`just profile-server`); gated so
# normal builds don't pull the agent in. Runtime-activated by the PYROSCOPE env.
pyroscope = ["dep:pyroscope", "dep:pyroscope_pprofrs"]
# The coordinator's test hooks (`CoordinatorThread::{inspect, with_core, crash_before_claim_reply}`):
# off in production builds; the `roles` and `coordinator_rt` tests need them (`required-features`).
test-hooks = []

[dev-dependencies]
game = { workspace = true }
worldgen = { workspace = true }
crossbeam = { workspace = true }
dashmap = { workspace = true }
bincode = { workspace = true }
tokio = { workspace = true, features = ["macros", "time"] }
wtransport = { workspace = true, features = ["dangerous-configuration"] }
pg-test-support = { path = "../pg-test-support" }
# Raw SQL on a closed store (damaging a tile row in `store_world`).
sqlx = { workspace = true }
# JWKS bodies in the auth edge tests.
serde_json = { workspace = true }
# Hand-made JWT headers in the auth edge tests.
base64 = { workspace = true }
# The login service's own kick queue and host links, end to end in `login_link`.
login = { workspace = true }

[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "coordinator_rt"
path = "tests/coordinator_rt.rs"
required-features = ["test-hooks"]

[[test]]
name = "hosts"
path = "tests/hosts.rs"
required-features = ["test-hooks"]

[[test]]
name = "login_link"
path = "tests/login_link.rs"

[[test]]
name = "player_store"
path = "tests/player_store.rs"

[[test]]
name = "roles"
path = "tests/roles.rs"
required-features = ["test-hooks"]

[[test]]
name = "store_world"
path = "tests/store_world.rs"

[[test]]
name = "threaded_world"
path = "tests/threaded_world.rs"

[[test]]
name = "webtransport_handshake"
path = "tests/webtransport_handshake.rs"
