[package]
name = "server"
version = "0.1.0"
edition = "2021"
# Integration tests are listed below: `it` (tests/it.rs) holds the files that
# need no process of their own.
autotests = false

[lib]
name = "server"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
game = { workspace = true }
worldgen = { workspace = true }
crossbeam = { workspace = true }
simplelog = { workspace = true }
log = { workspace = true }
observability = { workspace = true }
tracing = { workspace = true }
quinn = { workspace = true }
tokio = { workspace = true, features = ["macros", "time", "signal", "net", "sync", "rt"] }
lz4_flex = { workspace = true }
dashmap = { workspace = true }
wtransport = { workspace = true }
# The world store (regions, players, history, world tick): SQLite or Postgres.
world-store = { path = "../world-store" }
# The world map's tile reader, served by `map_api.rs`.
map-tiles = { path = "../map-tiles" }
# The service link to the world coordinator (`VOXEL_ROLE=host|coordinator`).
svc-link = { path = "../svc-link" }
# Login JWTs at the edge (`VOXEL_AUTH=jwt`): the verifier and the JWKS fetch.
auth = { workspace = true }
login-api = { workspace = true }
# The host's link to the coordinator's HTTP API (`world_http.rs`) speaks HTTP/2 only.
reqwest = { workspace = true, features = ["http2"] }
# The fleet reconciler (`VOXEL_ROLE=fleet`, `fleet.rs`): the Kubernetes API, the host template
# (JSON) and its hash.
kube-api = { path = "../kube-api" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# The health and metrics endpoint (`VOXEL_HEALTH_BIND`, `health.rs`).
axum = { workspace = true }
prometheus = { workspace = true }
# The coordinator's HTTP API (`coordinator_api.rs`): HTTPS over HTTP/2, rustls with ring only
# (aws-lc-rs stays out of the tree: tokio-rustls' defaults would pull it).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
hyper = { version = "1", features = ["http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }

[features]
# Push CPU profiles to a local Pyroscope (`just profile-server`); gated so
# normal builds don't pull the agent in. Runtime-activated by the PYROSCOPE env.
pyroscope = ["observability/pyroscope"]
# The coordinator's test hooks (`CoordinatorThread::{inspect, with_core}` and its `hold_*` hooks):
# off in production builds; the `roles` and `coordinator_rt` tests need them (`required-features`).
test-hooks = []

[dev-dependencies]
game = { workspace = true }
worldgen = { workspace = true }
crossbeam = { workspace = true }
tokio = { workspace = true, features = ["macros", "time"] }
pg-test-support = { path = "../pg-test-support" }
# Raw SQL on the takeover rig's store.
sqlx = { workspace = true }

[[test]]
name = "takeover"
path = "tests/takeover.rs"
required-features = ["test-hooks"]

