[package]
name = "game"
version = "0.1.0"
edition = "2021"
# Integration tests are declared below: tests/it.rs is one binary for most
# files, the rest need a process of their own (see tests/it.rs).
autotests = false

[dependencies]
slotmapd = { workspace = true }
macros = { workspace = true }
log = { workspace = true }
bincode = { workspace = true }
lz4_flex = { workspace = true }
crossbeam = { workspace = true }
serde = { workspace = true }
ron = "0.12"
borrow = { workspace = true }
derive_more = { workspace = true }
crc32fast = { workspace = true }
grid = { workspace = true }
block-mesh = { workspace = true }
assert-json-diff = { workspace = true }
serde_json = { workspace = true }
num-traits = { workspace = true }
# StateHash (plan D2): the rollback hash; replaces std Hash over OrderedFloat.
state-hash = { workspace = true, features = ["derive", "glamx"] }
glamx = { workspace = true }
# D3: the few game floats that need a total order use f32::total_cmp; libm
# keeps the camera's trig identical on native and wasm32.
libm = "0.2"
oorandom = { workspace = true }
# Sim-owned animation (`anim.rs`): rigs parsed without textures. A path dep,
# not `workspace = true`, so default features (PNG decoding) stay off here.
bbmodel = { path = "../bbmodel", default-features = false }
parry3d = { workspace = true }
rapier3d = { workspace = true }

[dev-dependencies]
crc32fast = { workspace = true }

# `tests/wasm_determinism.rs` on wasm32 (`just determinism-wasm`). Its
# wasm-bindgen must stay the version Cargo.lock already has for the client.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "wasm_determinism"
path = "tests/wasm_determinism.rs"

[[test]]
name = "hash_mode"
path = "tests/hash_mode.rs"

[[test]]
name = "state_hash_check"
path = "tests/state_hash_check.rs"
