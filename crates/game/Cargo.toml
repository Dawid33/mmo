[package]
name = "game"
version = "0.1.0"
edition = "2021"

[dependencies]
log = "0.4.22"
bincode = "1.3.3"
rapier3d = { version = "0.22.0", features = [ "enhanced-determinism", "serde-serialize"] }
crossbeam = "0.8.4"
serde = "1.0.216"
parley = "0.5.0"
taffy = { version = "0.8.3", features = ["serde"] }
bytemuck = "1.23.2"
winit = { version = "0.30.12", features = ["serde"] }
slotmap = { version = "1.0.7", features = ["serde"] }
rollback = { path = "../rollback" }
borrow = "1.3.0"
derive_more = { version = "2.0.1", features = ["full"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rapier3d = { version = "0.22.0", features = [ "enhanced-determinism", "wasm-bindgen", "serde-serialize" ] }


