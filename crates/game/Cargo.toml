[package]
name = "game"
version = "0.1.0"
edition = "2021"

[dependencies]
slotmapd = { path = "../slotmapd", features = ["serde"] }
rollback = { path = "../rollback" }
log = { workspace = true }
bincode = { workspace = true }
crossbeam = { workspace = true }
serde = { workspace = true }
parley = { workspace = true }
bytemuck = { workspace = true }
winit = { workspace = true }
borrow = { workspace = true }
derive_more = { workspace = true }
wgpu = { workspace = true }
crc32fast = { workspace = true }
arrayvec = { workspace = true }
grid = { workspace = true }
block-mesh = { workspace = true }
vec_map = { version = "0.8", optional = true }
web-time = { version = "1.1", optional = true }
num-traits = "0.2"
nalgebra = "0.34"
parry3d = "0.25.1"
simba = "0.9.1"
approx = "0.5"
rayon = { version = "1", optional = true }
bit-vec = "0.8"
rustc-hash = "2"
downcast-rs = "2"
num-derive = "0.4"
bitflags = "2"
ordered-float = "5"
thiserror = "2"
profiling = "1.0"
static_assertions = "1"
serde_arrays = "0.2.0"
either = { version = "1", default-features = false }
slab = { version = "0.4", optional = true }
indexmap = { version = "2", features = ["serde"], optional = true }
hashbrown = { version = "0.16", optional = true, default-features = false, features = [
    "default-hasher",
] }
spade = { version = "2.9", default-features = false }
rstar = "0.12.0"
obj = { version = "0.10.2", optional = true }
ena = { version = "0.14.3", optional = true, default-features = false }
smallvec = "1"
foldhash = { version = "0.2", default-features = false }
encase = { version = "0.12"}


[dev-dependencies]
serde_json = "1.0.93"

[features]
default = [
  "taffy_tree",
  "flexbox",
  "grid",
  "std",
  "serde",
  "block_layout",
  "calc",
  "content_size",
  "detailed_layout_info",
  "enhanced-determinism",
  "serde-serialize",
  "dim3",
  "f32",
  "alloc",
  "spade",
  "encase"
]
dim2 = []
f64 = []
debug-disable-legitimate-fe-exceptions = []
dev-remove-slow-accessors = []
rkyv = []
dim3 = []
f32 = []
parallel = ["dep:rayon"]
simd-stable = ["parry3d/simd-stable", "simba/wide", "simd-is-enabled"]
simd-nightly = [
  "parry3d/simd-nightly",
  "simba/portable_simd",
  "simd-is-enabled",
]
# Do not enable this feature directly. It is automatically
# enabled with the "simd-stable" or "simd-nightly" feature.
simd-is-enabled = ["dep:vec_map"]
serde-serialize = [
  "nalgebra/serde-serialize",
  "parry3d/serde-serialize",
  "bit-vec/serde",
  "bitflags/serde",
]

rkyv-serialize = []
bytemuck-serialize = ["bytemuck", "nalgebra/convert-bytemuck"]
bytemuck = []

enhanced-determinism = ["simba/libm_force", "indexmap"]
# Adds `TriMesh:to_obj_file` function.
wavefront = ["obj"]
alloc = ["nalgebra/alloc"]
spade = ["alloc"]
improved_fixed_point_support = []
encase = ["nalgebra/encase"]

debug-render = []
profiler = ["dep:web-time"]
debug = []
profile = []
serde = []
std = [
  "nalgebra/std",
  "slab",
  "simba/std",
  "arrayvec/std",
  "thiserror/std",
  "ena",
]
block_layout = []
flexbox = []
grid = []
calc = []
content_size = []
detailed_layout_info = []
strict_provenance = []
taffy_tree = []
