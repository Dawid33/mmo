[package]
name = "login"
version = "0.1.0"
edition = "2024"
description = "The login service: accounts, refresh tokens, the world registry (SQLite / Postgres)."
# One integration-test binary: tests/it.rs.
autotests = false

[dependencies]
login-api = { workspace = true }
sqlx = { workspace = true }
thiserror = "2"
log = { workspace = true }
observability = { workspace = true }
tracing = { workspace = true }
auth = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
# The worlds' coordinator APIs (`host_link.rs`): the pinned HTTPS client, the service token,
# the link protocol version; `game` for the wire's packet framing (`encode_packet`).
svc-link = { path = "../svc-link" }
game = { workspace = true }
crossbeam = { workspace = true }
serde = { workspace = true, features = ["std"] }
rand_core = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
jsonwebtoken = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["http2"] }
prometheus = { workspace = true }

[features]
pyroscope = ["observability/pyroscope"]
