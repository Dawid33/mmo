[package]
name = "login"
version = "0.1.0"
edition = "2024"
description = "The login service: accounts, refresh tokens, the world registry (SQLite / Postgres)."
# One integration-test binary: tests/it.rs.
autotests = false

[dependencies]
login-api = { workspace = true }
sqlx = { workspace = true }
thiserror = "2"
log = { workspace = true }
auth = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
# The service link to world hosts (`SpawnPlayer` / `Kick`; crate `host_link`).
svc-link = { path = "../svc-link" }
crossbeam = { workspace = true }
serde = { workspace = true, features = ["std"] }
rand_core = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
simplelog = { workspace = true }
jsonwebtoken = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
prometheus = { workspace = true }

[dev-dependencies]
pg-test-support = { path = "../pg-test-support" }
tower = { workspace = true }

[[test]]
name = "it"
path = "tests/it.rs"
