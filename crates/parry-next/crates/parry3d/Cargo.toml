# mmo-fork: renamed package + self-contained manifest (upstream inherits from its
# own workspace root, which our workspace replaces). `[lib] name` stays
# `parry3d`, so source paths need no edits. Upstream's examples and their
# kiss3d dev-dependency are dropped (graphics stack, never run here), and so
# are the unused ptree / rand_isaac dev-dependencies.
[package]
name = "parry3d-next"
version = "0.31.1"
authors = ["Sébastien Crozet <developer@crozet.re>"]
description = "3 dimensional collision detection library in Rust."
documentation = "https://parry.rs/docs"
homepage = "https://parry.rs"
repository = "https://github.com/dimforge/parry"
readme = "../../README.md"
keywords = ["collision", "geometry", "distance", "ray", "convex"]
categories = ["science", "game-development", "mathematics", "wasm"]
license = "Apache-2.0"
edition = "2021"
publish = false
autoexamples = false
autobenches = false

[badges]
maintenance = { status = "actively-developed" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("dim2", "dim3", "f32", "f64"))',
    # "wavefront" is only used for 3D crates.
    'cfg(feature, values("wavefront"))',
    # "encase" is only used in f32 crates.
    'cfg(feature, values("encase"))',
    'cfg(target_arch, values("spirv"))',
] }

[lints.clippy]
alloc_instead_of_core = "warn"
std_instead_of_alloc = "warn"
std_instead_of_core = "warn"

[features]
default = ["required-features", "std", "spade"]
required-features = ["dim3", "f32"]
std = [
    "glamx/std",
    "slab",
    "simba/std",
    "arrayvec/std",
    "spade?/std",
    "thiserror/std",
    "ena",
]
dim3 = []
f32 = []
serde-serialize = [
    "serde",
    "serde_arrays",
    "glamx/serde",
    "bitflags/serde",
    "hashbrown?/serde",
    "spade?/serde",
]
rkyv = ["dep:rkyv", "glamx/rkyv"]
bytemuck-serialize = ["bytemuck", "glamx/bytemuck"]

# Widens SIMD from 4 to 8 lanes (f32 only). Needs an AVX-enabled target to
# emit 256-bit code.
simd8 = []
enhanced-determinism = ["simba/libm_force", "indexmap", "glamx/libm", "glamx/scalar-math"]
parallel = ["rayon"]
# Adds `TriMesh:to_obj_file` function.
wavefront = ["obj"]
alloc = ["hashbrown", "smallvec", "downcast-rs", "rstar", "glamx/approx"]
spade = ["dep:spade", "alloc"]
improved_fixed_point_support = []
encase = [ "dep:encase", "glamx/encase" ]

[lib]
name = "parry3d"
path = "../../src/lib.rs"
required-features = ["required-features"]

[dependencies]
either = { version = "1", default-features = false }
bitflags = "2.3"
downcast-rs = { version = "2", default-features = false, features = ["sync"], optional = true }
num-traits = { version = "0.2", default-features = false }
slab = { version = "0.4", optional = true }
arrayvec = { version = "0.7", default-features = false }
simba = { version = "0.10.1", default-features = false, features = ["wide"] }
glamx = { version = "0.3", default-features = false, features = ["nostd-libm", "i32"] } # , "approx"] }
approx = { version = "0.5", default-features = false }
serde = { version = "1.0", features = ["derive", "rc"], optional = true }
serde_arrays = { version = "0.2", optional = true }
rkyv = { version = "0.8", default-features = false, features = ["bytecheck", "alloc"], optional = true }
num-derive = "0.5"
indexmap = { version = "2", features = ["serde"], optional = true }
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher"], optional = true }
spade = { version = "2.15", default-features = false, optional = true }
rayon = { version = "1", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
log = "0.4"
ordered-float = { version = "5", default-features = false }
thiserror = { version = "2", default-features = false }
rstar = { version = "0.13.0", optional = true }
obj = { version = "0.10.2", optional = true }
ena = { version = "0.14.3", default-features = false, optional = true }
smallvec = { version = "1", optional = true }
static_assertions = "1"
foldhash = { version = "0.2", default-features = false }
encase = { version = "0.12", optional = true }

[dev-dependencies]
oorandom = "11"
rand = "0.10"
web-time = "1"
