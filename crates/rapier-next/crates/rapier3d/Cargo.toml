# mmo-fork: renamed package + self-contained manifest (upstream inherits from its
# own workspace root, which our workspace replaces). `[lib] name` stays
# `rapier3d`, so source paths need no edits. Nothing in game/client/server
# depends on this crate until the Phase 5 switch.
[package]
name = "rapier3d-next"
version = "0.36.0"
authors = ["Sébastien Crozet <sebcrozet@dimforge.com>"]
description = "3-dimensional physics engine in Rust."
documentation = "https://docs.rs/rapier3d"
homepage = "https://rapier.rs"
repository = "https://github.com/dimforge/rapier"
readme = "../../README.md"
categories = ["science", "game-development", "mathematics", "simulation", "wasm"]
keywords = ["physics", "dynamics", "rigid", "real-time", "impulse_joints"]
license = "Apache-2.0"
rust-version = "1.86"
edition = "2024"
publish = false
autoexamples = false

[badges]
maintenance = { status = "actively-developed" }

[lints]
clippy = { needless_lifetimes = "allow" }
rust.unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("dim2", "f64", "std", "alloc", "bytemuck"))',
    'cfg(target_arch, values("spirv"))',
] }

[features]
default = ["dim3", "f32", "std"] # , "block-solver"]
dim3 = []
f32 = []
# Enables the 2x2 block solver for contact manifolds (couples the two normal
# constraints of a contact pair into a single 2x2 MLCP solve). Disabling it
# also removes the extra per-contact `r_mat_elts` field from the solver's
# normal-constraint struct. NOT enabled by default in 3D: it introduces jitter
# in the 3D domino demo. Exposed as an opt-in for experimentation.
block-solver = []
alloc = [
    "nalgebra/alloc",
    "parry3d/alloc",
    "serde?/alloc",
]
std = [
    "alloc",
    "parry3d/std",
    "nalgebra/std",
    "simba/std",
    "num-traits/std",
    "approx/std",
    "thiserror/std",
    "wide/std",
    "serde?/std",
]
# Adds an alternative FEM solver for soft bodies, selected per body with
# `SoftBodyBuilder::solver(SoftBodySolver::Fem)`. Instead of resolving elasticity
# as sequential impulse rows, the FEM path assembles the element forces and
# tangent stiffness of a strain-energy density and takes one implicit Euler step
# per substep, solving `(M + h D + h^2 K) dv = b` over the whole body. Off by
# default: it adds per-body solver state and is still experimental.
fem = []
parallel = ["dep:rayon", "std", "parry3d/parallel"]
# Drops the `Sync` requirement from callbacks (`PhysicsHooks`, `EventHandler`).
# As a side effect, this also removes the dedicated threadpool API from the physics world
# and pipeline.
unsync-callbacks = []
# Widens the solver's SIMD from 4 to 8 lanes (f32 only), replacing the default
# 4-lane path. The compiler only emits real 256-bit AVX instructions on an
# AVX-enabled target (`RUSTFLAGS="-C target-feature=+avx2,+fma"` or
# `-C target-cpu=native`); otherwise it runs (correctly) as two 128-bit halves.
simd8 = ["parry3d/simd8"]
serde-serialize = [
    "arrayvec/serde",
    "nalgebra/serde-serialize",
    "parry3d/serde-serialize",
    "dep:serde",
    "std",
]
enhanced-determinism = ["simba/libm_force", "parry3d/enhanced-determinism"]
debug-render = []
profiler = ["dep:web-time"] # Enables the internal profiler.
bytemuck = ["dep:bytemuck"]

# Feature used for debugging only.
debug-disable-legitimate-fe-exceptions = []

# Feature used for development and debugging only.
# Do not enable this unless you are working on the engine internals.
dev-remove-slow-accessors = []

# Opt-in bounds checks on the solver's otherwise-unchecked SIMD body gathers
# (`SolverBodies::gather_*` use `get_unchecked`). Validates the per-constraint
# solver-body ids once at constraint generation — off the per-iteration solve
# loop — so a stale id from a solver-graph maintenance bug becomes a clean
# panic instead of an out-of-bounds gather (UB / segfault in the SIMD build).
# Cheap but non-zero; off by default.
solver-bounds-checks = []

[package.metadata.docs.rs]
features = ["parallel", "serde-serialize", "debug-render"]

[lib]
name = "rapier3d"
path = "../../src/lib.rs"
required-features = ["dim3", "f32"]

[dependencies]
glamx = { version = "0.3.1", default-features = false }
# mmo-fork: the vendored parry-next, under its upstream lib name.
# mmo-fork: StateHash — zero-copy canonical state hashing (plan D2).
state-hash = { path = "../../../state-hash", features = ["glamx", "nalgebra"] }
parry3d = { package = "parry3d-next", path = "../../../parry-next/crates/parry3d", default-features = false, features = ["required-features"] }
simba = { version = "0.10.2", default-features = false, features = ["wide"] }
num-traits = { version = "0.2", default-features = false }
approx = { version = "0.5", default-features = false }
arrayvec = { version = "0.7", default-features = false }
bitflags = "2"
log = "0.4"
thiserror = { version = "2", default-features = false }
profiling = "1.0"
static_assertions = "1"
wide = { version = "1", default-features = false }
web-time = { version = "1.1", optional = true }
rayon = { version = "1", optional = true }
serde = { version = "1", default-features = false, features = ["derive"], optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }

# Nalgebra is only included on non-spirv targets. On spirv, rapier exposes only the
# subset of its API that doesn't require nalgebra.
[target.'cfg(not(target_arch = "spirv"))'.dependencies]
nalgebra = { version = "0.35", default-features = false, features = ["macros"] }
glamx = { version = "0.3.1", default-features = false, features = ["nalgebra"] }

[dev-dependencies]
bincode = "1"
serde_json = "1"
serde = { version = "1", default-features = false, features = ["derive", "std"] }
oorandom = { version = "11", default-features = false }
