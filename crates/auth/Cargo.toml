[package]
name = "auth"
version = "0.1.0"
edition = "2024"
description = "EdDSA join JWTs: signing keys, the signer, JWKS and the hosts' verifier."
# One integration-test binary: tests/it.rs.
autotests = false

[dependencies]
login-api = { workspace = true }
serde = { workspace = true, features = ["std"] }
jsonwebtoken = { workspace = true }
ed25519-dalek = { workspace = true }
rand_core = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
