[workspace]
resolver = "2"
members = ["crates/quest-vm", "crates/quest-stub", "crates/quest-lang", "crates/quest-cli", "crates/quest-corpus"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
libm = "0.2"
logos = "0.16"
lalrpop = "0.23"
lalrpop-util = { version = "0.23", default-features = false }
state-hash = { path = "../crates/state-hash", default-features = false }
proptest = "1"
wasm-bindgen-test = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
opt-level = 1
