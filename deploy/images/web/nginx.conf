# Template: the image's entrypoint runs envsubst over it (only variables that are
# set in the environment; nginx's own $variables are left alone) into
# /etc/nginx/conf.d/default.conf. ${NGINX_LOCAL_RESOLVERS} is the pod's DNS server
# from /etc/resolv.conf, exported by the entrypoint's 15-local-resolvers.envsh
# (the Dockerfile sets NGINX_ENTRYPOINT_LOCAL_RESOLVERS).
server {
    listen 8080;
    root /usr/share/nginx/html;

    # The login upstream is a variable, so its name is resolved at request time (cached
    # for `valid`), not once at start: a recreated login Service (a new cluster IP) is
    # found without restarting this pod. The resolver uses no search domains:
    # LOGIN_UPSTREAM must be a full name (login.login.svc.cluster.local).
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
    set $login_upstream ${LOGIN_UPSTREAM};

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The login service, only what its own Ingress publishes (deploy/modules/login: the
    # API under /v1/ and the key set; never /healthz or /metrics), with the /login prefix
    # stripped. A proxy_pass with a variable sends the URI as it stands, hence the
    # rewrite (the query string is kept).
    location /login/v1/ {
        rewrite ^/login(/v1/.*)$ $1 break;
        proxy_pass $login_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /login/.well-known/jwks.json {
        rewrite ^ /.well-known/jwks.json break;
        proxy_pass $login_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Anything else under /login/ is not the login service's to answer here.
    location /login/ {
        return 404;
    }

    # The page polls api/version to reload open tabs after a redeploy: neither it
    # nor the page may be served from a cache.
    location = /api/version {
        default_type text/plain;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # mime.types already maps wasm; stated here so a base-image change cannot lose it.
    location ~ \.wasm$ {
        types { }
        default_type application/wasm;
    }
}
