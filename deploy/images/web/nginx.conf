# Template: the image's entrypoint runs envsubst over it (only variables that are
# set in the environment; nginx's own $variables are left alone) into
# /etc/nginx/conf.d/default.conf.
server {
    listen 8080;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The login service: the prefix is stripped (the trailing slash on both sides).
    location /login/ {
        proxy_pass ${LOGIN_UPSTREAM}/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # The page polls api/version to reload open tabs after a redeploy: neither it
    # nor the page may be served from a cache.
    location = /api/version {
        default_type text/plain;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # mime.types already maps wasm; stated here so a base-image change cannot lose it.
    location ~ \.wasm$ {
        types { }
        default_type application/wasm;
    }
}
