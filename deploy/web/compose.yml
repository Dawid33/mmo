# The deployed game (`just deploy`, scripts/deploy_push.sh), compose project
# `mmo` in /srv/mmo on the game box. Two containers, no image of our own:
#   server  the release `server` binary (bind-mounted from /srv/mmo/bin) in a
#           stock Debian image: QUIC on 6466/udp, WebTransport on 6467/udp, with
#           the Let's Encrypt certificate the survival-world proxy (Caddy)
#           obtains for orion.factoriosurvivalworld.com, read-only from its data
#           dir and reloaded on renewal.
#   mmo-web a Caddy file server for /srv/mmo/web (the `web-release` bundle), on
#           the survival-world compose network; the proxy's
#           orion.factoriosurvivalworld.com site reverse-proxies to it (HTTPS
#           there). Nothing published.
# The proxy, its Caddyfile, the host firewall (UDP 6466/6467) and the DNS record
# live in ~/Projects/mod/mods/survival-world (deploy/, infra/).
name: mmo

x-logging: &logging
  driver: json-file
  options:
    max-size: 50m
    max-file: "5"

services:
  server:
    image: debian:trixie-slim
    command: ["/srv/mmo/bin/server"]
    working_dir: /srv/mmo
    restart: unless-stopped
    logging: *logging
    # The orderly exit parks and saves every region before it quits.
    stop_signal: SIGTERM
    stop_grace_period: 90s
    init: true
    ports:
      - "6466:6466/udp"
      - "6467:6467/udp"
    environment:
      VOXEL_BIND_ADDR: 0.0.0.0
      VOXEL_WORLD_FILE: /srv/mmo/worlds/default.world
      VOXEL_WT_CERT: /caddy/certificates/acme-v02.api.letsencrypt.org-directory/orion.factoriosurvivalworld.com/orion.factoriosurvivalworld.com.crt
      VOXEL_WT_KEY: /caddy/certificates/acme-v02.api.letsencrypt.org-directory/orion.factoriosurvivalworld.com/orion.factoriosurvivalworld.com.key
      # The cache keys on the worldgen sources, which are not on the box.
      WORLDGEN_CACHE: "off"
      RUST_BACKTRACE: "1"
    volumes:
      - /srv/mmo/bin:/srv/mmo/bin:ro
      - /srv/mmo/worlds:/srv/mmo/worlds
      - /srv/survival-world/caddy/data/caddy:/caddy:ro

  # NOT `web`: the survival-world stack's own website is `web` on the same
  # network, and the proxy resolves services by name.
  mmo-web:
    image: caddy:2.10-alpine
    command: ["caddy", "file-server", "--root", "/srv/mmo/web", "--listen", ":8080"]
    restart: unless-stopped
    logging: *logging
    # /srv/mmo whole, so the web -> releases/<rev> symlink resolves.
    volumes:
      - /srv/mmo:/srv/mmo:ro
    networks: [survival-world]

networks:
  survival-world:
    name: survival-world_default
    external: true
