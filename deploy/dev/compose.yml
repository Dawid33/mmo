# Dev services: Postgres for the world store (`just pg-up`) and Keycloak for player
# accounts (`just kc-up`, which also starts its mail catcher, mailpit). Separate from
# deploy/web/compose.yml, which is the game box.
# Nothing here is production: fixed dev credentials, bound to localhost only.
name: mmo-dev

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    # Two-phase save cuts (R3): each host's part is a prepared transaction.
    command: ["postgres", "-c", "max_prepared_transactions=64"]
    environment:
      POSTGRES_USER: mmo
      POSTGRES_PASSWORD: mmo
      POSTGRES_DB: mmo
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - mmo-dev-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmo -d mmo"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Dev identity provider: realm `players` imported from keycloak/players-realm.json at
  # every start. No data volume: `just kc-down` removes the container, so the next
  # `just kc-up` imports the file again (--import-realm skips a realm that exists).
  # Like production the realm verifies email; its mail goes to mailpit below.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    depends_on:
      mailpit:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      # The login theme's brand link (theme.properties: siteUrl=${env.ORION_SITE_URL}).
      ORION_SITE_URL: http://127.0.0.1:8182
    ports:
      - "127.0.0.1:8181:8080"
    volumes:
      - ./keycloak/players-realm.json:/opt/keycloak/data/import/players-realm.json:ro
      # start-dev caches no themes: edits under website/theme/orion show on reload.
      - ../../website/theme/orion:/opt/keycloak/themes/orion:ro
    healthcheck:
      # The image has no curl: ask the management port (9000) by hand.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 2s
      timeout: 3s
      start_period: 120s
      retries: 60

  # Mail catcher for Keycloak (realm smtpServer: mailpit:1025, inside this network only).
  # Every mail it sends (email verification, password reset) is kept in memory and shown at
  # http://127.0.0.1:8025 (web UI; JSON API under /api/v1). Removed by `just kc-down`.
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  mmo-dev-pg:
