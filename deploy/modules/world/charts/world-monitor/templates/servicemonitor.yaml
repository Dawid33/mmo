{{- if .Values.metrics }}
# The coordinator, every host and the fleet reconciler serve /metrics on their port
# `health` (9100). Each pod is its own target (the ServiceMonitor scrapes the endpoints behind each
# Service, headless or not: hosts and fleet are headless; coordinator is a ClusterIP Service since
# the coordinator HTTP API, still headless in a world created before it until replaced).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: world
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      {{- toYaml .Values.selectorLabels | nindent 6 }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [coordinator, host, fleet]
  endpoints:
    - port: health
      path: /metrics
      interval: 15s
{{- end }}
