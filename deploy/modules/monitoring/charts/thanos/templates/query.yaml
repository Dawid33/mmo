apiVersion: apps/v1
kind: Deployment
metadata:
  name: thanos-query
  labels:
    {{- include "thanos.labels" . | nindent 4 }}
    app.kubernetes.io/component: query
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos
      app.kubernetes.io/component: query
  template:
    metadata:
      labels:
        {{- include "thanos.labels" . | nindent 8 }}
        app.kubernetes.io/component: query
    spec:
      {{- include "thanos.securityContext" . | nindent 6 }}
      containers:
        - name: query
          image: {{ .Values.image }}
          args:
            - query
            - --log.level=info
            - --http-address=0.0.0.0:10902
            - --grpc-address=0.0.0.0:10901
            - --query.replica-label={{ .Values.replicaLabel }}
            - --endpoint=dnssrv+_grpc._tcp.{{ .Values.sidecarService }}.{{ .Release.Namespace }}.svc.cluster.local
            - --endpoint=dnssrv+_grpc._tcp.thanos-store.{{ .Release.Namespace }}.svc.cluster.local
          ports:
            - { name: http, containerPort: 10902 }
            - { name: grpc, containerPort: 10901 }
          {{- include "thanos.probes" . | nindent 10 }}
          resources:
            {{- toYaml .Values.query.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: thanos-query
  labels:
    {{- include "thanos.labels" . | nindent 4 }}
    app.kubernetes.io/component: query
spec:
  selector:
    app.kubernetes.io/name: thanos
    app.kubernetes.io/component: query
  ports:
    - { name: http, port: 10902, targetPort: http }
    - { name: grpc, port: 10901, targetPort: grpc }
