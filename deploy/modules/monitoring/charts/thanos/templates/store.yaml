apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: thanos-store
  labels:
    {{- include "thanos.labels" . | nindent 4 }}
    app.kubernetes.io/component: store
spec:
  replicas: 1
  serviceName: thanos-store
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos
      app.kubernetes.io/component: store
  template:
    metadata:
      labels:
        {{- include "thanos.labels" . | nindent 8 }}
        app.kubernetes.io/component: store
      annotations:
        # The objstore Secret is read once, at start: a changed store restarts the pod.
        checksum/objstore: {{ .Values.objstoreChecksum | quote }}
    spec:
      {{- include "thanos.securityContext" . | nindent 6 }}
      containers:
        - name: store
          image: {{ .Values.image }}
          args:
            - store
            - --log.level=info
            - --data-dir=/var/thanos/store
            - --objstore.config-file=/etc/thanos/objstore.yml
            - --http-address=0.0.0.0:10902
            - --grpc-address=0.0.0.0:10901
            - --index-cache-size={{ .Values.store.indexCacheSize }}
          ports:
            - { name: http, containerPort: 10902 }
            - { name: grpc, containerPort: 10901 }
          {{- include "thanos.probes" . | nindent 10 }}
          resources:
            {{- toYaml .Values.store.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /var/thanos/store }
            {{- include "thanos.objstoreMount" . | nindent 12 }}
      volumes:
        {{- include "thanos.objstoreVolume" . | nindent 8 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: {{ .Values.storageClass }}
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.store.size }}
---
# Headless: Query finds the store gateway through its SRV record.
apiVersion: v1
kind: Service
metadata:
  name: thanos-store
  labels:
    {{- include "thanos.labels" . | nindent 4 }}
    app.kubernetes.io/component: store
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: thanos
    app.kubernetes.io/component: store
  ports:
    - { name: http, port: 10902, targetPort: http }
    - { name: grpc, port: 10901, targetPort: grpc }
