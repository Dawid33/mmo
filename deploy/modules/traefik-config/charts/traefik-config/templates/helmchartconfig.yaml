# k3s merges this into its own `traefik` HelmChart (kube-system) and rolls Traefik.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    additionalArguments:
    {{- range .Values.arguments }}
      - {{ . | quote }}
    {{- end }}
