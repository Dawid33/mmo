[workspace]
resolver = "2"
exclude = ["quest"]
members = [
  "crates/bbmodel",
  "crates/client",
  "crates/game",
  "crates/login-api",
  "crates/login",
  "crates/auth",
  "crates/macros",
  "crates/mc-import",
  "crates/pg-test-support",
  "crates/physics-next",
  "crates/server",
  "crates/slint-ui",
  "crates/slint-ui-frontend",
  "crates/slint-ui-game",
  "crates/slint-ui-tools",
  "crates/state-hash",
  "crates/state-hash-derive",
  "crates/svc-link",
  "crates/world-store",
  "crates/worldgen",
  "tools/mc-import",
  "tools/prefab-tool",
]

[profile.dev]
opt-level = 1
# Full debug info (line tables + variables) so perf/hotspot/pyroscope resolve
# symbols and inlined frames in dev builds. Cargo's dev default is already
# `true`; pinned explicitly so a profiled dev build is always navigable.
debug = "full"
# Keep DWARF in per-object .dwo files instead of copying it into every linked
# executable — this workspace links ~25 test/example binaries per dev build,
# and each used to carry its own full copy. gdb, perf and backtraces read the
# .dwo files in place. (Linux/macOS; `profiling` stays packed for perf tools.)
split-debuginfo = "unpacked"

# Enable a large amount of optimization in the dev profile for dependencies.
# Dependencies keep line tables only (symbols, file:line, inlined frames — what
# perf / pyroscope / backtraces need) but no variable info: full debuginfo on
# Bevy/wgpu/rapier at opt-level 3 was most of target/debug.
[profile.dev.package."*"]
opt-level = 3
debug = "line-tables-only"

# slint-ui-game / -frontend / -tools are the Slint compiler's GENERATED Rust
# (crates/slint-ui/build_common.rs): its incremental cache was ~2-3 GB per build kind (lib, tests, check,
# clippy — 11 GB measured 2026-10-31) and buys little, since the generated
# file is re-emitted wholesale. Line tables are enough to profile it.
#
# opt-level 0: the generated file was ~27 MB of Rust (one crate, before the split
# and the 2026-11-02 codegen cuts — now ~4–6 MB per crate), and at opt-level 1 LLVM
# (local ThinLTO + passes over 16 CGUs) took ~284 of its ~360 s compile — paid
# on EVERY .slint edit. At 0 it compiles in ~62 s (measured 2026-11-01). Only
# the generated binding glue loses optimisation; Slint's software renderer is
# its own crate and stays at opt-level 3. Release builds are unaffected.
[profile.dev.package.slint-ui-game]
debug = "line-tables-only"
incremental = false
opt-level = 0
rustflags = ["-Zthreads=8"]

# The other two Slint-generated crates (same reasons as slint-ui-game above).
[profile.dev.package.slint-ui-frontend]
debug = "line-tables-only"
incremental = false
opt-level = 0
rustflags = ["-Zthreads=8"]

[profile.dev.package.slint-ui-tools]
debug = "line-tables-only"
incremental = false
opt-level = 0
rustflags = ["-Zthreads=8"]

# No local ThinLTO for the client crate (rustflags here need nightly cargo's
# `profile-rustflags`, enabled in .cargo/config.toml). With it, a one-line
# client edit re-optimised 242 of 256 incremental codegen units (~40 s); with
# `-Clto=off` it re-emits ~19 (~15 s), and a full client-lib build drops from
# ~59 to ~34 s (measured 2026-11-01). `lto` itself can only be set per
# profile, which would also strip it from the opt-level-3 dependencies.
[profile.dev.package.client]
rustflags = ["-Clto=off"]

# The forge pipeline (worldgen::forge) is float-heavy offline simulation; in a
# dev build the server would otherwise spend minutes forging a default world.
[profile.dev.package.worldgen]
opt-level = 3

# Optimized build that keeps full debug info — use for representative CPU
# profiles (`just perf-client` / `just perf-server` / `just profile-*`). Dev's
# opt-level 1 makes the mesher + derive_voxels hot loops ~2.5x slower than this,
# so profile here when hunting real hotspots, not in a plain debug build.
[profile.profiling]
inherits = "release"
debug = "full"

# The browser release (`just web-release`, `just deploy`). The whole rollback sim
# runs in the browser, so this is tuned for speed, not size: opt-level 3, and one
# codegen unit + fat LTO so LLVM inlines across Bevy / rapier / game (the wasm
# binary is one module either way; slower to build, ~10-20% faster to run).
# No debuginfo (it would ship to every player); names are kept so panics in the
# console still have readable frames. wasm32-unknown-unknown aborts on panic
# regardless. scripts/web_release.sh then runs wasm-opt -O3 on the output.
[profile.wasm-release]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
strip = "debuginfo"
panic = "abort"
incremental = false

[workspace.dependencies]
bevy = { version = "0.19.1", default-features = false, features = [
  "std",
  "bevy_winit",
  "bevy_window",
  "bevy_render",
  "bevy_core_pipeline",
  "bevy_anti_alias",
  "bevy_post_process",
  "bevy_pbr",
  # bevy_gizmos alone is only the API/storage layer; without _render the
  # Gizmos calls compile and run but nothing ever draws (Bevy 0.18 split).
  "bevy_gizmos",
  "bevy_gizmos_render",
  "bevy_asset",
  "bevy_log",
  # States (`AppState`, the main menu → world session machine in
  # crates/client/src/session.rs): DefaultPlugins adds StatesPlugin only with it.
  "bevy_state",
  "multi_threaded",
  "tonemapping_luts",
  "ktx2",
  "smaa_luts",
  "zstd_rust",
  "x11",
  "wayland",
] }
block-mesh = { path = "crates/block-mesh", default-features = false }
bbmodel = { path = "crates/bbmodel" }
slint-ui = { path = "crates/slint-ui" }
slint-ui-frontend = { path = "crates/slint-ui-frontend" }
slint-ui-game = { path = "crates/slint-ui-game" }
slint-ui-tools = { path = "crates/slint-ui-tools" }
# The game UI: Slint + the Factorio-style `widgets` library from the sibling
# ~/Projects/ui checkout (must sit next to this repo). Software renderer only —
# no winit/femtovg backend, so no second event loop or wgpu (see
# crates/slint-ui). `std` turns on the renderer's systemfonts text path, the
# one `~/Projects/ui`'s reftest measures.
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "renderer-software"] }
slint-build = "1.18.1"
widgets = { path = "../ui/crates/widgets" }
game = { path = "crates/game" }
macros = { path = "crates/macros" }
worldgen = { path = "crates/worldgen" }
# The world store (native only): SQLite and Postgres through sqlx. No compile-time database:
# runtime `sqlx::query()` only, `macros` is for `migrate!`.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "migrate", "macros"] }
log = { version = "0.4.22", default-features = false }
bincode = { version = "1.3.3", default-features = false }
# Wire compression for large packets (region snapshots are ~40 MiB of highly
# redundant state; lz4 packs them 43x in ~7 ms). Pure Rust, builds for wasm32;
# block API only, safe encode/decode.
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
crossbeam = { version = "0.8.4", features = [
  "std",
  "alloc",
  "crossbeam-channel",
], default-features = false }
serde = { version = "1.0.216", features = ["derive"], default-features = false }
bytemuck = { version = "1.23.2", default-features = false }
borrow = { version = "1.3.0", default-features = false }
float-derive = { version = "0.1.0", default-features = false }
derive_more = { version = "2.0.1", features = [
  "debug",
], default-features = false }
crc32fast = { version = "1.5.0", default-features = false }
simplelog = { version = "0.12.2", default-features = false }
quinn = { version = "0.11.6", features = ["rustls-ring", "runtime-tokio"], default-features = false }
tokio = { version = "1.42.0", features = [
  "rt-multi-thread",
], default-features = false }
arrayvec = { version = "0.7.6", default-features = false }
grid = { version = "1.0.0", default-features = false }
syn = { version = "2.0.106", features = ["full"] }
quote = { version = "1.0.40", default-features = false }
proc-macro2 = { version = "1.0.101", default-features = false }
linkme = { version = "0.3.33", default-features = false }
rcgen = { version = "0.14", features = [
  "crypto",
  "ring",
], default-features = false }
dashmap = { version = "6.1.0", default-features = false }
serde_json = "1.0.93"
login-api = { path = "crates/login-api" }
login = { path = "crates/login" }
auth = { path = "crates/auth" }
# The game server's JWKS fetch (crates/server, VOXEL_AUTH=jwt).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Join JWTs (EdDSA) — crates/auth.
jsonwebtoken = "9"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
webpki-roots = "1"
base64 = "0.22"
# The login service's HTTP API — crates/login.
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
# Prometheus metrics of the login service (no protobuf, no process collector).
prometheus = { version = "0.14", default-features = false }
assert-json-diff = "=2.0.2"
pyroscope = { version = "0.5.8" }
pyroscope_pprofrs = { version = "0.2.10" }
image = { version = "0.25.9", default-features = false, features = ["png"] }
spade = { version = "2.9", default-features = false, features = ["serde"] }
oorandom = "11.1.5"
ordermap = { version = "1.0.0", features = ["serde"] }
hashbrown = { version = "0.16", default-features = false, features = [
  "default-hasher",
] }
parry3d = { path = "crates/parry/crates/parry3d" }
rapier3d = { path = "crates/rapier/crates/rapier3d", features = ["enhanced-determinism", "serde-serialize", "debug-render"] }
state-hash = { path = "crates/state-hash" }
# The fork's math types (glam 0.33 via glamx), re-exported by game as `game::math`.
glamx = { version = "0.3.1", default-features = false }
slotmapd = {path = "crates/slotmapd"}
num-traits = { version = "0.2.11" }
wtransport = { version = "0.7", default-features = false, features = ["self-signed", "ring"] }
