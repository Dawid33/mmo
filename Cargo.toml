[workspace]
resolver = "2"
members = [
  "crates/client",
  "crates/game",
  "crates/macros",
  "crates/rollback",
  "crates/server",   #"crates/rusqlite"
]

[profile.wasm-release]
# Default to release profile values.
inherits = "release"
# Optimize with size in mind (also try "z", sometimes it is better).
# Slightly slows compile times, great improvements to file size and runtime performance.
opt-level = "s"
# Strip all debugging information from the binary to slightly reduce file size.
strip = "debuginfo"
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[workspace.dependencies]
block-mesh = { path = "crates/block-mesh", default-features = false }
log = { version = "0.4.22", default-features = false }
bincode = { version = "1.3.3", default-features = false }
crossbeam = {version = "0.8.4", features = ["std", "alloc", "crossbeam-channel"], default-features = false }
serde = {version = "1.0.216", default-features = false }
parley = {version = "0.5.0", features = ["std"], default-features = false }
bytemuck = {version = "1.23.2", default-features = false }
winit = { version = "0.30.12", features = [
  "serde",
  "x11",
  "rwh_06",
], default-features = false }
borrow = { version = "1.3.0", default-features = false }
float-derive = { version = "0.1.0", default-features = false }
derive_more = { version = "2.0.1", features = [
  "debug",
], default-features = false }
wgpu = { version = "26.0.1", features=["std", "vulkan"], default-features = false }
crc32fast = { version = "1.5.0", default-features = false }
simplelog = { version = "0.12.2", default-features = false }
pollster = { version = "0.4", default-features = false }
vello = { version = "0.6.0", features = ["wgpu"], default-features = false }
quinn = { version = "0.11.6", default-features = false }
tokio = { version = "1.42.0", features = [
  "rt-multi-thread",
], default-features = false }
futures-lite = { version = "2.6.1", default-features = false }
kurbo = { version = "0.12.0", default-features = false }
ndshape = { version = "0.3.0", default-features = false }
rand = { version = "0.9.2", default-features = false }
weak-table = { version = "0.3.2", features = ["std"], default-features = false }
arrayvec = { version = "0.7.6", default-features = false }
grid = { version = "1.0.0", default-features = false }
syn = { version = "2.0.106", features = ["full"] }
quote = { version = "1.0.40", default-features = false }
proc-macro2 = { version = "1.0.101", default-features = false }
linkme = { version = "0.3.33", default-features = false }
rcgen = { version = "0.13.2", features = [
  "crypto",
  "ring",
], default-features = false }
dashmap = { version = "6.1.0", default-features = false }
papaya = { version = "0.2.3", default-features = false }
