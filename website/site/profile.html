<!DOCTYPE html>
<html class="orion" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <title>Your account · Errantry</title>
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <link rel="stylesheet" href="css/site.css">
  <script type="module" src="js/app.js"></script>
</head>
<body class="page" data-page="profile">
<header class="site-header">
  <a class="brand" href="/">
    <img src="img/logo.svg" alt="" width="36" height="38">
    <span>Errantry</span>
  </a>
</header>

<main class="page-main">
  <div class="card">
    <header class="card-header">
      <h1>Your account</h1>
    </header>

    <div data-show="out" hidden>
      <p>Log in to see your Errantry account.</p>
      <div class="form-buttons">
        <button class="btn btn-primary btn-block" type="button" data-action="login">Log in</button>
      </div>
    </div>

    <div data-show="in" hidden>
      <div class="alert" role="status" data-notice hidden>
        <span class="alert-text" data-notice-text></span>
      </div>
      <dl class="account">
        <div class="account-row">
          <dt>Username</dt>
          <dd data-bind="username"></dd>
        </div>
        <div class="account-row">
          <dt>Email</dt>
          <dd><span data-bind="email"></span> <span class="badge" data-bind="verified"></span></dd>
        </div>
      </dl>
      <div class="form-buttons form-buttons-row">
        <button class="btn btn-primary" type="button" data-action="change-password">Change password</button>
        <button class="btn btn-quiet" type="button" data-action="logout">Log out</button>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <p>One Errantry account for the game and this site.</p>
</footer>
</body>
</html>
