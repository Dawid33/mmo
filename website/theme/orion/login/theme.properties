# The orion login theme: Keycloak's `base` templates (markup only, no stylesheet) dressed
# in the website's own stylesheet. css/site.css is shared with website/site (a symlink there).
parent=base
locales=en
styles=css/site.css

# The website's address, from the Keycloak container's environment (the brand link).
siteUrl=${env.ORION_SITE_URL}

# ---- Layout (template.ftl) ----
kcHtmlClass=orion
kcBodyClass=page
kcLoginClass=page-main
kcHeaderClass=site-header
kcHeaderWrapperClass=brand
kcFormCardClass=card
kcFormHeaderClass=card-header
kcSignUpClass=card-info
kcInfoAreaWrapperClass=card-info-body
kcContentWrapperClass=field-group-header
kcMarginTopClass=space-top

## Locale menu (only drawn with internationalisation on)
kcLocaleMainClass=locale
kcLocaleWrapperClass=locale-wrapper
kcLocaleDropDownClass=locale-dropdown
kcLocaleListClass=locale-list
kcLocaleListItemClass=locale-item
kcLocaleItemClass=locale-link

## Messages
kcAlertClass=alert
kcAlertTitleClass=alert-text
kcFeedbackErrorIcon=icon icon-alert
kcFeedbackWarningIcon=icon icon-alert
kcFeedbackSuccessIcon=icon icon-check
kcFeedbackInfoIcon=icon icon-info

# ---- Forms ----
kcFormClass=form
kcFormGroupClass=field
kcFormGroupErrorClass=field-invalid
kcFormGroupHeader=field-group-title
kcLabelWrapperClass=field-label-row
kcLabelClass=field-label
kcInputWrapperClass=field-control
kcInputClass=field-input
kcInputGroup=field-input-group
kcInputErrorMessageClass=field-message field-message-error
kcInputHelperTextBeforeClass=field-help
kcInputHelperTextAfterClass=field-help
kcInputClassRadio=choice
kcInputClassRadioInput=choice-input
kcInputClassRadioLabel=choice-label
kcInputClassCheckbox=choice
kcInputClassCheckboxInput=choice-input
kcInputClassCheckboxLabel=choice-label
kcInputClassRadioCheckboxLabelDisabled=choice-disabled
kcCheckboxInputClass=choice-input
kcFormSettingClass=form-settings
kcFormOptionsClass=form-options
kcFormOptionsWrapperClass=form-options-row
kcFormButtonsClass=form-buttons
kcFormButtonsWrapperClass=form-buttons-row

## Buttons
kcButtonClass=btn
kcButtonPrimaryClass=btn-primary
kcButtonDefaultClass=btn-quiet
kcButtonSecondaryClass=btn-quiet
kcButtonBlockClass=btn-block
kcButtonLargeClass=btn-large

## Password visibility toggle (icons drawn by site.css)
kcFormPasswordVisibilityButtonClass=btn-reveal
kcFormPasswordVisibilityIconShow=icon icon-eye
kcFormPasswordVisibilityIconHide=icon icon-eye-off
kcResetFlowIcon=icon icon-restart

## Identity providers (none in the realm yet; styled so one would not look broken)
kcFormSocialAccountSectionClass=social
kcFormSocialAccountListClass=social-list
kcFormSocialAccountListGridClass=social-grid
kcFormSocialAccountGridItem=social-grid-item
kcFormSocialAccountListButtonClass=btn btn-quiet btn-block social-button
kcFormSocialAccountListButtonDisabledClass=is-disabled
kcFormSocialAccountNameClass=social-name
kcCommonLogoIdP=social-logo
